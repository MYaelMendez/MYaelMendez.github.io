<head>
<meta charset="UTF-8">

<title>teologia.ai — Juan 3:16</title>
<link rel="stylesheet" href="text-effects.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:720px; height:1280px;
    background:#100d08; overflow:hidden;
    font-family:'Cormorant Garamond',serif; color:#d4af37;
  }
  #gl { position:absolute; top:0; left:0; width:720px; height:1280px; }
  .frame {
    position:absolute; top:40px; left:40px; right:40px; bottom:40px;
    border:2px solid rgba(212,175,55,0.25); pointer-events:none; z-index:5;
  }
  .frame::before {
    content:''; position:absolute; top:8px; left:8px; right:8px; bottom:8px;
    border:1px solid rgba(212,175,55,0.12);
  }
  .content {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; z-index:6; padding:0 70px; pointer-events:none;
  }
  .glyph {
    font-family:'Cinzel',serif; font-size:76px; font-weight:900;
    color:#f0d878; text-shadow:0 0 50px rgba(212,175,55,0.8), 0 0 12px rgba(240,216,120,1);
    line-height:1; margin-bottom:20px;
  }
  .title {
    font-family:'Cinzel',serif; font-size:46px; font-weight:900;
    letter-spacing:10px; margin-bottom:12px;
  }
  .tagline {
    font-family:'Cinzel',serif; font-size:14px; letter-spacing:5px;
    color:rgba(240,216,120,0.8); margin-bottom:44px;
    text-shadow:0 1px 3px rgba(0,0,0,0.9);
  }
  .orn {
    width:240px; height:2px; margin:0 auto 44px;
    background:linear-gradient(90deg,transparent,rgba(240,216,120,0.7),transparent);
  }
  .verse {
    font-family:'Cormorant Garamond',serif; font-size:27px; line-height:1.75;
    color:#f2e3a8; font-style:italic; margin-bottom:44px;
    text-shadow:0 2px 6px rgba(0,0,0,0.95);
  }
  .verse .hl { color:#f0d878; font-weight:600; font-style:normal; }
  .ref {
    font-family:'Cinzel',serif; font-size:14px; letter-spacing:4px;
    color:rgba(240,216,120,0.7); text-shadow:0 1px 3px rgba(0,0,0,0.9);
  }
  .badge {
    position:absolute; bottom:68px; left:0; width:100%; text-align:center;
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:3px;
    color:rgba(240,216,120,0.55); z-index:7; text-shadow:0 1px 3px rgba(0,0,0,0.9);
  }
</style>

<body>
  <canvas id="gl"></canvas>
  <div class="frame"></div>
  <div class="content">
    <div class="glyph te-glyph">✝</div>
    <div class="title te-title te-shimmer te-glow">JUAN 3:16</div>
    <div class="tagline te-tagline">DE TAL MANERA AMÓ DIOS AL MUNDO</div>
    <div class="orn te-orn"></div>
    <div class="verse te-plate">
      <div class="te-line">Porque de tal manera amó Dios al mundo,</div>
      <div class="te-line">que ha dado a su <span class="hl">Hijo unigénito</span>,</div>
      <div class="te-line">para que todo aquel que en él cree</div>
      <div class="te-line">no se pierda, mas tenga <span class="hl">vida eterna</span>.</div>
    </div>
    <div class="ref te-ref">JUAN 3:16 · BIBLIA DEL OSO 1569</div>
  </div>
  <div class="badge te-badge">æ://TEOLOGIA · THREE.JS · JUAN 3:16 · VERIFICABLE</div>

<script src="../vendor/three.global.js"></script>
<script src="text-effects.js"></script>
<script>
  // ── Three.js r147 — Juan 3:16: "Dio a su Hijo unigénito" ──
  const W = 720, H = 1280;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x100d08);
  scene.fog = new THREE.FogExp2(0x100d08, 0.004);

  const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
  camera.position.set(0, 0, 24);

  const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('gl'),
    antialias: true, alpha: false
  });
  renderer.setSize(W, H, false);
  renderer.setPixelRatio(1);

  // ── Lights ──
  scene.add(new THREE.AmbientLight(0xd4af37, 0.85));
  const key = new THREE.PointLight(0xf0d878, 2.4, 120);
  key.position.set(0, 0, 18);
  scene.add(key);
  const rim = new THREE.PointLight(0xff8844, 1.2, 100);
  rim.position.set(-16, -10, 8);
  scene.add(rim);

  // ── Central golden sphere — "el Hijo unigénito" ──
  const son = new THREE.Mesh(
    new THREE.SphereGeometry(3.0, 48, 48),
    new THREE.MeshStandardMaterial({
      color: 0xd4af37, emissive: 0x8a6a1a,
      metalness: 0.9, roughness: 0.2
    })
  );
  scene.add(son);

  // Glow shell
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xf0d878, transparent: true, opacity: 0.18,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const glowShell = new THREE.Mesh(new THREE.SphereGeometry(3.8, 32, 32), glowMat);
  scene.add(glowShell);

  // ── Cross of light — two emissive bars ──
  const crossMat = new THREE.MeshBasicMaterial({ color: 0xf0d878 });
  const vBar = new THREE.Mesh(new THREE.BoxGeometry(0.35, 7, 0.35), crossMat);
  const hBar = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.35, 0.35), crossMat);
  hBar.position.y = 1.2;
  const cross = new THREE.Group();
  cross.add(vBar); cross.add(hBar);
  cross.position.set(0, 0, -4);
  scene.add(cross);

  // ── Orbiting light ring — "todo aquel que en él cree" ──
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xd4af37, transparent: true, opacity: 0.6
  });
  const ring = new THREE.Mesh(new THREE.TorusGeometry(6.5, 0.06, 8, 128), ringMat);
  ring.rotation.x = Math.PI / 2.3;
  scene.add(ring);

  // ── Faith particles — orbiting points ──
  const P = 700;
  const pos = new Float32Array(P * 3);
  for (let i = 0; i < P; i++) {
    const r = 5 + Math.random() * 12;
    const th = Math.random() * Math.PI * 2;
    const y = (Math.random() - 0.5) * 14;
    pos[i*3]   = r * Math.cos(th);
    pos[i*3+1] = y;
    pos[i*3+2] = r * Math.sin(th);
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const faith = new THREE.Points(pGeo, new THREE.PointsMaterial({
    color: 0xf0d878, size: 0.15, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  scene.add(faith);

  // ── Deterministic frame hook ──
  window.__renderFrame = function(i, total) {
    const t = i / Math.max(1, total - 1);

    // Son sphere pulse
    const sp = 1 + 0.06 * Math.sin(i * 0.05);
    son.scale.setScalar(sp);
    glowShell.scale.setScalar(sp * 1.12);
    glowMat.opacity = 0.14 + 0.07 * Math.sin(i * 0.04);

    // Cross slow rotation + glow
    cross.rotation.y = i * 0.008;
    cross.position.z = -4 + Math.sin(i * 0.02) * 0.5;

    // Ring rotates
    ring.rotation.z = i * 0.006;
    ringMat.opacity = 0.4 + 0.2 * Math.sin(i * 0.03);

    // Faith particles orbit
    faith.rotation.y = i * 0.004;

    // Camera dolly
    camera.position.z = 24 + Math.sin(i * 0.015) * 1.2;

    // Text reveal — frame-driven (CSS keyframes don't advance here)
    if (window.TE) TE.render(i, total);

    renderer.render(scene, camera);
  };

  window.__renderFrame(0, 300);
</script>
