<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>teologia.ai — Génesis 1</title>
<link rel="stylesheet" href="text-effects.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:720px; height:1280px;
    background:#0d0d14; overflow:hidden;
    font-family:'Cormorant Garamond',serif; color:#d4af37;
  }
  #gl { position:absolute; top:0; left:0; width:720px; height:1280px; }
  .frame {
    position:absolute; top:40px; left:40px; right:40px; bottom:40px;
    border:2px solid rgba(212,175,55,0.25); pointer-events:none; z-index:5;
  }
  .frame::before {
    content:''; position:absolute; top:8px; left:8px; right:8px; bottom:8px;
    border:1px solid rgba(212,175,55,0.12);
  }
  .content {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; z-index:6; padding:0 70px; pointer-events:none;
  }
  .glyph {
    font-family:'Cinzel',serif; font-size:80px; font-weight:900;
    color:#f0d878; text-shadow:0 0 50px rgba(212,175,55,0.8), 0 0 12px rgba(240,216,120,1);
    line-height:1; margin-bottom:20px;
  }
  .title {
    font-family:'Cinzel',serif; font-size:48px; font-weight:900;
    letter-spacing:10px; margin-bottom:12px;
  }
  .tagline {
    font-family:'Cinzel',serif; font-size:15px; letter-spacing:6px;
    color:rgba(240,216,120,0.8); margin-bottom:44px;
    text-shadow:0 1px 3px rgba(0,0,0,0.9);
  }
  .orn {
    width:240px; height:2px; margin:0 auto 44px;
    background:linear-gradient(90deg,transparent,rgba(240,216,120,0.7),transparent);
  }
  .verse {
    font-family:'Cormorant Garamond',serif; font-size:28px; line-height:1.75;
    color:#f2e3a8; font-style:italic; margin-bottom:44px;
    text-shadow:0 2px 6px rgba(0,0,0,0.95);
  }
  .verse .hl { color:#f0d878; font-weight:600; font-style:normal; }
  .ref {
    font-family:'Cinzel',serif; font-size:14px; letter-spacing:4px;
    color:rgba(240,216,120,0.7); text-shadow:0 1px 3px rgba(0,0,0,0.9);
  }
  .badge {
    position:absolute; bottom:68px; left:0; width:100%; text-align:center;
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:3px;
    color:rgba(240,216,120,0.55); z-index:7; text-shadow:0 1px 3px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="frame"></div>
  <div class="content">
    <div class="glyph te-glyph">✷</div>
    <div class="title te-title te-shimmer te-glow">GÉNESIS 1</div>
    <div class="tagline te-tagline">EN EL PRINCIPIO</div>
    <div class="orn te-orn"></div>
    <div class="verse te-plate">
      <div class="te-line"><span class="hl">En el principio</span> creó Dios</div>
      <div class="te-line">los cielos y la tierra.</div>
      <div class="te-gap"></div>
      <div class="te-line">Y dijo Dios: <span class="hl">Sea la luz</span>;</div>
      <div class="te-line">y fue la luz.</div>
    </div>
    <div class="ref te-ref">GÉNESIS 1:1-3 · BIBLIA DEL OSO 1569</div>
  </div>
  <div class="badge te-badge">æ://TEOLOGIA · THREE.JS · GÉNESIS 1 · VERIFICABLE</div>

<script src="../vendor/three.global.js"></script>
<script src="text-effects.js"></script>
<script>
  // ── Three.js r147 — Génesis 1: "Sea la luz" ──
  const W = 720, H = 1280;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0d14);
  scene.fog = new THREE.FogExp2(0x0d0d14, 0.004);

  const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
  camera.position.set(0, 0, 24);

  const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('gl'),
    antialias: true, alpha: false
  });
  renderer.setSize(W, H, false);
  renderer.setPixelRatio(1);

  // ── Lights ──
  scene.add(new THREE.AmbientLight(0x334466, 0.9));
  const key = new THREE.PointLight(0xf0d878, 2.5, 120);
  key.position.set(0, 0, 18);
  scene.add(key);
  const rim = new THREE.PointLight(0x4488ff, 1.4, 100);
  rim.position.set(-16, -10, 8);
  scene.add(rim);

  // ── Central light sphere — "Sea la luz" ──
  const lightSphere = new THREE.Mesh(
    new THREE.SphereGeometry(2.8, 48, 48),
    new THREE.MeshBasicMaterial({ color: 0xf0d878 })
  );
  scene.add(lightSphere);

  // Glow shell
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xd4af37, transparent: true, opacity: 0.15,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const glowShell = new THREE.Mesh(new THREE.SphereGeometry(3.6, 32, 32), glowMat);
  scene.add(glowShell);

  // ── Firmament ring ──
  const firmMat = new THREE.MeshBasicMaterial({
    color: 0xd4af37, transparent: true, opacity: 0.5
  });
  const firmRing = new THREE.Mesh(new THREE.TorusGeometry(7, 0.08, 8, 128), firmMat);
  firmRing.rotation.x = Math.PI / 2;
  scene.add(firmRing);

  // ── Waters above — blue particles ──
  const WA = 500;
  const wPos = new Float32Array(WA * 3);
  for (let i = 0; i < WA; i++) {
    const r = 4 + Math.random() * 14;
    const th = Math.random() * Math.PI * 2;
    wPos[i*3]   = r * Math.cos(th);
    wPos[i*3+1] = 3 + Math.random() * 10;
    wPos[i*3+2] = r * Math.sin(th);
  }
  const wGeo = new THREE.BufferGeometry();
  wGeo.setAttribute('position', new THREE.BufferAttribute(wPos, 3));
  const watersAbove = new THREE.Points(wGeo, new THREE.PointsMaterial({
    color: 0x4488ff, size: 0.14, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  scene.add(watersAbove);

  // ── Waters below — darker blue particles ──
  const WB = 500;
  const bPos = new Float32Array(WB * 3);
  for (let i = 0; i < WB; i++) {
    const r = 4 + Math.random() * 14;
    const th = Math.random() * Math.PI * 2;
    bPos[i*3]   = r * Math.cos(th);
    bPos[i*3+1] = -3 - Math.random() * 10;
    bPos[i*3+2] = r * Math.sin(th);
  }
  const bGeo = new THREE.BufferGeometry();
  bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
  const watersBelow = new THREE.Points(bGeo, new THREE.PointsMaterial({
    color: 0x2244aa, size: 0.12, transparent: true, opacity: 0.6,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  scene.add(watersBelow);

  // ── Abyss — dark wireframe sphere below ──
  const abyss = new THREE.Mesh(
    new THREE.IcosahedronGeometry(10, 2),
    new THREE.MeshBasicMaterial({ color: 0x112244, wireframe: true, transparent: true, opacity: 0.12 })
  );
  abyss.position.y = -8;
  scene.add(abyss);

  // ── Deterministic frame hook ──
  window.__renderFrame = function(i, total) {
    const t = i / Math.max(1, total - 1);

    // Light pulse
    const lp = 1 + 0.08 * Math.sin(i * 0.05);
    lightSphere.scale.setScalar(lp);
    glowShell.scale.setScalar(lp * 1.1);
    glowMat.opacity = 0.12 + 0.06 * Math.sin(i * 0.04);

    // Firmament expands + rotates
    const fr = 1 + t * 0.3;
    firmRing.scale.set(fr, fr, 1);
    firmRing.rotation.z = i * 0.004;
    firmMat.opacity = 0.3 + 0.2 * Math.sin(i * 0.03);

    // Waters drift
    watersAbove.rotation.y = i * 0.002;
    watersBelow.rotation.y = -i * 0.002;
    watersAbove.position.y = Math.sin(i * 0.02) * 0.5;
    watersBelow.position.y = -Math.sin(i * 0.02) * 0.5;

    // Abyss slow rotation
    abyss.rotation.y = i * 0.001;
    abyss.rotation.x = i * 0.0005;

    // Camera dolly
    camera.position.z = 24 + Math.sin(i * 0.015) * 1.2;

    // Text reveal — frame-driven (CSS keyframes don't advance here)
    if (window.TE) TE.render(i, total);

    renderer.render(scene, camera);
  };

  window.__renderFrame(0, 300);
</script>
