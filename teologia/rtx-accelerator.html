<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>æ:// RTX Three.js Accelerator — teologia.ai</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#050505;
    font-family:'JetBrains Mono',monospace;
    color:#d4af37;
    overflow:hidden;
    height:100vh;
  }
  #gpu-info{
    position:fixed;top:12px;left:12px;
    background:rgba(10,10,10,0.85);
    border:1px solid #D4AF37;
    border-radius:4px;
    padding:8px 12px;
    font-size:11px;
    line-height:1.6;
    color:#d4af37;
    z-index:10;
  }
  #gpu-info b{color:#f0d878;}
  #stats{
    position:fixed;bottom:12px;left:12px;
    background:rgba(10,10,10,0.85);
    border:1px solid #D4AF37;
    border-radius:4px;
    padding:8px 12px;
    font-size:11px;
    line-height:1.6;
    color:#aaa;
    z-index:10;
  }
  #stats b{color:#f0d878;}
  #qr-badge{
    position:fixed;bottom:12px;right:12px;
    width:44px;height:44px;
    background:rgba(10,10,10,0.85);
    border:1px solid #D4AF37;
    border-radius:6px;
    padding:2px;
    cursor:pointer;
    z-index:10;
    transition:transform .2s;
  }
  #qr-badge:hover{transform:scale(1.1);box-shadow:0 0 20px rgba(212,175,55,0.4)}
  #qr-badge img{width:100%;height:100%;display:block;border-radius:4px}
  #qr-tooltip{
    position:fixed;bottom:64px;right:12px;
    background:#1a1a1a;
    border:1px solid #D4AF37;
    border-radius:4px;
    padding:6px 10px;
    font-size:9px;
    color:#aaa;
    white-space:nowrap;
    opacity:0;visibility:hidden;
    transition:opacity .2s;
    z-index:10;
  }
  #qr-badge:hover #qr-tooltip{opacity:1;visibility:visible}
  #title{
    position:fixed;top:12px;right:12px;
    font-family:'Cinzel',serif;
    font-size:18px;font-weight:900;
    color:#d4af37;text-shadow:0 0 15px rgba(212,175,55,0.5);
    z-index:10;
  }
  #title span{font-size:12px;color:#888;display:block;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>

<div id="title">æ:// RTX<br><span>50K Instanced Cubes · WebGL2 · NVENC Ready</span></div>
<div id="gpu-info">
  <b>GPU:</b> <span id="gpu-name">Detecting...</span><br>
  <b>WebGL:</b> <span id="gl-version">...</span><br>
  <b>Objects:</b> <span id="obj-count">0</span><br>
  <b>Instances:</b> <span id="inst-count">0</span><br>
  <b>Mode:</b> <span id="render-mode">deterministic</span>
</div>
<div id="stats">
  <b>FPS:</b> <span id="fps">0</span><br>
  <b>Frame:</b> <span id="frame">0</span> / <span id="total">450</span><br>
  <b>VRAM:</b> <span id="vram">0</span> MiB<br>
  <b>Dice:</b> <span id="dice">6</span>
</div>
<div id="qr-badge">
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=48x48&data=https://myaelmendez.github.io/threejs-curriculum/rtx-threejs-accelerator.html&color=D4AF37&bgcolor=050505" alt="QR">
  <div id="qr-tooltip">Verify via QR</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js';

// æ:// RTX Acceleration Config
const CONFIG = {
  INSTANCE_COUNT: 50000,
  SEGMENTS: 6,
  DICE_SIZE: 0.8,
  ANIM_SPEED: 0.01,
  DETERMINISTIC: true,
  USE_WEBGL2: true,
  MAX_FPS: 120,
};

let scene, camera, renderer;
let instancedMesh;
let clock = new THREE.Clock();
let frameCount = 0;
let totalFrames = 450;
let fpsTime = 0;
let fpsFrames = 0;
let lastTime = 0;
let cubePositions = [];
let cubeRotations = [];
let cubeScales = [];
let cubeRandom = [];
let dummy = new THREE.Object3D();

const diceGeometry = new THREE.BoxGeometry(CONFIG.DICE_SIZE, CONFIG.DICE_SIZE, CONFIG.DICE_SIZE, CONFIG.SEGMENTS, CONFIG.SEGMENTS, CONFIG.SEGMENTS);

const diceMaterial = new THREE.MeshStandardMaterial({
  color: 0x050505,
  metalness: 0.9,
  roughness: 0.1,
  emissive: 0x1a0d00,
  emissiveIntensity: 0.5,
  transparent: false,
});

const edgeMaterial = new THREE.LineBasicMaterial({ color: 0xD4AF37 });
const edgeGeometry = new THREE.EdgesGeometry(diceGeometry);
const edgeLines = new THREE.LineSegments(edgeGeometry);

const rimLight = new THREE.SpotLight(0xD4AF37, 1.5, 20, 0.3, 0.5);

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);
  scene.fog = new THREE.FogExp2(0x050505, 0.08);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 40);

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance',
    preserveDrawingBuffer: false,
    stencil: true,
    depth: true,
  });
  renderer.setPixelRatio(window.devicePixelRatio > 1 ? 1.5 : 1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x050505, 1);
  renderer.outputEncoding = THREE.SRGBColorEncoding;
  document.body.appendChild(renderer.domElement);

  const gl = renderer.getContext();
  document.getElementById('gl-version').textContent = gl.getParameter(gl.VERSION);

  const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
  if (debugInfo) {
    const gpuName = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
    document.getElementById('gpu-name').textContent = gpuName || 'Unknown';
  }

  const ambient = new THREE.AmbientLight(0x404040, 2);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xD4AF37, 2);
  dirLight.position.set(10, 20, 15);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const pointLight = new THREE.PointLight(0xD4AF37, 1, 50);
  pointLight.position.set(-10, -10, 10);
  scene.add(pointLight);

  rimLight.position.set(0, 10, -10);
  scene.add(rimLight);

  // Create 50K instanced cubes
  instancedMesh = new THREE.InstancedMesh(diceGeometry, diceMaterial, CONFIG.INSTANCE_COUNT);
  scene.add(instancedMesh);

  // Initialize cube data
  for (let i = 0; i < CONFIG.INSTANCE_COUNT; i++) {
    const x = (Math.random() - 0.5) * 60;
    const y = (Math.random() - 0.5) * 60;
    const z = (Math.random() - 0.5) * 60;
    cubePositions.push({ x, y, z });
    cubeRotations.push({ x: Math.random() * Math.PI * 2, y: Math.random() * Math.PI * 2, z: Math.random() * Math.PI * 2 });
    cubeScales.push(0.5 + Math.random() * 1.5);
    cubeRandom.push(Math.floor(Math.random() * 6) + 1);
  }

  document.getElementById('obj-count').textContent = CONFIG.INSTANCE_COUNT.toLocaleString();
  document.getElementById('inst-count').textContent = CONFIG.INSTANCE_COUNT.toLocaleString();
  document.getElementById('total').textContent = totalFrames;

  // Deterministic render hook
  window.__renderFrame = (i, total) => {
    const t = i / Math.max(1, total - 1);
    updateScene(t);
    renderer.render(scene, camera);
    return true;
  };

  animate();
}

function updateScene(t) {
  const time = t * Math.PI * 2;

  for (let i = 0; i < CONFIG.INSTANCE_COUNT; i++) {
    const pos = cubePositions[i];
    const rot = cubeRotations[i];
    const scale = cubeScales[i];

    dummy.position.set(
      pos.x + Math.sin(time + i * 0.01) * 2,
      pos.y + Math.cos(time + i * 0.02) * 2,
      pos.z + Math.sin(time + i * 0.03) * 2
    );

    dummy.rotation.set(
      rot.x + time * 0.5,
      rot.y + time * 0.3,
      rot.z + time * 0.2
    );

    dummy.scale.setScalar(scale);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);
  }

  instancedMesh.instanceMatrix.needsUpdate = true;

  // Camera orbit
  camera.position.x = Math.sin(time * 0.5) * 40;
  camera.position.z = Math.cos(time * 0.5) * 40;
  camera.lookAt(0, 0, 0);
}

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const delta = (now - lastTime) / 1000;
  lastTime = now;

  fpsTime += delta;
  fpsFrames++;

  if (fpsTime >= 1) {
    document.getElementById('fps').textContent = Math.round(fpsFrames / fpsTime);
    fpsTime = 0;
    fpsFrames = 0;
  }

  if (CONFIG.DETERMINISTIC && window.__renderFrame) {
    // Harness owns the clock — don't render here
    return;
  }

  updateScene(clock.getElapsedTime());
  renderer.render(scene, camera);

  frameCount++;
  document.getElementById('frame').textContent = frameCount;
}

// VRAM estimation
function estimateVRAM() {
  const geometrySize = diceGeometry.attributes.position.array.length * 4;
  const matrixSize = CONFIG.INSTANCE_COUNT * 16 * 4;
  const totalMB = ((geometrySize + matrixSize) / 1048576).toFixed(1);
  document.getElementById('vram').textContent = totalMB;
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
estimateVRAM();
</script>
</body>
</html>
