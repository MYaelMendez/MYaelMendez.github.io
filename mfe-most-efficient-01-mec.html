<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#050505"/>
<title>mfe · most efficient film</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --void:#050505;--gold:#D4AF37;--gold-dim:rgba(212,175,55,.10);
  --gold-glow:rgba(212,175,55,.30);--neon:#00ff9d;
  --ink:#f0ece4;--muted:rgba(240,236,228,.34);--border:rgba(212,175,55,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);
  font-family:'JetBrains Mono',monospace;color:var(--ink);}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(212,175,55,.010) 2px 3px);}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(5,5,5,.92) 100%);}
.monitor{position:relative;z-index:5;width:min(100vw,620px);aspect-ratio:5/8;
  background:linear-gradient(180deg,rgba(212,175,55,.07),rgba(5,5,5,.97));
  border:1px solid var(--border);border-radius:2px;overflow:hidden;
  box-shadow:0 0 60px var(--gold-glow),inset 0 0 80px rgba(212,175,55,.04);
  display:flex;flex-direction:column;}
.video-wrap{position:relative;flex:1;min-width:0;min-height:0;background:var(--void);overflow:hidden;}
.video-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
.overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
  pointer-events:none;padding:14px 16px 12px;}
.overlay .prompt{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;
  color:var(--gold);text-shadow:0 0 8px var(--gold-glow);display:flex;gap:6px;align-items:center;}
.overlay .prompt .curs{color:var(--neon);}
.overlay .title{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;letter-spacing:1px;
  color:var(--gold);text-shadow:0 0 12px var(--gold-glow);margin-top:4px;line-height:1.05;}
.overlay .divider{height:1px;background:var(--border);margin:6px 0 8px;}
.overlay .prog{width:100%;height:6px;border:1px solid var(--border);background:var(--void);
  border-radius:2px;overflow:hidden;pointer-events:auto;}
.overlay .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--neon));
  border-radius:2px;transition:width .032s linear;}
.overlay .foot{font-size:11px;letter-spacing:1px;color:var(--muted);display:flex;justify-content:space-between;}
.overlay .foot b{color:var(--gold);font-weight:700;}
.controls{margin-top:8px;width:min(100vw,620px);display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:rgba(5,5,5,.86);border:1px solid var(--border);border-radius:2px;}
.controls button{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;
  color:var(--ink);background:var(--void);border:1px solid var(--border);border-radius:2px;
  cursor:pointer;padding:4px 10px;transition:.12s;}
.controls button:hover{border-color:var(--gold);color:var(--gold);}
.controls .fps{font-size:11px;color:var(--muted);letter-spacing:1px;}
.controls .frame{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1px;}
</style>
</head>
<body>
<div class="monitor">
  <div class="video-wrap">
    <video id="v" autoplay loop playsinline poster="mfe-most-efficient-01-mec.mp4">
      <source src="mfe-most-efficient-01-mec.mp4" type="video/mp4"/>
    </video>
    <div class="overlay">
      <div class="prompt"><span class="curs">&gt;_</span><span class="curs" style="color:var(--neon)">&nbsp;</span><span>AETHER</span></div>
      <div class="title">most efficient</div>
      <div class="divider"></div>
      <div class="prog"><i id="p2"></i></div>
      <div class="foot"><span><b id="f1"></b></span><span><b id="f2"></b></span></div>
    </div>
  </div>
</div>
<div class="controls">
  <button id="pb">▶ play</button>
  <button id="rs">⟲ reset</button>
  <button id="lu">⊘ loop</button>
  <span class="fps">640×1024 · 30 fps · 4.0 s · h264_nvenc</span>
  <span class="frame" id="fpsf">0 fps</span>
</div>
<script>
var v=document.getElementById('v'),pb=document.getElementById('pb');
var p2=document.getElementById('p2'),f1=document.getElementById('f1'),f2=document.getElementById('f2'),fpsf=document.getElementById('fpsf');
var n=0,isLoop=true;
pb.onclick=function(){v.paused?v.play():v.pause();pb.textContent=v.paused?'▶ play':'⏸ pause';};
document.getElementById('rs').onclick=function(){v.currentTime=0;n=0;update();pb.textContent='▶ play';};
document.getElementById('lu').onclick=function(){isLoop=!isLoop;v.loop=isLoop;};
function update(){n++;fpsf.textContent=n/v.playbackRate+' fps';}
v.addEventListener('timeupdate',function(){var t=v.currentTime,s=Math.round(t/4*120);p2.style.width=(s/120*100)+'%';f2.textContent='t '+v.currentTime.toFixed(2)+'s';if(s>=120&&isLoop){v.currentTime=0;n=0;}if(!v.paused)update();});
v.addEventListener('play',function(){n=0;});
v.addEventListener('ended',function(){if(isLoop){v.currentTime=0;n=0;update();}});
setInterval(update,1000);
</script>
</body>
</html>
