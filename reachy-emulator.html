<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#050505"/>
<title>Reachy Clerk Emulator • $OS</title>
<meta name="description" content="Reachy Clerk emulator for $OS: economic infrastructure for agentic entrepreneurship."/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--void:#050505;--gold:#D4AF37;--neon:#00ff9d;--ink:#f0ece4;--muted:rgba(240,236,228,.45);--line:rgba(212,175,55,.22);--hot:rgba(212,175,55,.62);--stripe:#635bff;--red:#ff4d4d;--blue:#3aa7ff;--glow:rgba(212,175,55,.34)}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100dvh;background:var(--void);color:var(--ink);font-family:'JetBrains Mono',monospace;overflow:hidden}body{display:flex;justify-content:center}canvas#mesh{position:fixed;inset:0;z-index:0}.scan{position:fixed;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(transparent 0 2px,rgba(212,175,55,.014) 2px 4px)}.vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 34%,rgba(5,5,5,.93) 100%)}
.app{position:relative;z-index:10;width:min(100vw,480px);height:100dvh;padding:14px 14px 18px;display:grid;grid-template-rows:auto 1fr auto;gap:10px}.bar{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:8px 10px;font-size:8px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}.live{display:flex;gap:5px;align-items:center;color:var(--neon)}.dot{width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.45s infinite}@keyframes pulse{50%{opacity:.25}}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:0}.title{font-family:'Orbitron';font-weight:900;color:var(--gold);font-size:clamp(20px,6vw,36px);letter-spacing:1.4px;text-shadow:0 0 24px var(--glow);text-align:center}.sub{font-size:10px;color:var(--muted);letter-spacing:1px;text-align:center;line-height:1.4}.robot{width:min(86vw,360px);aspect-ratio:1/1.05;position:relative;display:flex;align-items:center;justify-content:center}.halo{position:absolute;inset:2%;border:1px solid var(--line);border-radius:50%;box-shadow:0 0 70px rgba(212,175,55,.08),inset 0 0 50px rgba(212,175,55,.04)}.head{width:82%;height:64%;border:1px solid var(--hot);border-radius:44% 44% 50% 50%;background:linear-gradient(180deg,rgba(212,175,55,.08),rgba(0,0,0,.78));box-shadow:0 0 42px rgba(212,175,55,.12);position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center;justify-content:center;padding:0 28px}.antenna{position:absolute;top:-18%;left:50%;width:2px;height:22%;background:var(--line);transform-origin:bottom}.a1{transform:translateX(-34px) rotate(-24deg)}.a2{transform:translateX(34px) rotate(24deg)}.tip{position:absolute;top:-7px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}.eye{aspect-ratio:1/1;border-radius:50%;border:1px solid var(--hot);background:radial-gradient(circle at 50% 48%,rgba(212,175,55,.16),rgba(0,0,0,.86) 58%);display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Orbitron';font-weight:900;color:var(--gold);font-size:clamp(19px,7vw,34px);letter-spacing:1px;box-shadow:0 0 28px rgba(212,175,55,.14),inset 0 0 28px rgba(212,175,55,.07);overflow:hidden}.eye.small{font-size:clamp(15px,5vw,25px)}.eye.purple{border-color:rgba(99,91,255,.8);color:#b9b5ff;box-shadow:0 0 30px rgba(99,91,255,.35)}.eye.green{border-color:rgba(0,255,157,.75);color:var(--neon);box-shadow:0 0 30px rgba(0,255,157,.28)}.eye.red{border-color:rgba(255,77,77,.8);color:var(--red);box-shadow:0 0 30px rgba(255,77,77,.28)}.blink{animation:blinkbar 1.05s step-end infinite}@keyframes blinkbar{50%{opacity:.15}}.mouth{position:absolute;left:50%;bottom:16%;width:76px;height:1px;background:var(--line);transform:translateX(-50%);box-shadow:0 0 10px var(--glow)}
.ticker{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.48);padding:9px 10px;min-height:58px;display:flex;flex-direction:column;gap:5px}.ticker b{color:var(--gold)}.ticker .line{font-size:10px;line-height:1.35;color:var(--ink)}.ticker .mini{font-size:8px;color:var(--muted);letter-spacing:.8px}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}.btn{border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--ink);font-family:'JetBrains Mono';font-size:10px;padding:10px 8px;border-radius:6px;cursor:pointer}.btn:hover{border-color:var(--hot);color:var(--gold)}.btn.hot{background:var(--gold);color:#000;font-weight:700}.btn.stripe{background:linear-gradient(90deg,var(--gold),var(--stripe));color:#000;font-weight:700}.foot{display:flex;flex-direction:column;gap:7px;align-items:center}.install{width:100%;border:1px solid var(--hot);padding:10px;background:rgba(5,5,5,.72);font-size:9px;line-height:1.45;word-break:break-all;cursor:pointer}.install span{color:var(--gold)}.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:8px}.links a{color:var(--muted);text-decoration:none}.links a:hover{color:var(--gold)}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(70px);z-index:99;background:var(--gold);color:#000;font-weight:700;font-size:10px;letter-spacing:1px;padding:10px 16px;border-radius:6px;transition:.25s}.toast.show{transform:translateX(-50%) translateY(0)}
@media(min-aspect-ratio:1/1){.app{width:min(100vw,900px);grid-template-columns:1.05fr .95fr;grid-template-rows:auto 1fr auto}.bar,.foot{grid-column:1/-1}.stage{grid-column:1/2}.side{grid-column:2/3;display:flex;flex-direction:column;justify-content:center;gap:12px}.robot{width:min(42vw,380px)}}@media(max-aspect-ratio:1/1){.side{width:100%;display:flex;flex-direction:column;gap:10px}.controls{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<canvas id="mesh"></canvas><div class="scan"></div><div class="vig"></div>
<div class="app">
<header class="bar"><span>Reachyᴿ Clerk</span><span>$OS</span><span class="live"><i class="dot"></i>EMULATOR</span></header>
<main class="stage">
  <h1 class="title">Reachy Clerk</h1>
  <p class="sub">physical face for <b style="color:var(--gold)">$OS</b><br/>economic infrastructure for agentic entrepreneurship</p>
  <section class="robot" aria-label="Reachy Clerk emulator">
    <div class="halo"></div>
    <div class="head">
      <div class="antenna a1"><i class="tip"></i></div><div class="antenna a2"><i class="tip"></i></div>
      <div id="eyeL" class="eye">&gt;_æ</div>
      <div id="eyeR" class="eye blink">|</div>
      <div class="mouth"></div>
    </div>
  </section>
</main>
<aside class="side">
  <section class="ticker"><div id="state" class="line"><b>&gt;_æ|</b> agentic prompt live</div><div id="caption" class="mini">Reachy is ready to explain #startabusiness.</div></section>
  <section class="controls">
    <button class="btn hot" onclick="setMode('start')">#start</button>
    <button class="btn" onclick="setMode('hermes')">^h route</button>
    <button class="btn stripe" onclick="setMode('stripe')">^s cash</button>
    <button class="btn" onclick="setMode('formation')">#formation</button>
    <button class="btn" onclick="setMode('os250')">$OS#250</button>
    <button class="btn" onclick="autoDemo()">auto demo</button>
  </section>
</aside>
<footer class="foot">
  <div class="install" onclick="copyCmd()">$ <span>hermes skills install https://myaelmendez.github.io/SKILL.md</span></div>
  <nav class="links"><a href="./ae/">æ viewport</a><a href="./SUBMISSION.md">submission</a><a href="./domain-stack.json">domain stack</a></nav>
</footer>
</div><div id="toast" class="toast">✓ copied</div>
<script>
const modes={
start:{l:'>_æ',r:'|',cls:'eye blink',state:'<b>>_æ|</b> agentic prompt live',cap:'Reachy is ready to explain #startabusiness.'},
hermes:{l:'^h',r:'route',cls:'eye green small',state:'<b>Hermesᴴ</b> conductor routing context',cap:'Hermes conducts the blueprint, tools, skills, and provider paths.'},
stripe:{l:'^s',r:'$✓',cls:'eye purple',state:'<b>Stripe$</b> cash-register context',cap:'Stripe is the economics platform. Reachy routes; it never handles secrets.'},
formation:{l:'#dao',r:'⚖',cls:'eye green',state:'<b>#formation</b> blueprint → ^atlas / ^doola',cap:'Formation is provider-pluggable and user-controlled.'},
os250:{l:'$OS',r:'250',cls:'eye small',state:'<b>$OS#250🇺🇸</b> economic infrastructure for 250 businesses',cap:'We embody #opensourceware and equip new business owners with care.'}
};
function setMode(k){const m=modes[k];eyeL.textContent=m.l;eyeR.textContent=m.r;eyeL.className=m.cls;eyeR.className=m.cls+(k==='start'?' blink':'');state.innerHTML=m.state;caption.textContent=m.cap}
function autoDemo(){let seq=['start','hermes','stripe','formation','os250','start'],i=0;setMode(seq[i++]);let id=setInterval(()=>{setMode(seq[i++]);if(i>=seq.length)clearInterval(id)},1700)}
function copyCmd(){navigator.clipboard&&navigator.clipboard.writeText('hermes skills install https://myaelmendez.github.io/SKILL.md');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}
const cvs=document.getElementById('mesh'),ctx=cvs.getContext('2d'),DPR=Math.min(devicePixelRatio||1,2);let W,H,nodes=[];function resize(){W=cvs.width=innerWidth*DPR;H=cvs.height=innerHeight*DPR;cvs.style.width=innerWidth+'px';cvs.style.height=innerHeight+'px'}function init(){resize();const c=Math.floor(W*H/24000)+20;nodes=Array.from({length:c},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22*DPR,vy:(Math.random()-.5)*.22*DPR,r:(1+Math.random()*1.3)*DPR,ph:Math.random()*6.28}))}init();addEventListener('resize',init);const CD=94*DPR;function draw(now){ctx.fillStyle='rgba(5,5,5,.16)';ctx.fillRect(0,0,W,H);const t=now*.001;nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1});ctx.lineWidth=.4*DPR;for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y;if(Math.abs(dx)>CD||Math.abs(dy)>CD)continue;const d=Math.hypot(dx,dy);if(d<CD){ctx.strokeStyle=`rgba(212,175,55,${(1-d/CD)*.12})`;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke()}}nodes.forEach(n=>{const p=.55+Math.sin(t*1.5+n.ph)*.45;ctx.fillStyle=`rgba(212,175,55,${.16+p*.25})`;ctx.beginPath();ctx.arc(n.x,n.y,n.r*p,0,6.28);ctx.fill()});requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
</body>
</html>
