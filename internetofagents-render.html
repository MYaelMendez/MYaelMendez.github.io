<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Internet of Agents · Render</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:#050505;overflow:hidden}
#mesh{position:fixed;inset:0;z-index:9999}
</style>
</head>
<body>
<canvas id="mesh"></canvas>
<script>
// ── MAXIMUM MOTION mesh background (2D canvas, deterministic) ──
(function() {
  const canvas = document.getElementById('mesh');
  const ctx = canvas.getContext('2d');
  let width, height;

  function resize() {
    width = window.innerWidth || 1280;
    height = window.innerHeight || 720;
    canvas.width = width;
    canvas.height = height;
  }

  function drawMesh(t) {
    ctx.clearRect(0, 0, width, height);

    // Bright gold-on-void background - animated
    const bgPhase = t * 0.15;
    const grad = ctx.createRadialGradient(width*0.5, height*0.5, 0, width*0.5, height*0.5, width*0.9);
    grad.addColorStop(0, 'rgba(255,255,240,0.95)');
    grad.addColorStop(0.3, 'rgba(255,245,210,0.55)');
    grad.addColorStop(0.6, 'rgba(255,225,160,0.3)');
    grad.addColorStop(1, 'rgba(40,30,15,0.2)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Nodes (7 agents) - EXTREME MOTION
    const agents = [
      {id:'victus', baseX:0.3, baseY:0.4, color:0xD4AF37, phase:0, orbitR:0.18, speed:0.8},
      {id:'teknium', baseX:0.15, baseY:0.25, color:0x00FF9D, phase:1.2, orbitR:0.22, speed:1.1},
      {id:'webbot', baseX:0.45, baseY:0.2, color:0x8367FF, phase:2.4, orbitR:0.15, speed:1.4},
      {id:'caia', baseX:0.1, baseY:0.7, color:0xFF7A18, phase:3.6, orbitR:0.25, speed:0.6},
      {id:'tee', baseX:0.6, baseY:0.15, color:0x00EAFF, phase:4.8, orbitR:0.12, speed:1.6},
      {id:'vela', baseX:0.5, baseY:0.6, color:0xFF4D5F, phase:6.0, orbitR:0.2, speed:0.9},
      {id:'ceres', baseX:0.75, baseY:0.65, color:0xC8A24A, phase:7.2, orbitR:0.18, speed:1.2}
    ];

    // ANIMATE POSITIONS - LARGE CIRCULAR ORBITS
    for (let i = 0; i < agents.length; i++) {
      const a = agents[i];
      a.x = a.baseX + Math.sin(t * a.speed + a.phase) * a.orbitR;
      a.y = a.baseY + Math.cos(t * a.speed + a.phase) * a.orbitR;
      // Extra wobble
      a.x += Math.sin(t * 2.3 + a.phase * 3) * 0.03;
      a.y += Math.cos(t * 1.7 + a.phase * 2) * 0.03;
      a.x = Math.max(0.05, Math.min(0.95, a.x));
      a.y = Math.max(0.05, Math.min(0.95, a.y));
    }

    // Connecting lines - thick and animated
    for (let i = 0; i < agents.length; i++) {
      for (let j = i + 1; j < agents.length; j++) {
        const a = agents[i], b = agents[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const alpha = Math.max(0.3, 0.85 - dist * 0.25);
        ctx.strokeStyle = `rgba(${a[0]},${a[1]},${a[2]},${alpha})`;
        ctx.lineWidth = 3 + 2 * Math.sin(t * 3 + i + j);
        ctx.beginPath();
        ctx.moveTo(a.x*width, a.y*height);
        ctx.lineTo(b.x*width, b.y*height);
        ctx.stroke();
      }
    }

    // Draw nodes with STRONG PULSING
    for (let i = 0; i < agents.length; i++) {
      const a = agents[i];
      // Multi-frequency pulsing
      const pulse = 1.0 + 0.4 * Math.sin(t * 6 + i * 1.8) + 0.25 * Math.sin(t * 4.3 + i * 2.1) + 0.15 * Math.sin(t * 8.7 + i * 0.7);
      const r = 28 * pulse;
      const cx = a.x * width, cy = a.y * height;

      // Outer glow ring - pulsing width
      ctx.strokeStyle = `rgba(${a[0]},${a[1]},${a[2]},${0.8 + 0.2 * Math.sin(t * 5 + i)})`;
      ctx.lineWidth = 4 + 2 * Math.sin(t * 4 + i);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

      // Inner glow
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, 'rgba(255,255,255,0.85)');
      grad.addColorStop(0.25, `rgba(${a[0]},${a[1]},${a[2]},1.0)`);
      grad.addColorStop(0.5, `rgba(${a[0]},${a[1]},${a[2]},0.9)`);
      grad.addColorStop(0.75, `rgba(${a[0]},${a[1]},${a[2]},0.7)`);
      grad.addColorStop(1, `rgba(${a[0]},${a[1]},${a[2]},0.1)`);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

      // Core
      ctx.fillStyle = 'rgba(5,5,5,0.25)';
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2); ctx.fill();

      // Label
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.font = 'bold 13px JetBrains Mono, monospace';
      ctx.fillText(a.id, cx - 12, cy + 8);
    }

    // HIGH MOTION PARTICLES - sweeping waves
    for (let p = 0; p < 100; p++) {
      const phase = p * 0.25;
      // Horizontal sweep with multiple frequencies
      const h1 = Math.sin(t * 0.6 + phase) * 0.48;
      const h2 = Math.sin(t * 1.1 + phase * 1.7) * 0.25;
      const h3 = Math.sin(t * 0.3 + phase * 0.5) * 0.1;
      const px = (0.5 + h1 + h2 + h3) * width;
      
      // Vertical sweep
      const v1 = Math.cos(t * 0.5 + phase) * 0.45;
      const v2 = Math.cos(t * 0.8 + phase * 1.3) * 0.2;
      const v3 = Math.cos(t * 0.2 + phase * 0.7) * 0.12;
      const py = (0.5 + v1 + v2 + v3) * height;

      // Clamp to screen
      const cpx = Math.max(0, Math.min(width, px));
      const cpy = Math.max(0, Math.min(height, py));
      
      const size = 3 + 5 * Math.sin(t * 4 + phase);
      const alpha = 0.5 + 0.4 * Math.sin(t * 2.5 + phase);
      ctx.fillStyle = `rgba(212,175,55,${alpha})`;
      ctx.beginPath(); ctx.arc(cpx, cpy, size, 0, Math.PI * 2); ctx.fill();
    }

    // EXPANDING RINGS - 5 rings
    for (let ring = 0; ring < 5; ring++) {
      const ringPhase = (t * 0.4 + ring * 1.5) % 4;
      const ringR = (ringPhase / 4) * Math.max(width, height) * 0.7;
      const ringAlpha = 0.25 * (1 - ringPhase / 4);
      ctx.strokeStyle = `rgba(212,175,55,${ringAlpha})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(width*0.5, height*0.5, ringR, 0, Math.PI * 2);
      ctx.stroke();
    }

    // SCANLINE SWEEP
    const scanY = (t * 80) % (height + 40) - 20;
    ctx.strokeStyle = 'rgba(255,255,200,0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, scanY); ctx.lineTo(width, scanY); ctx.stroke();
  }

  function animate(timestamp) {
    const t = (timestamp || 0) / 1000;
    drawMesh(t);
    requestAnimationFrame(animate);
  }

  window.__renderFrame = (i, total) => {
    const t = i / Math.max(1, total - 1);
    drawMesh(t);
    return true;
  };

  resize();
  window.addEventListener('resize', resize);
  animate(0);
})();
</script>
</body>
</html>
