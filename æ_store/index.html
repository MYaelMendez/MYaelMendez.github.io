<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>æ.store — Sovereign Compute Mesh</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050505;
    color: #D4AF37;
    font-family: 'Consolas', 'Monaco', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .container {
    text-align: center;
    max-width: 600px;
    padding: 40px;
  }
  h1 {
    font-size: 48px;
    letter-spacing: 8px;
    margin-bottom: 16px;
    text-shadow: 0 0 20px rgba(212,175,55,0.3);
  }
  .tagline {
    font-size: 14px;
    color: rgba(212,175,55,0.6);
    letter-spacing: 2px;
    margin-bottom: 40px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a {
    color: #D4AF37;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 12px 24px;
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 4px;
    transition: all 0.3s;
  }
  a:hover {
    border-color: #D4AF37;
    background: rgba(212,175,55,0.05);
    box-shadow: 0 0 12px rgba(212,175,55,0.1);
  }
  .footer {
    position: absolute;
    bottom: 20px;
    font-size: 10px;
    color: rgba(212,175,55,0.3);
    letter-spacing: 1px;
  }
  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 2px,
      rgba(212,175,55,0.015) 2px,
      rgba(212,175,55,0.015) 4px
    );
  }
</style>
</head>
<body>
<div class="container">
  <h1>æ.store</h1>
  <div class="tagline">Sovereign Compute Mesh · CUDA_MCP² · #internetofagents</div>
  <div class="links">
    <a href="https://myaelmendez.github.io/keeper.html">Keeper — The Seal</a>
    <a href="https://myaelmendez.github.io/ae/">æ:// Language</a>
    <a href="https://myaelmendez.github.io/agentic.html">Agentic Engineering</a>
    <a href="https://myaelmendez.github.io/aggregate.html">Aggregate</a>
  </div>
</div>
<div class="footer">æ.store · github.io/æ_store · #startabusiness #daollc #clillc</div>
<div class="scanlines"></div>

<!-- æ:// QR Verification Badge -->
<div id="æ-qr-badge" style="
  position:fixed;bottom:16px;right:16px;z-index:99999;
  width:56px;height:56px;border:1px solid #D4AF37;border-radius:8px;
  background:#050505;padding:4px;cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
" onmouseover="this.style.transform='scale(1.1)';this.style.boxShadow='0 0 20px rgba(212,175,55,0.4)'"
   onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none'"
   onclick="window.open('https://myaelmendez.github.io/verify.html?url='+encodeURIComponent(location.href),'_blank')"
   title="æ:// Verify this surface">
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=48x48&data=https://myaelmendez.github.io/æ_store/index.html&color=D4AF37&bgcolor=050505" 
       alt="QR Verify" style="width:100%;height:100%;display:block;">
</div>
</body>
</html>
