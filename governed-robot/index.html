<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>&gt;_æ://GOVERNED_ROBOT</title>

<body>
<div class="scanlines" aria-hidden="true"></div>
<main class="frame" id="frame">
  <canvas id="gl" aria-label="semicircular robot face viewport"></canvas>

  <header class="topbar">
    <div class="brand"><span class="prompt">&gt;_æ://</span><span class="name">GOVERNED_ROBOT</span></div>
    <div class="chainline">HUMAN://ROOT <em>·</em> receipts on every action</div>
  </header>

  <div class="hint" id="hint">drag to orbit · the semicircular face is the viewport</div>

  <footer class="deck">
    <div class="programs" id="programs"></div>
    <div class="receipt">
      <span class="label">RECEIPT</span>
      <span class="hash" id="hReceipt">GENESIS</span>
    </div>
    <div class="statebar">
      <span class="dot" id="stateDot"></span>
      <span id="hState">IDLE</span>
      <span class="sep">·</span>
      <span id="hProg">MIRROR</span>
    </div>
  </footer>

  <div class="boot" id="boot" role="status" aria-live="polite"><pre id="bootlog"></pre></div>

<script type="module" src="./main.js"></script>
