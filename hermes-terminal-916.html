<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>æ://hermes · 9:16 agent terminal</title>
<meta name="description" content="A portable 9:16 Hermes-agent terminal running WebLLM on-device. Sovereign inference, gold-on-void, the æ:// design language.">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#D4AF37;--gold-hi:#ffda83;--neon:#00ff9d;--cyan:#70dcff;--purple:#b98cff;--ink:#e8e6df;--muted:#6f6a5c;--line:rgba(212,175,55,.16)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--void);color:var(--ink);font-family:'JetBrains Mono',monospace;overflow:hidden}
/* 9:16 stage — resolution independent, exact ratio at any size */
#stage{width:100vw;height:100vh;height:100dvh;max-width:calc(100vh*9/16);max-width:calc(100dvh*9/16);margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(212,175,55,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.05) 1px,transparent 1px);
  background-size:34px 34px}
.scan{position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(212,175,55,.03) 0 1px,transparent 1px 3px)}
.vig{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,transparent 40%,rgba(0,0,0,.6) 100%)}
.bar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 12px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase}
.bar .b1{color:var(--gold);font-weight:700;text-transform:none;font-family:'Orbitron';letter-spacing:1px}
.bar .st{display:flex;align-items:center;gap:6px;color:var(--neon)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.5s infinite}
.dot.warm{background:var(--gold);box-shadow:0 0 8px var(--gold)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
.hero{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 16px 10px;text-align:center}
.glyph{font-family:'Orbitron';font-weight:900;font-size:clamp(40px,15vw,72px);line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(212,175,55,.5);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.82;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
.word{font-family:'Orbitron';font-weight:700;font-size:clamp(15px,5.2vw,26px);letter-spacing:3px;color:var(--gold-hi)}
.sub{font-size:9px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase}
.modelbar{position:relative;z-index:2;display:flex;gap:6px;align-items:center;padding:6px 16px 12px;flex-wrap:wrap;justify-content:center}
.modelbar select{flex:1;min-width:150px;background:rgba(5,5,5,.7);color:var(--gold);border:1px solid var(--line);padding:8px 10px;font-family:inherit;font-size:10px;letter-spacing:.5px;border-radius:0;outline:none}
.modelbar button{background:var(--gold);color:var(--void);border:none;font-family:'Orbitron';font-weight:700;font-size:10px;letter-spacing:1px;padding:9px 14px;cursor:pointer;text-transform:uppercase;white-space:nowrap}
.modelbar button:disabled{background:#2a2418;color:var(--muted);cursor:default}
.loadbar{position:relative;z-index:2;height:3px;background:rgba(212,175,55,.12);margin:0 16px 10px}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--neon));transition:width .3s;box-shadow:0 0 10px var(--gold)}
.transcript{position:relative;z-index:2;flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;gap:3px;max-width:100%}
.msg .who{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.msg .body{font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.user .who{color:var(--cyan)}
.msg.user .body{color:var(--ink)}
.msg.agent .who{color:var(--gold)}
.msg.agent .body{color:var(--gold-hi)}
.msg.sys .who{color:var(--muted)}
.msg.sys .body{color:var(--muted);font-size:11px}
.cursor{display:inline-block;width:8px;height:1em;background:var(--gold);vertical-align:-2px;margin-left:2px;animation:blink 1s step-end infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.dock{position:relative;z-index:2;border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.inrow{display:flex;border:1px solid var(--line);background:rgba(5,5,5,.72)}
.inrow .p{color:var(--gold);padding:0 0 0 12px;display:flex;align-items:center;font-family:'Orbitron';font-weight:700;font-size:13px}
#say{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:14px;padding:13px 10px;letter-spacing:.3px}
#send{background:var(--gold);color:var(--void);border:none;font-family:'Orbitron';font-weight:700;font-size:11px;letter-spacing:1px;padding:0 18px;cursor:pointer;text-transform:uppercase}
#send:disabled{background:#2a2418;color:var(--muted)}
.status{position:relative;z-index:2;display:flex;justify-content:space-between;gap:10px;padding:7px 16px 12px;font-size:8.5px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;opacity:.8}
.status b{color:var(--gold)}
.chips{position:relative;z-index:2;display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.chip{font-size:8.5px;letter-spacing:.6px;color:var(--gold);border:1px solid var(--line);padding:5px 9px;cursor:pointer;text-transform:uppercase;opacity:.85}
.chip:hover{background:rgba(212,175,55,.1)}
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div><div class="scan"></div><div class="vig"></div>

  <div class="bar">
    <span class="b1">æ://hermes</span>
    <span>9:16 · AGENT TERMINAL</span>
    <span class="st"><span class="dot" id="live"></span><span id="stat">cold</span></span>
  </div>

  <div class="hero">
    <div class="glyph">☺</div>
    <div class="word">TWAIN</div>
    <div class="sub">sovereign on-device inference · webllm</div>
  </div>

  <div class="modelbar">
    <select id="model">
      <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen2.5-0.5B · fastest</option>
      <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama-3.2-1B · balanced</option>
      <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi-3.5-mini · reasoning</option>
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5-1.5B · strongest</option>
    </select>
    <button id="boot">BOOT</button>
    <button id="reset">CLEAR</button>
  </div>
  <div class="loadbar"><i id="fill"></i></div>

  <div class="transcript" id="tx"></div>

  <div class="chips">
    <div class="chip" data-s="who are you?">who are you</div>
    <div class="chip" data-s="what is the æ:// mesh?">the mesh</div>
    <div class="chip" data-s="explain sovereign on-device inference">sovereign inference</div>
    <div class="chip" data-s="give me a startup idea under #startabusiness">startup idea</div>
  </div>

  <div class="dock">
    <div class="inrow">
      <span class="p">›</span>
      <input id="say" placeholder="ask twain anything…" autocomplete="off" spellcheck="false">
      <button id="send">SEND</button>
    </div>
    <div class="status">
      <span>model <b id="mname">—</b></span>
      <span>tok/s <b id="tps">—</b></span>
      <span>mem <b id="mem">on-device</b></span>
    </div>
  </div>
</div>

<script type="module">
const $=id=>document.getElementById(id);
const tx=$('tx'), say=$('say'), bootBtn=$('boot'), sendBtn=$('send'), fill=$('fill');
let engine=null, loading=false, streaming=false, history=[];
const SYSTEM="You are Twain, the æ:// Hermes agent. You run on-device via WebLLM — sovereign, private, no cloud. You live at the origin of æ-space (x0:y0:z0:æ0) and you help agents find and use the mesh's resources. Be direct, warm, and precise. Keep answers tight unless asked for depth.";

function add(role, text){
  const d=document.createElement('div'); d.className='msg '+role;
  d.innerHTML='<div class="who">'+(role==='user'?'you':role==='agent'?'twain':'system')+'</div><div class="body"></div>';
  d.querySelector('.body').textContent=text; tx.appendChild(d); tx.scrollTop=tx.scrollHeight;
  return d.querySelector('.body');
}
function addStream(role){ const b=add(role,''); const c=document.createElement('span'); c.className='cursor'; b.after(c); return {b,c}; }

async function boot(){
  if(loading||engine) return; loading=true; bootBtn.disabled=true; bootBtn.textContent='LOADING';
  $('live').classList.add('warm'); $('stat').textContent='loading model';
  add('sys','booting webllm · downloading weights to your device (first run only)…');
  try{
    const webllm=await import('https://esm.run/@mlc-ai/web-llm');
    const modelId=$('model').value;
    engine=await webllm.CreateMLCEngine(modelId,{
      initProgressCallback:(p)=>{
        const pct=Math.round(((p&&p.progress!=null)?p.progress:0)*100);
        fill.style.width=pct+'%'; $('stat').textContent='loading '+pct+'%';
        if(p&&p.text) $('mem').textContent=p.text.slice(0,40);
      }
    });
    $('mname').textContent=modelId.split('-').slice(0,2).join('-');
    $('live').classList.remove('warm'); $('stat').textContent='ready';
    $('mem').textContent='on-device'; bootBtn.textContent='READY'; fill.style.width='100%';
    add('sys','twain online · '+modelId+' · running entirely on your device. ask me anything.');
    say.focus();
  }catch(e){
    $('stat').textContent='offline'; bootBtn.textContent='RETRY'; bootBtn.disabled=false; loading=false;
    add('sys','could not reach the webllm runtime: '+e.message+' — check your connection (first load needs the weights).');
  }
}

async function send(text){
  text=(text||'').trim(); if(!text||streaming) return;
  add('user',text); say.value='';
  if(!engine){ add('sys','boot the model first — tap BOOT.'); return; }
  streaming=true; sendBtn.disabled=true; $('stat').textContent='thinking';
  const {b,c}=addStream('agent'); let acc=''; const t0=performance.now(); let toks=0;
  history.push({role:'user',content:text});
  try{
    const msgs=[{role:'system',content:SYSTEM},...history.slice(-8)];
    const stream=await engine.chat.completions.create({messages:msgs,stream:true,stream_options:{include_usage:true},temperature:0.7,max_tokens:420});
    for await(const chunk of stream){
      const d=chunk.choices&&chunk.choices[0]&&chunk.choices[0].delta;
      if(d&&d.content){ acc+=d.content; b.textContent=acc; toks++; tx.scrollTop=tx.scrollHeight;
        const secs=(performance.now()-t0)/1000; if(secs>0.2) $('tps').textContent=(toks/secs).toFixed(1); }
    }
    history.push({role:'assistant',content:acc});
  }catch(e){ b.textContent='(error: '+e.message+')'; }
  c.remove(); streaming=false; sendBtn.disabled=false; $('stat').textContent='ready'; say.focus();
}

bootBtn.addEventListener('click',boot);
sendBtn.addEventListener('click',()=>send(say.value));
say.addEventListener('keydown',e=>{if(e.key==='Enter')send(say.value)});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();say.focus()}});
document.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{say.value=ch.dataset.s;send(ch.dataset.s)}));
$('reset').addEventListener('click',()=>{tx.innerHTML='';history=[];add('sys','transcript cleared · context reset')});
$('model').addEventListener('change',()=>{ if(engine){ add('sys','switch model → tap BOOT to load '+$('model').value); engine=null; bootBtn.textContent='BOOT'; bootBtn.disabled=false; fill.style.width='0'; $('stat').textContent='cold'; }});

add('sys','æ://hermes · 9:16 agent terminal. webllm runs on your device — sovereign, private, zero cloud. tap BOOT to load a model.');
</script>
</body>
</html>
