<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HERMES-AGENT // æQR Kænbæn Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;font-family:"JetBrains Mono","SF Mono",monospace}
#stage{position:absolute;inset:0;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#h{z-index:0}
#c{z-index:1}
.hud{position:absolute;z-index:3;pointer-events:none;color:#c8d8e8}
.hud-top{top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}
.hud-title{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6fd0ff}
.hud-title b{color:#ffe6a3}
.hud-status{font-size:10px;letter-spacing:.14em;color:#00ff9d;text-transform:uppercase;text-align:right}
.hud-status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#00ff9d;margin-right:6px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hud-bottom{bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-end;font-size:9px;letter-spacing:.12em;color:#5a7a8a;text-transform:uppercase}
.hud-bottom .left,.hud-bottom .right{display:flex;flex-direction:column;gap:3px}
.hud-bottom .right{text-align:right}
.hud-bottom b{color:#6fd0ff}
.scan{position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.15) 2px 4px)}
.vig{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,10,.7) 100%)}
.gate{position:absolute;left:0;right:0;top:50%;height:1px;z-index:3;pointer-events:none;background:linear-gradient(90deg,transparent,#ff3355,transparent);opacity:.5}
.gate-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;font-size:8px;letter-spacing:.3em;color:#ff3355;text-transform:uppercase;background:rgba(10,10,15,.8);padding:4px 12px;border:1px solid #ff335533}
.success-toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;font-size:10px;letter-spacing:.14em;color:#00ff9d;text-transform:uppercase;background:rgba(0,20,10,.9);padding:8px 16px;border:1px solid #00ff9d33;opacity:0;transition:opacity .3s}
.success-toast.show{opacity:1}
.imp-counter{color:#ffe6a3}
</style>
</head>
<body>
<div id="stage">
  <canvas id="h"></canvas>
  <canvas id="c"></canvas>
  <div class="scan"></div>
  <div class="vig"></div>
  <div class="gate"></div>
  <div class="gate-label">THE GATE</div>
  <div class="success-toast" id="toast">✓ SUCCESS</div>
  <div class="hud hud-top">
    <div class="hud-title">HERMES-AGENT <b>//</b> æQR Kænbæn</div>
    <div class="hud-status"><span class="dot"></span>LIVE · <span id="update-count">0</span> UPDATES</div>
  </div>
  <div class="hud hud-bottom">
    <div class="left">
      <div>æ:// <b>sovereign</b> · ed25519</div>
      <div>ææ:// <b>private client</b> · local-first</div>
      <div>æææ:// <b>digital twin</b> · mirror</div>
    </div>
    <div class="right">
      <div>9:16 <b>vertical</b></div>
      <div>three.js <b>webgl</b></div>
      <div class="imp-counter">IMPROVEMENTS <b id="improvement-count">0</b></div>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"./assets/vendor/three.module.js","three/addons/":"./assets/vendor/","three/addons/utils/":"./assets/utils/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/GLTFLoader.js';

const cv = document.getElementById('h');
const renderer = new THREE.WebGLRenderer({canvas:cv, alpha:false, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setClearColor(0x0a0a0f, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.06);

scene.add(new THREE.AmbientLight(0x1a2a3a, 0.6));
const key = new THREE.DirectionalLight(0xffe6a3, 1.8);
key.position.set(4, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6fd0ff, 1.2);
rim.position.set(-4, 3, -4);
scene.add(rim);
const fill = new THREE.PointLight(0x00ff9d, 0.5, 20);
fill.position.set(0, 2, 3);
scene.add(fill);
const back = new THREE.PointLight(0x4466ff, 0.7, 30);
back.position.set(0, 4, -7);
scene.add(back);

const grid = new THREE.GridHelper(20, 40, 0x1a3a4a, 0x0d1f2a);
grid.position.y = 0;
scene.add(grid);

const camera = new THREE.PerspectiveCamera(38, 9/16, 0.1, 60);
camera.position.set(0, 1.8, 6.5);
camera.lookAt(0, 1.2, 0);

function resize(){
  const b = cv.getBoundingClientRect();
  renderer.setSize(b.width, b.height, false);
  camera.aspect = b.width/b.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

function makeHalo(color, radius, tilt){
  const g = new THREE.TorusGeometry(radius, 0.015, 8, 64);
  const m = new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.7});
  const mesh = new THREE.Mesh(g, m);
  mesh.rotation.x = tilt;
  mesh.rotation.z = tilt * 0.5;
  return mesh;
}
const halo1 = makeHalo(0xffe6a3, 0.9, Math.PI/2.2);
const halo2 = makeHalo(0x6fd0ff, 1.1, Math.PI/2.5);
halo1.position.y = 2.2;
halo2.position.y = 2.2;
scene.add(halo1, halo2);

let soldier = null;
let headBone = null;
let clips = {};
let mixer = null;
let currentAction = null;
let nextAction = null;
let blendT = 0;
const BLEND_DUR = 0.8;

new GLTFLoader().load('assets/gltf/Xbot.glb', (gltf) => {
  soldier = gltf.scene;
  scene.add(soldier);
  soldier.position.set(0, 0, 0);
  soldier.scale.set(1.1, 1.1, 1.1);
  soldier.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; }});

  const anims = gltf.animations || [];
  anims.forEach(c => { clips[c.name.toLowerCase()] = c; });

  headBone = soldier.getObjectByName('mixamorigHead') || soldier.getObjectByName('Head');

  mixer = new THREE.AnimationMixer(soldier);

  const idleClip = clips['idle'] || clips['mixamo.com'] || anims[0];
  if(idleClip){
    currentAction = mixer.clipAction(idleClip);
    currentAction.play();
  }

  let state = 0;
  const states = ['idle', 'walk', 'run', 'walk', 'idle'];
  setInterval(() => {
    state = (state + 1) % states.length;
    const nextClip = clips[states[state]];
    if(nextClip && mixer){
      nextAction = mixer.clipAction(nextClip);
      nextAction.reset();
      nextAction.play();
      blendT = 0;
    }
  }, 4000);

}, undefined, (e) => console.error('Xbot load failed', e));

let t = 0;
renderer.setAnimationLoop(() => {
  t += 0.016;

  if(mixer && currentAction && nextAction && blendT < BLEND_DUR){
    blendT += 0.016;
    const alpha = Math.min(blendT / BLEND_DUR, 1);
    currentAction.weight = 1 - alpha;
    nextAction.weight = alpha;
    if(alpha >= 1){
      currentAction = nextAction;
      nextAction = null;
    }
  }
  if(mixer) mixer.update(0.016);

  if(soldier){
    soldier.rotation.y = Math.sin(t * 0.25) * 0.08;
    soldier.position.y = Math.sin(t * 0.8) * 0.02;
  }

  if(headBone){
    const target = new THREE.Vector3(mouseX * 4, 2.2 + mouseY * 2.5, 5);
    headBone.lookAt(target);
  }

  halo1.rotation.z += 0.003;
  halo2.rotation.z -= 0.002;
  halo1.position.y = 2.2 + Math.sin(t * 0.5) * 0.05;
  halo2.position.y = 2.2 + Math.sin(t * 0.5 + 1) * 0.05;

  grid.position.z = (t * 0.3) % 0.5;

  renderer.render(scene, camera);
});
</script>

<script>
(function(){
  const BOARD_URL = 'board/state.json';
  let WAVES = null, WAVE_PROG = null, SIGS = {};
  let updateCount = 0;
  let signedCount = 0;
  let improvementCount = 0;

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = cv.width = 1080;
  const H = cv.height = 1920;

  const LANES = ['CLAIM','WORK','VERIFY','PUSH'];
  const LCOL = {CLAIM:'#ffd700',WORK:'#00d4ff',VERIFY:'#00ff9d',PUSH:'#c084fc'};
  const LN_TOP = () => H * 0.16;
  const LN_H = () => H * 0.19;
  const LN_GAP = () => H * 0.028;

  function laneY(lane){ return LN_TOP() + lane * (LN_H() + LN_GAP()); }

  function aeqr(x, y, s, col, signed){
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, s, s);
    ctx.fillStyle = col;
    ctx.fillRect(x + 2, y + 2, 3, 3);
    ctx.fillRect(x + s - 5, y + 2, 3, 3);
    ctx.fillRect(x + 2, y + s - 5, 3, 3);
    if(signed) ctx.fillRect(x + s/2 - 1.5, y + s/2 - 1.5, 3, 3);
  }

  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = '✓ ' + msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function speak(text){
    if('speechSynthesis' in window){
      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'es-ES'; u.rate = 0.95; u.pitch = 1;
        speechSynthesis.speak(u);
      }catch(e){}
    }
  }

  function animateImprovements(target){
    const el = document.getElementById('improvement-count');
    const start = improvementCount;
    const diff = target - start;
    const dur = 1200;
    const t0 = performance.now();
    function step(now){
      const p = Math.min((now - t0) / dur, 1);
      const val = Math.round(start + diff * (1 - Math.pow(1 - p, 3)));
      el.textContent = val;
      improvementCount = val;
      if(p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function updateHUD(){
    document.getElementById('update-count').textContent = updateCount;
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    ctx.font = '10px "JetBrains Mono"';
    ctx.textAlign = 'left';
    for(let i = 0; i < LANES.length; i++){
      const y = laneY(i);
      ctx.fillStyle = LCOL[LANES[i]];
      ctx.fillRect(8, y, 3, LN_H());
      ctx.fillStyle = '#c8d8e8';
      ctx.fillText(LANES[i], 20, y + 14);
      ctx.fillStyle = '#5a7a8a';
      ctx.font = '8px "JetBrains Mono"';
      ctx.fillText(['cards enter','in progress','signature gate','completed'][i], 20, y + 32);
      ctx.font = '10px "JetBrains Mono"';
    }

    if(!WAVES) return;
    WAVES.forEach(function(w, idx){
      const lane = (WAVE_PROG && WAVE_PROG[w] != null) ? WAVE_PROG[w] : 3;
      const x = 80 + idx * ((W - 160) / Math.max(1, WAVES.length - 1));
      const y = laneY(lane);
      const cw = 140, ch = LN_H() - 10;

      ctx.fillStyle = 'rgba(10,15,25,0.85)';
      ctx.strokeStyle = LCOL[LANES[lane]] + '66';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x - cw/2, y + 5, cw, ch, 4);
      ctx.fill(); ctx.stroke();

      const signed = true;
      const sig = (SIGS[w] && SIGS[w].sig_hash) || '';
      aeqr(x - cw/2 + 7, y + 14, 11, signed ? '#00ff9d' : '#70dcff', signed);

      if(sig){
        ctx.fillStyle = signed ? 'rgba(0,255,157,.9)' : 'rgba(112,220,255,.8)';
        ctx.font = '7px "JetBrains Mono"';
        ctx.textAlign = 'left';
        ctx.fillText('✓' + sig.slice(0, 16), x - cw/2 + 22, y + 24);
        signedCount++;
      }

      ctx.fillStyle = '#c8d8e8';
      ctx.font = '10px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.fillText(w, x, y + ch/2 + 8);

      ctx.fillStyle = 'rgba(112,220,255,.6)';
      ctx.font = '7px "JetBrains Mono"';
      ctx.fillText('kanban://' + w, x, y + ch - 8);
    });

    updateHUD();
    requestAnimationFrame(draw);
  }

  fetch(BOARD_URL, {cache: 'no-cache'})
    .then(r => r.json())
    .then(function(s){
      SIGS = s.signatures || {};
      Object.keys(SIGS).forEach(function(k){
        if(k.indexOf('daollc-') === 0) SIGS[k.slice(7)] = SIGS[k];
      });
      WAVES = s.batches.map(b => b.wave.replace('daollc-', ''));
      WAVE_PROG = {};
      s.batches.forEach(function(b){
        const short = b.wave.replace('daollc-', '');
        WAVE_PROG[short] = Math.min(3, Math.floor(3 * b.complete / b.total));
      });
      updateCount = s.total_complete;
      signedCount = Object.keys(SIGS).length;
      showToast(s.consolidated_verdict.split(' — ')[0] || 'LOADED');
      speak((s.consolidated_verdict || 'Sistema verificado').replace('—', '.'));
      animateImprovements(s.total_complete);
      draw();
    })
    .catch(err => {
      console.error('Board fetch failed', err);
      WAVES = ['content','batch-2','batch-3','batch-4','batch-5'];
      WAVE_PROG = {content:3,'batch-2':3,'batch-3':3,'batch-4':3,'batch-5':3};
      draw();
    });
})();
</script>
</body>
