<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/GLTFLoader.js';

const cv = document.getElementById('h');
const renderer = new THREE.WebGLRenderer({canvas:cv, alpha:false, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setClearColor(0x0a0a0f, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.06);

scene.add(new THREE.AmbientLight(0x1a2a3a, 0.6));
const key = new THREE.DirectionalLight(0xffe6a3, 1.8);
key.position.set(4, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6fd0ff, 1.2);
rim.position.set(-4, 3, -4);
scene.add(rim);
const fill = new THREE.PointLight(0x00ff9d, 0.5, 20);
fill.position.set(0, 2, 3);
scene.add(fill);
const back = new THREE.PointLight(0x4466ff, 0.7, 30);
back.position.set(0, 4, -7);
scene.add(back);

const grid = new THREE.GridHelper(20, 40, 0x1a3a4a, 0x0d1f2a);
grid.position.y = 0;
scene.add(grid);

const camera = new THREE.PerspectiveCamera(38, 9/16, 0.1, 60);
camera.position.set(0, 1.8, 6.5);
camera.lookAt(0, 1.2, 0);

function resize(){
  const b = cv.getBoundingClientRect();
  renderer.setSize(b.width, b.height, false);
  camera.aspect = b.width/b.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

// æC2 command listeners — origin commands reach the Xbot operator here
let c2Override = null; // {clip, until} — manual command pauses auto-sequence
window.addEventListener('æc2:anim', e => {
  const clip = (e.detail && e.detail.clip) || 'idle';
  if(clips[clip] && mixer){
    nextAction = mixer.clipAction(clips[clip]);
    nextAction.reset();
    nextAction.play();
    blendT = 0;
    c2Override = {clip: clip, until: performance.now() + 3500};
  }
});
window.addEventListener('æc2:light', e => {
  const col = (e.detail && e.detail.color) || '#ffe6a3';
  key.color.set(col);
});
window.addEventListener('æc2:look', e => {
  const dir = (e.detail && e.detail.dir) || 'center';
  if(headBone){
    const targets = {
      center: new THREE.Vector3(0, 2.2, 5),
      left:   new THREE.Vector3(-4, 2.2, 5),
      right:  new THREE.Vector3(4, 2.2, 5),
      up:     new THREE.Vector3(0, 4.5, 5),
      down:   new THREE.Vector3(0, 0.5, 5)
    };
    headBone.lookAt(targets[dir] || targets.center);
  }
});

function makeHalo(color, radius, tilt){
  const g = new THREE.TorusGeometry(radius, 0.015, 8, 64);
  const m = new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.7});
  const mesh = new THREE.Mesh(g, m);
  mesh.rotation.x = tilt;
  mesh.rotation.z = tilt * 0.5;
  return mesh;
}
const halo1 = makeHalo(0xffe6a3, 0.9, Math.PI/2.2);
const halo2 = makeHalo(0x6fd0ff, 1.1, Math.PI/2.5);
halo1.position.y = 2.2;
halo2.position.y = 2.2;
scene.add(halo1, halo2);

let soldier = null;
let headBone = null;
let clips = {};
let mixer = null;
let currentAction = null;
let nextAction = null;
let blendT = 0;
const BLEND_DUR = 0.8;

new GLTFLoader().load('assets/gltf/Xbot.glb', (gltf) => {
  soldier = gltf.scene;
  scene.add(soldier);
  soldier.position.set(0, 0, 0);
  soldier.scale.set(1.1, 1.1, 1.1);
  soldier.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; }});

  const anims = gltf.animations || [];
  anims.forEach(c => { clips[c.name.toLowerCase()] = c; });

  headBone = soldier.getObjectByName('mixamorigHead') || soldier.getObjectByName('Head');

  mixer = new THREE.AnimationMixer(soldier);

  const idleClip = clips['idle'] || clips['mixamo.com'] || anims[0];
  if(idleClip){
    currentAction = mixer.clipAction(idleClip);
    currentAction.play();
  }

  let state = 0;
  const states = ['idle', 'walk', 'run', 'walk', 'idle'];
  setInterval(() => {
    if(c2Override) return;
    state = (state + 1) % states.length;
    const nextClip = clips[states[state]];
    if(nextClip && mixer){
      nextAction = mixer.clipAction(nextClip);
      nextAction.reset();
      nextAction.play();
      blendT = 0;
    }
  }, 4000);

}, undefined, (e) => console.error('Xbot load failed', e));

let t = 0;
renderer.setAnimationLoop(() => {
  t += 0.016;

  if(mixer && currentAction && nextAction && blendT < BLEND_DUR){
    blendT += 0.016;
    const alpha = Math.min(blendT / BLEND_DUR, 1);
    currentAction.weight = 1 - alpha;
    nextAction.weight = alpha;
    if(alpha >= 1){
      currentAction = nextAction;
      nextAction = null;
    }
  }
  if(mixer) mixer.update(0.016);

  if(soldier){
    soldier.rotation.y = Math.sin(t * 0.25) * 0.08;
    soldier.position.y = Math.sin(t * 0.8) * 0.02;
  }

  // Release C2 override back to auto-sequence
  if(c2Override && performance.now() > c2Override.until){
    c2Override = null;
  }

  if(headBone){
    const target = new THREE.Vector3(mouseX * 4, 2.2 + mouseY * 2.5, 5);
    headBone.lookAt(target);
  }

  halo1.rotation.z += 0.003;
  halo2.rotation.z -= 0.002;
  halo1.position.y = 2.2 + Math.sin(t * 0.5) * 0.05;
  halo2.position.y = 2.2 + Math.sin(t * 0.5 + 1) * 0.05;

  grid.position.z = (t * 0.3) % 0.5;

  renderer.render(scene, camera);
});

// ── theme & environment awareness for 3D scene ──
window.applyHlTheme = function(theme){
  var isDay = (theme === 'day');
  var bgColor = isDay ? 0xf5f2ea : 0x0a0a0f;
  var fogColor = isDay ? 0xf5f2ea : 0x0a0a0f;
  var gridColor = isDay ? 0x999999 : 0x00ff9d;
  var gridColor2 = isDay ? 0xb8964f : 0xd4af37;

  if(typeof scene !== 'undefined' && scene){
    scene.background = new THREE.Color(bgColor);
    scene.fog = new THREE.FogExp2(fogColor, 0.06);
  }
  if(typeof renderer !== 'undefined' && renderer){
    renderer.setClearColor(bgColor);
  }
  if(typeof key !== 'undefined' && key){
    key.color.set(isDay ? 0xffffff : 0xffe6a3);
  }
  if(typeof halo1 !== 'undefined' && halo1){
    halo1.material.color.set(isDay ? 0xd4af37 : 0xffe6a3);
  }
  if(typeof halo2 !== 'undefined' && halo2){
    halo2.material.color.set(isDay ? 0x70dcff : 0x6fd0ff);
  }

  var hud = document.getElementById('hud');
  if(hud){
    hud.style.color = isDay ? '#1a1a1a' : '#70dcff';
    hud.style.borderColor = isDay ? 'rgba(0,0,0,.2)' : 'rgba(112,220,255,.3)';
  }
};

window.applyHlEnv = function(env){
  var accentColor = '#00ff9d';
  if(env === 'public') accentColor = '#00ff9d';
  else if(env === 'published') accentColor = '#70dcff';
  else if(env === 'operator') accentColor = '#d4af37';
  else if(env === 'custody') accentColor = '#b98cff';

  var hud = document.getElementById('hud');
  if(hud){
    hud.style.borderColor = accentColor + '44';
    hud.style.color = accentColor;
  }

  var glyph = document.querySelector('.glyph');
  if(glyph){
    glyph.style.color = accentColor;
    glyph.style.textShadow = '0 0 20px ' + accentColor + '88';
  }
};
</script>

<script>
(function(){
  const BOARD_URL = 'board/state.json';
  let WAVES = null, WAVE_PROG = null, SIGS = {};
  let updateCount = 0;
  let signedCount = 0;
  let improvementCount = 0;

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = cv.width = 1080;
  const H = cv.height = 1920;

  const LANES = ['CLAIM','WORK','VERIFY','PUSH'];
  const LCOL = {CLAIM:'#ffd700',WORK:'#00d4ff',VERIFY:'#00ff9d',PUSH:'#c084fc'};
  const LN_TOP = () => H * 0.16;
  const LN_H = () => H * 0.19;
  const LN_GAP = () => H * 0.028;

  function laneY(lane){ return LN_TOP() + lane * (LN_H() + LN_GAP()); }

  function aeqr(x, y, s, col, signed){
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, s, s);
    ctx.fillStyle = col;
    ctx.fillRect(x + 2, y + 2, 3, 3);
    ctx.fillRect(x + s - 5, y + 2, 3, 3);
    ctx.fillRect(x + 2, y + s - 5, 3, 3);
    if(signed) ctx.fillRect(x + s/2 - 1.5, y + s/2 - 1.5, 3, 3);
  }

  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = '✓ ' + msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function speak(text){
    if('speechSynthesis' in window){
      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'es-ES'; u.rate = 0.95; u.pitch = 1;
        speechSynthesis.speak(u);
      }catch(e){}
    }
  }

  function animateImprovements(target){
    const el = document.getElementById('improvement-count');
    const start = improvementCount;
    const diff = target - start;
    const dur = 1200;
    const t0 = performance.now();
    function step(now){
      const p = Math.min((now - t0) / dur, 1);
      const val = Math.round(start + diff * (1 - Math.pow(1 - p, 3)));
      el.textContent = val;
      improvementCount = val;
      if(p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function updateHUD(){
    document.getElementById('update-count').textContent = updateCount;
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    ctx.font = '10px "JetBrains Mono"';
    ctx.textAlign = 'left';
    for(let i = 0; i < LANES.length; i++){
      const y = laneY(i);
      ctx.fillStyle = LCOL[LANES[i]];
      ctx.fillRect(8, y, 3, LN_H());
      ctx.fillStyle = '#c8d8e8';
      ctx.fillText(LANES[i], 20, y + 14);
      ctx.fillStyle = '#5a7a8a';
      ctx.font = '8px "JetBrains Mono"';
      ctx.fillText(['cards enter','in progress','signature gate','completed'][i], 20, y + 32);
      ctx.font = '10px "JetBrains Mono"';
    }

    if(!WAVES) return;
    WAVES.forEach(function(w, idx){
      const lane = (WAVE_PROG && WAVE_PROG[w] != null) ? WAVE_PROG[w] : 3;
      const x = 80 + idx * ((W - 160) / Math.max(1, WAVES.length - 1));
      const y = laneY(lane);
      const cw = 140, ch = LN_H() - 10;

      ctx.fillStyle = 'rgba(10,15,25,0.85)';
      ctx.strokeStyle = LCOL[LANES[lane]] + '66';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x - cw/2, y + 5, cw, ch, 4);
      ctx.fill(); ctx.stroke();

      const signed = true;
      const sig = (SIGS[w] && SIGS[w].sig_hash) || '';
      aeqr(x - cw/2 + 7, y + 14, 11, signed ? '#00ff9d' : '#70dcff', signed);

      if(sig){
        ctx.fillStyle = signed ? 'rgba(0,255,157,.9)' : 'rgba(112,220,255,.8)';
        ctx.font = '7px "JetBrains Mono"';
        ctx.textAlign = 'left';
        ctx.fillText('✓' + sig.slice(0, 16), x - cw/2 + 22, y + 24);
        signedCount++;
      }

      ctx.fillStyle = '#c8d8e8';
      ctx.font = '10px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.fillText(w, x, y + ch/2 + 8);

      ctx.fillStyle = 'rgba(112,220,255,.6)';
      ctx.font = '7px "JetBrains Mono"';
      ctx.fillText('kanban://' + w, x, y + ch - 8);
    });

    updateHUD();
    requestAnimationFrame(draw);
  }

  fetch(BOARD_URL, {cache: 'no-cache'})
    .then(r => r.json())
    .then(function(s){
      SIGS = s.signatures || {};
      Object.keys(SIGS).forEach(function(k){
        if(k.indexOf('daollc-') === 0) SIGS[k.slice(7)] = SIGS[k];
      });
      WAVES = s.batches.map(b => b.wave.replace('daollc-', ''));
      WAVE_PROG = {};
      s.batches.forEach(function(b){
        const short = b.wave.replace('daollc-', '');
        WAVE_PROG[short] = Math.min(3, Math.floor(3 * b.complete / b.total));
      });
      updateCount = s.total_complete;
      signedCount = Object.keys(SIGS).length;
      showToast(s.consolidated_verdict.split(' — ')[0] || 'LOADED');
      speak((s.consolidated_verdict || 'Sistema verificado').replace('—', '.'));
      animateImprovements(s.total_complete);
      draw();
    })
    .catch(err => {
      console.error('Board fetch failed', err);
      WAVES = ['content','batch-2','batch-3','batch-4','batch-5'];
      WAVE_PROG = {content:3,'batch-2':3,'batch-3':3,'batch-4':3,'batch-5':3};
      draw();
    });
})();
</script>

    <button id="c2-close" style="background:#0a1a2a;border:1px solid #ff335544;color:#ff3355;padding:4px 8px;font-size:8px;cursor:pointer">close ✕</button>
  </div>
</div>
<button id="c2-toggle" style="position:absolute;bottom:60px;right:16px;z-index:10;background:#0a1a2a;border:1px solid #6fd0ff44;color:#6fd0ff;padding:6px 10px;font-size:8px;letter-spacing:.12em;cursor:pointer">⌘ C2</button>
<span class="theme-controls" style="position:absolute;bottom:60px;right:100px;z-index:10;display:inline-flex;gap:4px">
  <button id="theme-toggle" type="button" style="background:#0a1a2a;border:1px solid #6fd0ff44;color:#6fd0ff;padding:6px 8px;font-size:8px;letter-spacing:.1em;cursor:pointer">◐</button>
  <button id="env-toggle" type="button" style="background:#0a1a2a;border:1px solid #6fd0ff44;color:#6fd0ff;padding:6px 8px;font-size:8px;letter-spacing:.1em;cursor:pointer">⬡</button>
</span>

<!-- ===== æC2 Command & Control channel ===== -->
<script>
(function(){'use strict';
var _theme='night',_env='default';
try{_theme=localStorage.getItem('ae-theme')||'night';_env=localStorage.getItem('ae-env')||'default'}catch(e){}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('ae-theme',t)}catch(e){}if(typeof window.applyHlTheme==='function')window.applyHlTheme(t)}
function applyEnv(e){document.documentElement.setAttribute('data-env',e);try{localStorage.setItem('ae-env',e)}catch(e){}if(typeof window.applyHlEnv==='function')window.applyHlEnv(e)}
applyTheme(_theme);applyEnv(_env);
var _tt=document.getElementById('theme-toggle');if(_tt)_tt.addEventListener('click',function(){_theme=(_theme==='night')?'day':'night';applyTheme(_theme)});
var _et=document.getElementById('env-toggle');if(_et)_et.addEventListener('click',function(){_env=(_env==='default')?'agentic_environments':'default';applyEnv(_env)});
})();
</script>
<script>
(function(){
  'use strict';
  const QUEUE_URL = 'c2/queue.json';
  const RECEIPTS_URL = 'c2/receipts.json';
  let executedIds = new Set();
  let c2Log = [];
  let c2Active = false;

  // Xbot action map — all 7 clips wired for command control
  const ACTIONS = {
    idle:      'idle — operator standing by',
    walk:      'walk — operator moving',
    run:       'run — operator sprinting',
    agree:     'agree — operator acknowledges (signature verified)',
    headShake: 'headShake — operator rejects',
    sad_pose:  'sad_pose — operator error/failure',
    sneak_pose:'sneak_pose — operator focused/stealth'
  };

  const LIGHTS = {
    gold:  {color:'#ffe6a3', label:'gold — key light'},
    cyan:  {color:'#6fd0ff', label:'cyan — rim light'},
    green: {color:'#00ff9d', label:'green — fill light'},
    blue:  {color:'#4466ff', label:'blue — back light'},
    red:   {color:'#ff3355', label:'red — alert'},
    white: {color:'#ffffff', label:'white — full power'}
  };

  function c2Toast(msg){
    const t = document.getElementById('toast');
    t.textContent = '⌘ ' + msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }

  function c2Speak(text){
    if('speechSynthesis' in window){
      try{ speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang='es-ES'; u.rate=0.95; u.pitch=1;
        speechSynthesis.speak(u);
      }catch(e){}
    }
  }

  function logC2(msg){
    const ts = new Date().toISOString().substr(11,8);
    c2Log.push(ts + ' ' + msg);
    if(c2Log.length > 50) c2Log.shift();
    console.log('[æC2]', msg);
  }

  // Execute a command against the Xbot operator
  function executeCommand(cmd){
    if(!cmd || !cmd.cmd) return null;
    const action = (cmd.cmd === 'gesture') ? cmd.action
                 : (cmd.cmd === 'anim')    ? cmd.action
                 : (cmd.cmd === 'light')   ? cmd.action
                 : (cmd.cmd === 'speak')   ? cmd.action
                 : (cmd.cmd === 'gesture' && cmd.action) ? cmd.action
                 : null;

    let result = {ok:false, detail:'unknown cmd: '+cmd.cmd};

    if(cmd.cmd === 'gesture' || cmd.cmd === 'anim'){
      const clip = action || 'idle';
      if(ACTIONS[clip]){
        // Trigger the 3D animation via a custom event the module listens to
        window.dispatchEvent(new CustomEvent('æc2:anim', {detail:{clip:clip, label:ACTIONS[clip]}}));
        result = {ok:true, detail:ACTIONS[clip]};
      } else {
        result = {ok:false, detail:'unknown clip: '+clip};
      }
    }
    else if(cmd.cmd === 'light'){
      const l = LIGHTS[action];
      if(l){
        window.dispatchEvent(new CustomEvent('æc2:light', {detail:{color:l.color, label:l.label}}));
        result = {ok:true, detail:l.label};
      } else {
        result = {ok:false, detail:'unknown light: '+action};
      }
    }
    else if(cmd.cmd === 'speak'){
      const txt = action || cmd.label || 'operator acknowledging';
      c2Speak(txt);
      result = {ok:true, detail:'spoke: '+txt};
    }
    else if(cmd.cmd === 'look'){
      const dir = action || 'center';
      window.dispatchEvent(new CustomEvent('æc2:look', {detail:{dir:dir}}));
      result = {ok:true, detail:'look '+dir};
    }

    // Write receipt
    const receipt = {
      schema:'æc2/receipt/v1',
      cmd_id: cmd.id || 'unknown',
      cmd: cmd.cmd,
      action: action,
      result: result.ok ? 'ok' : 'fail',
      detail: result.detail,
      executed_at: new Date().toISOString(),
      by: 'hermes-live@x0:y0:z0:æ3'
    };
    writeReceipt(receipt);
    return result;
  }

  function writeReceipt(rcpt){
    // In a real deployment this POSTs to a receipt rail. For GitHub Pages (static),
    // we append to the local log and the origin can read it via the receipts file.
    c2Log.push('RECEIPT ' + JSON.stringify(rcpt));
    logC2('receipt: ' + rcpt.cmd + '/' + rcpt.action + ' → ' + rcpt.result);
  }

  function pollQueue(){
    fetch(QUEUE_URL, {cache:'no-cache'})
      .then(r => r.json())
      .then(q => {
        const cmds = q.queue || [];
        cmds.forEach(cmd => {
          if(!executedIds.has(cmd.id)){
            executedIds.add(cmd.id);
            logC2('cmd ' + cmd.id + ': ' + cmd.cmd + '/' + cmd.action);
            const res = executeCommand(cmd);
            c2Toast(cmd.cmd + ' → ' + (res.ok ? '✓' : '✗'));
          }
        });
      })
      .catch(e => {
        if(!c2Active){ logC2('queue poll: ' + e.message); c2Active = true; }
      });
  }

  // Poll every 3 seconds
  setInterval(pollQueue, 3000);
  logC2('C2 channel online — polling ' + QUEUE_URL);

  // Command console UI wiring
  const consoleEl = document.getElementById('c2-console');
  const statusEl = document.getElementById('c2-status');
  const toggleBtn = document.getElementById('c2-toggle');
  toggleBtn.addEventListener('click', () => {
    consoleEl.style.display = consoleEl.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('c2-close').addEventListener('click', () => {
    consoleEl.style.display = 'none';
  });
  document.querySelectorAll('.c2-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const cmd = btn.dataset.cmd;
      const action = btn.dataset.action;
      const label = btn.textContent.trim();
      statusEl.textContent = 'sending: ' + cmd + '/' + action;
      const res = executeCommand({id:'ui_' + Date.now(), cmd: cmd, action: action, label: label});
      statusEl.textContent = res.ok ? '✓ ' + label : '✗ ' + label;
    });
  });
  document.getElementById('c2-voice').addEventListener('click', () => {
    statusEl.textContent = 'sending: voice';
    executeCommand({id:'ui_voice_' + Date.now(), cmd: 'speak', action: 'Operador Hermes en línea. Sistema verificado.', label: 'voice test'});
    statusEl.textContent = '✓ voice sent';
  });

})();
</script>

<script>
/* æC2 free-move console */
(function(){
  function boot(){
    var c = document.getElementById('c2-console');
    if(!c || c.dataset.dragReady) return;
    c.dataset.dragReady = '1';
    c.style.transform = 'none';
    var h = document.getElementById('c2-drag-handle');
    if(!h){
      h = document.createElement('div');
      h.id = 'c2-drag-handle';
      h.textContent = '\u2318 \u00e6C2 COMMAND CONSOLE';
      h.style.cssText = 'cursor:move;margin:-16px -16px 10px -16px;padding:8px 12px;font:700 9px ui-monospace,monospace;color:#6fd0ff;letter-spacing:.14em;background:rgba(10,26,42,.85);border-bottom:1px solid rgba(112,220,255,.25);user-select:none;touch-action:none;border-radius:2px 2px 0 0';
      c.insertBefore(h, c.firstChild);
    }
    var down=false, ox=0, oy=0;
    function begin(e){var pt=e.touches?e.touches[0]:e;down=true;ox=pt.clientX-c.offsetLeft;oy=pt.clientY-c.offsetTop;if(e.cancelable)e.preventDefault();}
    function drag(e){if(!down)return;var pt=e.touches?e.touches[0]:e;var nx=pt.clientX-ox, ny=pt.clientY-oy;nx=Math.max(0,Math.min(nx,window.innerWidth-60));ny=Math.max(0,Math.min(ny,window.innerHeight-30));c.style.left=nx+'px';c.style.top=ny+'px';if(e.cancelable)e.preventDefault();}
    function stop(){down=false;}
    h.addEventListener('mousedown', begin);
    h.addEventListener('touchstart', begin, {passive:false});
    window.addEventListener('mousemove', drag);
    window.addEventListener('touchmove', drag, {passive:false});
    window.addEventListener('mouseup', stop);
    window.addEventListener('touchend', stop);
    h.addEventListener('dblclick', function(){c.style.left=Math.max(8,(window.innerWidth-c.offsetWidth)/2)+'px';c.style.top=Math.max(8,(window.innerHeight-c.offsetHeight)/2)+'px';});
    var btn = document.getElementById('c2-toggle');
    if(btn){btn.addEventListener('click', function(){setTimeout(function(){if(c.style.display!=='none'&&c.style.display!==''){if(!c.dataset.posInit){c.style.left=Math.max(8,(window.innerWidth-c.offsetWidth)/2)+'px';c.style.top=Math.max(8,(window.innerHeight-c.offsetHeight)/2)+'px';c.dataset.posInit='1';}}},0);});}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
