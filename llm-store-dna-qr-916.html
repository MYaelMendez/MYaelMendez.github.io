<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>>_LLM.STORE · DNA QR · 9:16</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020407;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: env(safe-area-inset-top, 0px);
  }

  /* ─── 9:16 FRAME ─── */
  #frame {
    position: relative;
    width: min(100vw, calc(100dvh * 0.78 * 9 / 16));
    height: calc(100dvh * 0.78);
    background: #020407;
    border-left: 4px solid #10156d;
    border-right: 4px solid #10156d;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));

  .brand {

  .protocol {

  /* QR area */
  .qr-link {

  }

  .meta {
    margin-top: 8px;

  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: auto;
    padding-top: 18px;
  }

  button, a.button {
    min-height: 48px;
    display: grid;
    place-items: center;

    border: 0;
    border-radius: 12px;
    font: 800 12px inherit;

  .copy {

</style>

<body>
  <div id="frame">
    <div class="panel">
      <div class="brand">&gt;_LLM.STORE × NOUS RESEARCH</div>
      <div class="protocol">DNA:// → QR:// → SVG://</div>

      <a id="qrLink" class="qr-link" target="_blank" rel="noopener noreferrer" aria-label="Open Nous Research referral">
        <div id="qr"></div>
      </a>

      <div class="label">DNA://</div>
      <div id="dnaText" class="dna"></div>
      <div id="meta" class="meta">generating phenotype…</div>

      <div class="actions">
        <button id="copy" class="copy" type="button">COPY THIS CODE</button>
        <a id="open" class="button open" target="_blank" rel="noopener noreferrer">OPEN →</a>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
const DNA = "https://portal.nousresearch.com/r/grandesmodelosdelenguaje-prompti";

async function sha256(text) {
  if (!crypto?.subtle) return "unavailable";
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(digest)].map(x => x.toString(16).padStart(2, "0")).join("");
}

function buildSVG(dna) {
  const qr = qrcode(0, "M");
  qr.addData(dna);
  qr.make();

  const N = qr.getModuleCount();
  const QUIET = 4;
  const TOTAL = N + QUIET * 2;

  let d = "";
  for (let row = 0; row < N; row++) {
    let start = -1;
    for (let col = 0; col <= N; col++) {
      const dark = col < N && qr.isDark(row, col);
      if (dark && start === -1) start = col;
      if (!dark && start !== -1) {
        const width = col - start;
        d += `M${start + QUIET} ${row + QUIET}h${width}v1h-${width}z`;
        start = -1;
      }
    }
  }

  return {
    svg: `
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 ${TOTAL} ${TOTAL}"
     preserveAspectRatio="xMidYMid meet"
     shape-rendering="crispEdges"
     data-dna="${escapeXML(dna)}"
     role="img"
     aria-label="Nous Research affiliate QR">
  <metadata>
    <dna>${escapeXML(dna)}</dna>
    <matrix>${N}x${N}</matrix>
    <error-correction>M</error-correction>
    <quiet-zone>${QUIET}</quiet-zone>
  </metadata>
  <rect width="${TOTAL}" height="${TOTAL}" fill="#fff"/>
  <path fill="#000" d="${d}"/>
</svg>`.trim(),
    matrix: N,
    viewport: TOTAL
  };
}

function escapeXML(v) {
  return v.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
          .replaceAll('"',"&quot;").replaceAll("'","&apos;");
}

async function regenerate() {
  const identity = await sha256(DNA);
  const phenotype = buildSVG(DNA);

  document.getElementById("qr").innerHTML = phenotype.svg;
  document.getElementById("dnaText").textContent = DNA;
  document.getElementById("qrLink").href = DNA;
  document.getElementById("open").href = DNA;
  document.getElementById("meta").textContent =
    `ID ${identity.slice(0,14)}… · ${phenotype.matrix}×${phenotype.matrix} · EC M`;
}

function serializeSelf() {
  return "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
}

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return;
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "absolute";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();
}

function saveDNA() {
  const record = { dna: DNA, type: "LLM.STORE/DNA", href: DNA };
  try { localStorage.setItem("llm.store:dna:" + DNA, JSON.stringify(record)); } catch(e) {}
  window.dispatchEvent(new CustomEvent("dna:save", { detail: record }));
}

document.getElementById("copy").addEventListener("click", async () => {
  const status = document.getElementById("status");
  try {
    await copyText(serializeSelf());
    saveDNA();
    status.textContent = "✓ CODE COPIED · DNA SAVE SIGNAL SENT";
    setTimeout(() => status.textContent = "", 2400);
  } catch {
    status.textContent = "COPY UNAVAILABLE";
  }
});

regenerate();
</script>
