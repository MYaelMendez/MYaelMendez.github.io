<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080">
<title>qr-as-skill</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#050505;color:#D4AF37;font-family:'JetBrains Mono','Consolas',monospace}
  #root{position:relative;width:100%;height:100%}
  .scanlines{position:absolute;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.20) 3px,rgba(0,0,0,.20) 4px)}
  .header{position:absolute;top:0;left:0;right:0;height:60px;display:flex;align-items:center;padding:0 40px;border-bottom:1px solid rgba(212,175,55,.3);z-index:10}
  .header h1{font-size:24px;font-weight:600;letter-spacing:2px}
  .header .tag{position:absolute;right:40px;font-size:14px;opacity:.5}
  .qr-grid{position:absolute;top:80px;left:40px;right:40px;bottom:80px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .qr-panel{background:rgba(212,175,55,.04);border:1px solid rgba(212,175,55,.15);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .qr-panel h2{font-size:16px;font-weight:600;margin-bottom:16px;opacity:.7;letter-spacing:1px}
  .qr-code{width:200px;height:200px;background:#fff;position:relative}
  .qr-dot{position:absolute;width:8px;height:8px;background:#050505}
  .qr-info{text-align:left;margin-top:20px;font-size:12px;opacity:.7;line-height:1.8}
  .telemetry{position:absolute;bottom:0;left:0;right:0;height:40px;display:flex;align-items:center;padding:0 40px;border-top:1px solid rgba(212,175,55,.15);font-size:11px;opacity:.4;gap:30px}
  .telemetry .dot{width:6px;height:6px;border-radius:50%;background:#00eaa0;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .progress-bar{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,#D4AF37,#00eaff);z-index:20}
</style>
</head>
<body>
<div id="root">
  <div class="progress-bar" id="progress" style="width:0%"></div>
  <div class="header">
    <h1>qr-as-skill</h1>
    <span class="tag">contract · verify · sovereign</span>
  </div>
  <div class="qr-grid">
    <div class="qr-panel">
      <h2>▸ SIGN</h2>
      <div class="qr-code" id="qr-sign"></div>
      <div class="qr-info">
        <div>contract: pc://authority</div>
        <div>hash: 7f3a9b…</div>
        <div>expires: +7d</div>
      </div>
    </div>
    <div class="qr-panel">
      <h2>▸ VERIFY</h2>
      <div class="qr-code" id="qr-verify"></div>
      <div class="qr-info">
        <div>status: VERIFIED</div>
        <div>receipt: faedda25…</div>
        <div>timestamp: now</div>
      </div>
    </div>
  </div>
  <div class="telemetry">
    <span><span class="dot"></span>sovereign</span>
    <span id="count"></span>
    <span id="receipt"></span>
    <span style="margin-left:auto" id="clock"></span>
  </div>
  <div class="scanlines"></div>
</div>
<script>
(function(){
  function drawQR(id){
    var el=document.getElementById(id);
    var sz=25;
    for(var y=0;y<sz;y++){for(var x=0;x<sz;x++){
      var dot=document.createElement('div');
      dot.className='qr-dot';
      var isEdge=(x<7&&y<7)||(x>=18&&y<7)||(x<7&&y>=18);
      var isData=Math.random()>.5;
      dot.style.left=(x*8)+'px';dot.style.top=(y*8)+'px';
      dot.style.display=(isEdge||isData)?'block':'none';
      el.appendChild(dot);
    }}
  }
  drawQR('qr-sign');drawQR('qr-verify');

  var total=2;var done=0;
  function tick(){done=Math.min(done+1,total);document.getElementById('progress').style.width=(done/total*100)+'%';if(done<total) requestAnimationFrame(tick)}
  requestAnimationFrame(tick);
  var ts=Math.floor(Date.now()/1000);
  var payload=JSON.stringify({action:'qr-as-skill',ts:ts});
  var hash=Array.prototype.reduce.call(payload,function(a,b){a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
  document.getElementById('receipt').textContent='sha256:'+(hash>>>0).toString(16).padStart(8,'0');
  document.getElementById('count').textContent='2 QR codes';
  document.getElementById('clock').textContent=new Date().toISOString();
})();
</script>

  background:#050505;padding:4px;cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
" onmouseover="this.style.transform='scale(1.1)';this.style.boxShadow='0 0 20px rgba(212,175,55,0.4)'"
   onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none'"
   onclick="window.open('https://myaelmendez.github.io/verify.html?url='+encodeURIComponent(location.href),'_blank')"
   title="æ:// Verify this surface">
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=48x48&data=https://myaelmendez.github.io/qr-as-skill.html&color=D4AF37&bgcolor=050505" 
       alt="QR Verify" style="width:100%;height:100%;display:block;">
</div>
</body>
</html>
