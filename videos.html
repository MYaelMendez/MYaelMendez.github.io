<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY Videos — MYaelMendez.github.io</title>
<style>
:root {
--bg: #0a0a0f;
--bg2: #0d0d1a;
--fg: #edfff6;
--fg2: #8899aa;
--accent: #00ff9f;
--accent2: #00ccff;
--muted: #556677;
--border: #1a2a3a;
--font: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: var(--font);
background: var(--bg);
color: var(--fg);
padding: 20px;
}
header {
text-align: center;
padding: 20px;
border-bottom: 1px solid var(--border);
}
header h1 {
color: var(--accent);
font-size: 1.8rem;
margin-bottom: 8px;
}
header p {
color: var(--muted);
font-size: 0.9rem;
}
.count {
color: var(--fg2);
font-size: 0.85rem;
margin-top: 8px;
}
main {
max-width: 1200px;
margin: 0 auto;
padding: 20px;
}
.filters {
display: flex;
flex-wrap: wrap;
gap: 10px;
margin-bottom: 20px;
align-items: center;
}
.filters select {
background: var(--bg2);
color: var(--fg);
border: 1px solid var(--border);
padding: 8px 12px;
font-family: var(--font);
font-size: 0.9rem;
border-radius: 4px;
cursor: pointer;
}
.category-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
gap: 16px;
padding: 10px 0;
}
.category {
border: 1px solid var(--border);
border-radius: 8px;
overflow: hidden;
background: var(--bg2);
}
.category-header {
padding: 12px 16px;
background: #111;
cursor: pointer;
display: flex;
justify-content: space-between;
align-items: center;
user-select: none;
}
.category-header h3 {
color: var(--accent);
font-size: 1.1rem;
display: flex;
align-items: center;
gap: 10px;
}
.category-header .count {
color: var(--muted);
font-size: 0.8rem;
}
.category-grid .category.show .category-body {
display: block;
}
.category-body {
display: none;
padding: 12px 16px;
}
.video-item {
display: flex;
align-items: center;
gap: 12px;
padding: 10px 12px;
border: 1px solid var(--border);
border-radius: 6px;
margin-bottom: 8px;
background: var(--bg);
transition: border-color 0.2s;
}
.video-item:hover {
border-color: var(--accent);
}
.video-item a {
flex: 1;
text-decoration: none;
color: var(--fg);
font-family: var(--font);
font-size: 0.85rem;
word-break: break-all;
}
.video-item a:hover {
color: var(--accent);
}
.video-item .size {
color: var(--muted);
font-size: 0.8rem;
white-space: nowrap;
padding-right: 10px;
}
.video-item .play-icon {
color: var(--accent);
font-size: 1.2rem;
flex-shrink: 0;
}
.footer {
text-align: center;
padding: 20px;
color: var(--muted);
font-size: 0.8rem;
}
@media (max-width: 600px) {
header h1 { font-size: 1.3rem; }
.category-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
<h1>📼 MY Videos</h1>
<p>MYaelMendez.github.io — Cloud Repository Video Collection</p>
<p class="count" id="count"><script>document.getElementById("count").textContent = "97 videos loaded";</script>
</header>
<main>
<div class="filters">
<select id="categoryFilter">
<option value="all">All Categories</option>
<option value="ai">AI / Neural</option>
<option value="industry">Industry 4.0</option>
<option value="religion">Theology</option>
<option value="agentic">Agentic Engineering</option>
<option value="brand">Brand / Marketing</option>
<option value="education">Education</option>
</select>
</div>
<div class="category-grid" id="grid">
</main>
<footer class="footer">
<p>MYaelMendez.github.io — Cloud Repository</p>
<p>All files are public on GitHub: <a href="https://github.com/MYaelMendez/MYaelMendez.github.io" style="color:var(--accent);">github.com/MYaelMendez/MYaelMendez.github.io</a></p>
<p>Video format: MP4 · Audio format: MP3</p>
</footer>
</body>
</html>
