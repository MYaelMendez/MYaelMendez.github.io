<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>æ://widget/kaenbaen@1.0.0 · Viewport</title>
<style>
  :root{ --void:#050505; --gold:#D4AF37; --cyan:#00eaff; --ink:#e8e6df;
         --mono:"JetBrains Mono",ui-monospace,Consolas,monospace; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--mono)}
  #stage{position:fixed;inset:0;z-index:0}
  #stage canvas{display:block}
  .scan{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.10;
    background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.5) 2px 4px)}
  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;
    flex-direction:column;justify-content:space-between;padding:14px}
  .bar{display:flex;justify-content:space-between;gap:10px;font-size:9px;letter-spacing:.16em;
    color:#6f6a5c;border:1px solid rgba(212,175,55,.22);border-top:2px solid var(--gold);
    padding:8px 11px;background:rgba(8,8,7,.82);pointer-events:auto;width:min(100%,520px)}
  .live{color:var(--cyan);display:flex;align-items:center;gap:6px}
  .dot{width:5px;height:5px;background:var(--cyan);border-radius:50%;box-shadow:0 0 10px var(--cyan)}
  .ok{color:#00ffa3}
  .bad{color:#ff5b5b}
  code{color:var(--gold)}
</style>
</head>
<body>
<!-- æ://widget/kaenbaen@1.0.0
     The QR addresses THIS manifest. Trust = re-hash the WASM and compare to
     trust.module_hash — checked independently of the QR.
     Spatial interface: Three.js (r147 UMD). Computation: widget_compute.wasm. -->
<div id="stage"></div>
<div class="scan"></div>
<div id="hud">
  <div class="bar">
    <span class="live"><i class="dot"></i>æ://widget/kaenbaen@1.0.0</span>
    <span id="wstatus">WASM LOADING…</span>
  </div>
  <div class="bar">
    <span id="whash">hash —</span>
    <span id="wframe">t=0</span>
  </div>
</div>

<script src="./vendor/three.global.js"></script>
<script>
/* ── widget runtime: verify hash → instantiate WASM → drive Three.js ── */
const MANIFEST_URL = './manifest.json';
const WASM_URL     = './dist/widget_compute.wasm';
const EXPECTED_HASH = '00d5500a58f66441d0318181da9061f9d36538e0c86c296960be3fd158bb7f2f';

const statusEl = document.getElementById('wstatus');
const hashEl   = document.getElementById('whash');
const frameEl  = document.getElementById('wframe');

/* SHA-256 of the module bytes — trust checked independently of any QR. */
async function sha256hex(buf){
  const d = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

let waveFn=null, t=0;

async function boot(){
  // 1) fetch the WASM, hash it, verify against the manifest's declared hash
  const resp = await fetch(WASM_URL);
  const bytes = await resp.arrayBuffer();
  const actual = await sha256hex(bytes);
  const match = (actual === EXPECTED_HASH);
  hashEl.textContent = 'sha256 ' + actual.slice(0,16) + '… ' + (match ? '✓' : '✗');

  if(!match){
    statusEl.textContent = 'REJECTED — hash mismatch';
    statusEl.className = 'bad';
    return;                       // do NOT run a module that fails verification
  }

  // 2) instantiate (computation layer)
  const { instance } = await WebAssembly.instantiate(bytes, {});
  waveFn = instance.exports.wave;
  const answer = instance.exports.answer();
  statusEl.textContent = 'WASM LIVE · answer()=' + answer;
  statusEl.className = 'ok';

  // 3) spatial interface (Three.js r147 UMD)
  render();
}

let renderer, scene, camera, mesh, geo;
function render(){
  const W = innerWidth, H = innerHeight;
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  renderer.setSize(W, H);
  renderer.setClearColor(0x1a1a2e);
  document.getElementById('stage').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x1a1a2e, 0.02);
  camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 200);
  camera.position.set(0, 0, 26);

  const N = 64;
  geo = new THREE.PlaneGeometry(20, 20, N, N);
  const mat = new THREE.MeshStandardMaterial({
    color:0xD4AF37, emissive:0x2a2205, metalness:.3, roughness:.5,
    wireframe:true, flatShading:true
  });
  mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  scene.add(new THREE.AmbientLight(0x8899ff, 0.8));
  const key = new THREE.DirectionalLight(0x00eaff, 1.4); key.position.set(8,12,10); scene.add(key);
  const rim = new THREE.PointLight(0xD4AF37, 1.2, 120);  rim.position.set(-12,-6,8);  scene.add(rim);

  animate();
}

/* drive every vertex through the WASM `wave()` — the mesh IS the computation */
function animate(){
  requestAnimationFrame(animate);
  if(waveFn){
    const pos = geo.attributes.position;
    const N = 64;
    for(let i=0;i<pos.count;i++){
      const ix = i % (N+1), iy = (i / (N+1)) | 0;
      pos.setZ(i, waveFn(ix, iy, t, 2026) * 2.2);
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
  }
  mesh.rotation.z = Math.sin(t*0.01)*0.15;
  renderer.render(scene, camera);
  if(t % 10 === 0) frameEl.textContent = 't=' + t;
  t++;
}

/* deterministic frame hook (same contract as the video scenes) */
window.__renderFrame = function(i, total){
  t = i;
  if(waveFn){
    const pos = geo.attributes.position;
    const N = 64;
    for(let k=0;k<pos.count;k++){
      const ix = k % (N+1), iy = (k / (N+1)) | 0;
      pos.setZ(k, waveFn(ix, iy, i, 2026) * 2.2);
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
  }
  if(mesh) mesh.rotation.z = Math.sin(i*0.01)*0.15;
  if(renderer) renderer.render(scene, camera);
};

boot().catch(e => { statusEl.textContent = 'ERR ' + e.message; statusEl.className='bad'; });
</script>
</body>
</html>
