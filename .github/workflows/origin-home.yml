name: Verify home and preserved origin
on:
  pull_request:
    paths: ['index.html', 'origin/**', 'work/**', 'tests/origin.test.mjs', 'tests/workspace.test.mjs', '.github/workflows/origin-home.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/origin.test.mjs tests/workspace.test.mjs
