<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Together — @yaelmendez</title>
<style>
:root{--bg:#03030a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#03030a}}
:root[data-theme="dark"]{--bg:#03030a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
svg{width:100%;height:100%;max-width:900px}
.s{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}}
</style>
</head>
<body>
<svg viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Together. Human://root at the center of the stack: environments, commandprompt, privateclient, daollc, cli llc, work here, sede de agentes. @yaelmendez">
<defs>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#fef08a"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<radialGradient id="cg"><stop offset="0" stop-color="#fef08a"/><stop offset=".7" stop-color="#67e8f9" stop-opacity=".4"/><stop offset="1" stop-color="#03030a" stop-opacity="0"/></radialGradient>
<filter id="gl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="1600" fill="#03030a"/>
<circle cx="450" cy="520" r="400" fill="url(#cg)" opacity=".3"/>

<!-- rings -->
<g><circle cx="450" cy="520" r="270" fill="none" stroke="#67e8f9" stroke-opacity=".2" stroke-dasharray="2 10"/>
<animateTransform attributeName="transform" type="rotate" from="0 450 520" to="360 450 520" dur="60s" repeatCount="indefinite"/></g>
<circle cx="450" cy="520" r="210" fill="none" stroke="#67e8f9" stroke-width="2" stroke-opacity=".45"/>

<!-- spokes from the root -->
<g stroke="#67e8f9" stroke-opacity=".3" stroke-dasharray="2 7">
<line x1="450" y1="520" x2="450" y2="310"/><line x1="450" y1="520" x2="614" y2="389"/><line x1="450" y1="520" x2="655" y2="567"/><line x1="450" y1="520" x2="541" y2="709"/><line x1="450" y1="520" x2="359" y2="709"/><line x1="450" y1="520" x2="245" y2="567"/><line x1="450" y1="520" x2="286" y2="389"/>
</g>
<g fill="#fef08a" filter="url(#gl)">
<circle r="4"><animateMotion dur="7s" repeatCount="indefinite" path="M450,520 L450,310"/></circle>
<circle r="4"><animateMotion dur="7s" begin="-1s" repeatCount="indefinite" path="M450,520 L614,389"/></circle>
<circle r="4"><animateMotion dur="7s" begin="-2s" repeatCount="indefinite" path="M450,520 L655,567"/></circle>
<circle r="4"><animateMotion dur="7s" begin="-3s" repeatCount="indefinite" path="M450,520 L541,709"/></circle>
<circle r="4"><animateMotion dur="7s" begin="-4s" repeatCount="indefinite" path="M450,520 L359,709"/></circle>
<circle r="4"><animateMotion dur="7s" begin="-5s" repeatCount="indefinite" path="M450,520 L245,567"/></circle>
<circle r="4"><animateMotion dur="7s" begin="-6s" repeatCount="indefinite" path="M450,520 L286,389"/></circle>
</g>

<!-- seven layers -->
<g fill="#03030a" stroke="#67e8f9" stroke-width="2.2">
<circle cx="450" cy="310" r="12"/><circle cx="614" cy="389" r="12"/><circle cx="655" cy="567" r="12"/><circle cx="541" cy="709" r="12"/><circle cx="359" cy="709" r="12"/><circle cx="245" cy="567" r="12"/><circle cx="286" cy="389" r="12"/>
</g>
<g class="s" font-size="16" fill="#e2e8f0">
<text x="450" y="276" text-anchor="middle">agentic environments</text><text x="450" y="296" text-anchor="middle" font-size="12" fill="#64748b" dy="-0">place</text>
<text x="636" y="372">commandprompt</text><text x="636" y="390" font-size="12" fill="#64748b">voice</text>
<text x="677" y="566">privateclient</text><text x="677" y="584" font-size="12" fill="#64748b">gate</text>
<text x="561" y="748">daollc</text><text x="561" y="766" font-size="12" fill="#64748b">structure</text>
<text x="339" y="748" text-anchor="end">cli.llc</text><text x="339" y="766" text-anchor="end" font-size="12" fill="#64748b">entity</text>
<text x="223" y="566" text-anchor="end">work here</text><text x="223" y="584" text-anchor="end" font-size="12" fill="#64748b">workspace</text>
<text x="264" y="372" text-anchor="end">sede de agentes</text><text x="264" y="390" text-anchor="end" font-size="12" fill="#64748b">learning</text>
</g>

<!-- the root -->
<circle cx="450" cy="520" r="28" fill="#fef08a" filter="url(#gl)"><animate attributeName="r" values="26;33;26" dur="3.2s" repeatCount="indefinite"/></circle>
<text class="s" x="450" y="578" text-anchor="middle" font-size="15" fill="#fef08a">Human://root</text>

<!-- title -->
<text x="450" y="1010" text-anchor="middle" font-size="120" font-weight="700" fill="url(#tg)" filter="url(#gl)" letter-spacing="-3">Together</text>
<text class="s" x="450" y="1070" text-anchor="middle" font-size="22" fill="#94a3b8" letter-spacing="5">one root. many agents.</text>
<text x="450" y="1118" text-anchor="middle" font-size="26" fill="#e2e8f0">@yaelmendez</text>

<!-- thesis -->
<text x="450" y="1250" text-anchor="middle" font-size="30" font-style="italic" fill="#e2e8f0">Agents act. Humans decide.</text>
<text x="450" y="1296" text-anchor="middle" font-size="30" font-style="italic" fill="#fef08a">The knowledge and tools belong to you.</text>

<text class="s" x="450" y="1530" text-anchor="middle" font-size="19" fill="#64748b" letter-spacing="2">&gt;_æææ://  ·  #ioa 🛸</text>
</svg>
</body>
</html>
