function camFor(t){

else if(t<5){const k=(t-2.5)/2.5;p.set(lerp(-6,-4,k),lerp(1.8,2.2,k),lerp(-6,-4,k));g.set(0,1.2,-4);fov=32}
else if(t<7.5){const k=(t-5)/2.5;p.set(lerp(-6,-4,k),lerp(2.2,2,k),lerp(-4,-6,k));g.set(0,1.2,0);fov=32}

return{p,g,fov}
}
