<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Sovereign Cast TEST14</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:16px monospace}
</style></head><body>
<div id="stage"><canvas id="c"></canvas><div id="msg">loading…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const msg=$('msg');
msg.textContent='BEFORE_TRY';
try{
const canvas=$('c');
msg.textContent='AFTER_CANVAS';
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
msg.textContent='AFTER_RENDERER';
renderer.setSize(720,1280);
msg.textContent='AFTER_SIZE';
const scene=new THREE.Scene();
msg.textContent='AFTER_SCENE';
const camera=new THREE.PerspectiveCamera(32,9/16,0.1,200);
msg.textContent='AFTER_CAMERA';
scene.add(new THREE.AmbientLight(0x404060,.6));
msg.textContent='AFTER_LIGHT';
const g=new THREE.GridHelper(20,20,0x00e5ff,0x111111);g.position.y=-.5;scene.add(g);
msg.textContent='AFTER_GRID';
const box=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0x00e5ff,wireframe:true}));scene.add(box);
msg.textContent='AFTER_BOX';
function frame(){
  requestAnimationFrame(frame);
  box.rotation.x+=.01;box.rotation.y+=.01;
  renderer.render(scene,camera);
}
msg.textContent='AFTER_FUNCTION';
msg.style.display='none';
requestAnimationFrame(frame);
msg.textContent='ANIMATING';
}catch(e){msg.textContent='ERROR: '+e.message}
</script>
</body></html>
