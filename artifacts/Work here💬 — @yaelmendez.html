<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work here💬 — @yaelmendez</title>
<style>
:root{--bg:#03030a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#03030a}}
:root[data-theme="dark"]{--bg:#03030a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
svg{width:100%;height:100%;max-width:900px}
.s{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}}
</style>
</head>
<body>
<svg viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Work here, many agents, one principal, @yaelmendez">
<defs>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#fef08a"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<radialGradient id="cg"><stop offset="0" stop-color="#fef08a"/><stop offset=".7" stop-color="#67e8f9" stop-opacity=".4"/><stop offset="1" stop-color="#03030a" stop-opacity="0"/></radialGradient>
<filter id="gl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="1600" fill="#03030a"/>
<circle cx="450" cy="520" r="400" fill="url(#cg)" opacity=".26"/>

<!-- authority boundary: stays with the principal -->
<circle cx="450" cy="520" r="62" fill="none" stroke="#fef08a" stroke-opacity=".5" stroke-dasharray="3 7"/>
<text class="s" x="450" y="610" text-anchor="middle" font-size="14" fill="#fef08a" fill-opacity=".7">authority</text>

<!-- three local workspaces -->
<path id="p1" d="M450,278 L450,454" fill="none" stroke="#67e8f9" stroke-opacity=".4" stroke-width="1.5"/>
<path id="p2" d="M290,692 Q370,630 414,548" fill="none" stroke="#67e8f9" stroke-opacity=".4" stroke-width="1.5"/>
<path id="p3" d="M610,692 Q530,630 486,548" fill="none" stroke="#67e8f9" stroke-opacity=".4" stroke-width="1.5"/>
<g fill="#03030a" stroke="#67e8f9" stroke-width="2">
<rect x="390" y="222" width="120" height="56" rx="10"/><rect x="190" y="692" width="120" height="56" rx="10"/><rect x="590" y="692" width="120" height="56" rx="10"/>
</g>
<g class="s" font-size="19" fill="#e2e8f0" text-anchor="middle">
<text x="450" y="257">build</text><text x="250" y="727">inspect</text><text x="650" y="727">review</text>
</g>

<!-- contributions return one at a time -->
<circle r="6" fill="#fef08a" filter="url(#gl)"><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0;.2;1"><mpath href="#p1"/></animateMotion></circle>
<circle r="6" fill="#fef08a" filter="url(#gl)"><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.25;.45;1"><mpath href="#p2"/></animateMotion></circle>
<circle r="6" fill="#fef08a" filter="url(#gl)"><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.5;.7;1"><mpath href="#p3"/></animateMotion></circle>

<!-- the principal -->
<circle cx="450" cy="520" r="26" fill="#fef08a" filter="url(#gl)"><animate attributeName="r" values="24;30;24" dur="3.2s" repeatCount="indefinite"/></circle>

<!-- returned counter -->
<g class="s" font-size="22" text-anchor="middle" fill="#94a3b8">
<text x="450" y="830">0 / 3 returned<animate attributeName="opacity" calcMode="discrete" values="1;0;0" keyTimes="0;.2;1" dur="9s" repeatCount="indefinite"/></text>
<text x="450" y="830">1 / 3 returned<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;.2;.45;1" dur="9s" repeatCount="indefinite"/></text>
<text x="450" y="830">2 / 3 returned<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;.45;.7;1" dur="9s" repeatCount="indefinite"/></text>
<text x="450" y="830" fill="#fef08a">3 / 3 returned · complete<animate attributeName="opacity" calcMode="discrete" values="0;1;1" keyTimes="0;.7;1" dur="9s" repeatCount="indefinite"/></text>
</g>
<text class="s" x="450" y="880" text-anchor="middle" font-size="15" fill="#64748b">draft · inspect · review · local</text>

<!-- title -->
<text x="450" y="1090" text-anchor="middle" font-size="96" font-weight="700" fill="url(#tg)" filter="url(#gl)" letter-spacing="-2">Work here💬</text>
<text class="s" x="450" y="1146" text-anchor="middle" font-size="22" fill="#94a3b8" letter-spacing="5">many agents. one principal.</text>
<text x="450" y="1194" text-anchor="middle" font-size="26" fill="#e2e8f0">@yaelmendez</text>

<!-- thesis -->
<text x="450" y="1330" text-anchor="middle" font-size="30" font-style="italic" fill="#e2e8f0">Nothing runs until you review it.</text>
<text x="450" y="1376" text-anchor="middle" font-size="30" font-style="italic" fill="#fef08a">Context may propagate. Authority does not.</text>

<text class="s" x="450" y="1530" text-anchor="middle" font-size="19" fill="#64748b" letter-spacing="2">&gt;_æææ://  ·  #ioa 🛸</text>
</svg>
</body>
</html>
