function camFor(t){
let p,g,fov=32;
if(t<5){const k=ease(t/5);p.set(lerp(0,0,k),lerp(3,1.8,k),lerp(8,4,k));g.set(0,1,0);fov=lerp(35,30,k)}
else if(t<10){const k=(t-5)/5;p.set(-4,1.6,2);g.set(-6,1.6,-8);fov=32}
else if(t<15){const k=ease((t-10)/5);p.set(lerp(4,0,k),lerp(1.5,2.2,k),lerp(2,5,k));g.set(0,1.2,-3);fov=32}
else if(t<20){const k=ease((t-15)/5);p.set(lerp(0,2.5,k),lerp(2.2,1.6,k),lerp(5,2,k));g.set(3,1,-2);fov=30}
else if(t<25){const k=ease((t-20)/5);p.set(lerp(3,1,k),lerp(1.6,2.5,k),lerp(2,6,k));g.set(0,1.2,-5);fov=32}
else{const k=ease(clamp((t-25)/4.2,0,1));p.set(lerp(1,0,k),lerp(2.5,3.5,k),lerp(6,8,k));g.set(0,1,-4);fov=lerp(32,28,k)}
return{p,g,fov}}
