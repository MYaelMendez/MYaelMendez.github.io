<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asimov Face Viewport — GIF source</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#040706;color:#c9ffe9;font-family:"JetBrains Mono",ui-monospace,monospace;overflow:hidden}
  #canvas{display:block;width:100vw;height:100vh}
  .info{position:fixed;bottom:12px;left:12px;z-index:100;font:9px var(--mono);color:#5e8f7d;letter-spacing:.1em}
  .info span{color:#00ff9f}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="info">Asimov face viewport &nbsp;<span id="mode">MIRROR</span></div>
<script type="importmap">
{ "imports": {
  "three": "./governed-robot/assets/vendor/three.module.js",
  "three/addons/": "./governed-robot/assets/vendor/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MaskEngine, MODES, STATES, STATE_COLORS } from './governed-robot/modules/mask.js';

const FW=480, FH=854;
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setSize(FW, FH);
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040706);

const camera = new THREE.PerspectiveCamera(38, FW/FH, 0.01, 40);
camera.position.set(0, 0.3, 0.6);

const light = new THREE.HemisphereLight(0xfff0cf, 0x06120c, 0.9);
scene.add(light);
const key = new THREE.DirectionalLight(0xffe0a0, 2.5);
key.position.set(0.8, 1.4, 1.6); scene.add(key);
const rim = new THREE.DirectionalLight(0x00ff9f, 1.3);
rim.position.set(-1.4, 0.6, -1.2); scene.add(rim);
const fill = new THREE.DirectionalLight(0x70dcff, 0.7);
fill.position.set(-0.8, -0.3, 1.4); scene.add(fill);

const maskCanvas = document.createElement('canvas');
maskCanvas.width = FW; maskCanvas.height = FH;

const mask = new MaskEngine(maskCanvas);
mask.setMode('MIRROR'); mask.setState('IDLE');

const gltfLoader = new GLTFLoader();
const model = await new Promise((resolve, reject) => {
  gltfLoader.load('./assets/gltf/asimov-web.glb', resolve, undefined, reject);
});
const mesh = model.scene;
mesh.scale.set(0.8, 0.8, 0.8);
mesh.rotation.y = Math.PI / 2;
scene.add(mesh);

// Add ring indicator around face
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(0.22, 0.004, 20, 64),
  new THREE.MeshBasicMaterial({ color: 0x00ff9f, transparent: true, opacity: 0.4 })
);
ring.rotation.x = Math.PI / 2;
ring.position.y = -0.05;
scene.add(ring);

// Window grid overlay
const grid = new THREE.GridHelper(0.5, 16, 0x1d4a5f, 0x0d2430);
grid.position.y = -0.08;
grid.material.transparent = true;
grid.material.opacity = 0.5;
scene.add(grid);

let modeIdx = 0;
const modeCycle = ['MIRROR', 'FACE', 'TEXT'];
let lastTime = performance.now();

function animate(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  // Cycle face modes
  mask.setMode(modeCycle[modeIdx]);
  document.getElementById('mode').textContent = modeCycle[modeIdx];
  modeIdx = (modeIdx + 1) % modeCycle.length;

  // Auto-rotate the robot
  mesh.rotation.y += dt * 0.15;
  mesh.rotation.x += dt * 0.08;
  mask.draw(now);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate(0);
</script>
</body>
</html>
