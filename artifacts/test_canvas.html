<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Sovereign Cast TEST10</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
canvas{display:block}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:16px monospace}
</style></head><body>
<div id="stage"><canvas id="c"></canvas><div id="msg">loading…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const msg=$('msg');
try{
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
renderer.setSize(720,1280);
msg.textContent = 'RENDERER_OK';
}catch(e){
  msg.textContent = 'ERROR: ' + e.message;
}
</script>
</body></html>
