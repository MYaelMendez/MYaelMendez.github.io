<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>æ Watch — Neon Command Lines</title><style>
body{margin:0;background:#07090a;color:#d6e2dc;font-family:monospace;display:grid;place-items:center;min-height:100vh}
.watch{width:min(88vw,360px);aspect-ratio:1;border-radius:50%;border:3px solid #3dffa8;position:relative;background:radial-gradient(circle,#01015e,#07090a);box-shadow:0 0 60px #3dffa855}
.hand{position:absolute;left:50%;top:50%;transform-origin:0 0;background:#f2feff}
.hour{width:34%;height:5px}.minute{width:48%;height:3px;background:#85e9fc}.second{width:52%;height:2px;background:#ffb000}
.center{position:absolute;left:50%;top:50%;width:14px;height:14px;background:#3dffa8;border-radius:50%;transform:translate(-50%,-50%)}
.tick{position:absolute;left:50%;top:50%;width:2px;height:12px;background:#6f817c;transform-origin:0 0}
#time{margin-top:18px;font-size:22px;color:#5ee7ff;letter-spacing:.1em}
</style></head><body>
<div><div class=watch id=w><div class="hand hour" id=h></div><div class="hand minute" id=m></div><div class="hand second" id=s></div><div class=center></div></div><div id=time>00:00:00</div><p style="color:#6f817c;font-size:12px">æ WATCH · TEXAS TIME · NEON COMMAND LINES</p></div>
<script>
const w=document.getElementById('w');
for(let i=0;i<12;i++){const t=document.createElement('div');t.className='tick';t.style.transform=`rotate(${i*30}deg) translateY(-150px)`;w.append(t);}
function tick(){const d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Chicago'}));const s=d.getSeconds(),m=d.getMinutes(),h=d.getHours()%24;
document.getElementById('s').style.transform=`rotate(${s*6}deg)`;
document.getElementById('m').style.transform=`rotate(${m*6+s*0.1}deg)`;
document.getElementById('h').style.transform=`rotate(${h*15+m*0.25}deg)`;
document.getElementById('time').textContent=d.toLocaleTimeString('en-GB');}
setInterval(tick,1000);tick();
</script></body></html>
