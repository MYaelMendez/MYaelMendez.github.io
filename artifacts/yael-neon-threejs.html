<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js';
const stage=document.getElementById('stage');const scene=new THREE.Scene();scene.background=new THREE.Color(0x01015e);scene.fog=new THREE.FogExp2(0x01015e,.009);
const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,200);camera.position.set(0,0,28);

const cyan=new THREE.Color('#85e9fc');const core=new THREE.MeshBasicMaterial({color:0xf2feff});const inner=new THREE.MeshBasicMaterial({color:cyan});

const plate=new THREE.Mesh(new THREE.BoxGeometry(10.6,14.4,.32),new THREE.MeshPhysicalMaterial({color:0x0a14c8,metalness:.2,roughness:.25,transparent:true,opacity:.96,clearcoat:.6,clearcoatRoughness:.2}));plate.position.z=-.33;sign.add(plate);

let orbit=true,pulse=true,drag=false,lastX=0,lastY=0,targetX=0,targetY=0,zoom=28;const spin=document.getElementById('spin'),puls=document.getElementById('pulse'),glowBtn=document.getElementById('glow');

renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;targetY=Math.max(-.8,Math.min(.8,targetY+(e.clientX-lastX)*.005));targetX=Math.max(-.4,Math.min(.4,targetX+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(18,Math.min(44,zoom+e.deltaY*.018))},{passive:true});
