<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>æ:// skill-guide — local skill library</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--void:#050505;--gold:#D4AF37;--gold2:#f0d487;--neon:#00ff9d;--ink:#f0ece4;
  --muted:rgba(240,236,228,.42);--border:rgba(212,175,55,.16);--hot:rgba(212,175,55,.5);
  --glow:rgba(212,175,55,.32)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--void);color:var(--ink);font-family:'JetBrains Mono',monospace;line-height:1.5}
canvas#mesh{position:fixed;inset:0;z-index:0;opacity:.5}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(212,175,55,.012) 2px 4px)}
.vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(5,5,5,.9) 100%)}
.wrap{position:relative;z-index:10;max-width:1200px;margin:0 auto;padding:24px 16px 80px}
.bar{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--border);padding:8px 12px;
  font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.bar .live{color:var(--neon);display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero{padding:32px 0 20px}
.hero .cmd{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:3px;font-size:clamp(20px,4vw,38px);
  color:var(--gold);text-shadow:0 0 20px var(--glow)}
.hero h1{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:1px;font-size:clamp(16px,2.6vw,24px);
  margin-top:10px;color:var(--ink)}
.hero p{color:var(--muted);font-size:12px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0}
.stat{border:1px solid var(--border);padding:12px;background:rgba(212,175,55,.03)}
.stat .v{font-family:'Orbitron',sans-serif;font-size:22px;color:var(--gold)}
.stat .k{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-top:4px}
.search{width:100%;border:1px solid var(--hot);background:rgba(5,5,5,.8);color:var(--ink);
  font-family:'JetBrains Mono',monospace;font-size:14px;padding:14px 16px;margin:8px 0 14px;outline:none}
.search::placeholder{color:var(--muted)}
.search:focus{box-shadow:0 0 24px rgba(212,175,55,.18)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{border:1px solid var(--border);padding:5px 10px;font-size:10px;letter-spacing:1px;color:var(--muted);
  cursor:pointer;background:transparent;font-family:'JetBrains Mono',monospace;transition:all .15s}
.chip:hover{border-color:var(--hot);color:var(--ink)}
.chip.on{background:var(--gold);color:#050505;border-color:var(--gold);font-weight:700}
.grp{margin-top:26px}
.grp-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px}
.grp-head h2{font-family:'Orbitron',sans-serif;font-size:15px;letter-spacing:1px;color:var(--gold)}
.grp-head .n{font-size:10px;color:var(--muted);letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{border:1px solid var(--border);padding:13px 14px;background:rgba(212,175,55,.025);
  cursor:pointer;transition:border-color .15s,transform .15s;position:relative}
.card:hover{border-color:var(--hot);transform:translateY(-2px)}
.card .name{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.5px;color:var(--ink)}
.card .desc{font-size:11px;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:9px;letter-spacing:.5px;padding:2px 6px;border:1px solid var(--border);color:var(--muted)}
.tag.r{color:var(--gold);border-color:rgba(212,175,55,.3)}
.tag.s{color:var(--neon);border-color:rgba(0,255,157,.3)}
.tag.t{color:#00eaff;border-color:rgba(0,234,255,.3)}
.copy{position:absolute;top:10px;right:10px;font-size:9px;color:var(--muted);border:1px solid var(--border);
  padding:2px 6px;background:rgba(5,5,5,.7);opacity:0;transition:opacity .15s}
.card:hover .copy{opacity:1}
.copy:hover{color:var(--gold);border-color:var(--hot)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:40px}
.foot{margin-top:40px;border-top:1px solid var(--border);padding-top:16px;font-size:10px;color:var(--muted);letter-spacing:1px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;border:1px solid var(--gold);
  background:rgba(5,5,5,.96);color:var(--gold);font-size:12px;padding:9px 18px;letter-spacing:1px;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

// stats
const S = {
  total: DATA.skills.length,
  groups: DATA.groups.length,
  refs: DATA.skills.reduce((a,s)=>a+s.r,0),
  scripts: DATA.skills.reduce((a,s)=>a+s.s,0),
  templates: DATA.skills.reduce((a,s)=>a+s.t,0),
  lines: DATA.skills.reduce((a,s)=>a+s.ln,0),
};
document.getElementById('stats').innerHTML = [
  ['SKILLS', S.total], ['GROUPS', S.groups], ['REFERENCES', S.refs],
  ['SCRIPTS', S.scripts], ['TEMPLATES', S.templates], ['LINES', S.lines.toLocaleString()],
].map(([k,v])=>`<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');

const GLABEL = {}; DATA.groups.forEach(g=>GLABEL[g.key]=g.label);
let activeGroup = null, query = '';

// filter chips
const chips = document.getElementById('filters');
chips.innerHTML = `<button class="chip on" data-g="">ALL ${S.total}</button>` +
  DATA.groups.map(g=>`<button class="chip" data-g="${g.key}">${g.label} ${g.count}</button>`).join('');
chips.addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  activeGroup = b.dataset.g || null;
  chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===b));
  render();
});

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){
  const q = query.toLowerCase();
  const list = document.getElementById('list');
  const groups = {};
  let shown = 0;
  DATA.skills.forEach(s=>{
    if(activeGroup && s.g!==activeGroup) return;
    if(q && !(s.n.toLowerCase().includes(q) || (s.x||'').toLowerCase().includes(q) || GLABEL[s.g].toLowerCase().includes(q))) return;
    (groups[s.g] = groups[s.g] || []).push(s);
    shown++;
  });
  document.getElementById('cnt').textContent = shown;
  if(!shown){ list.innerHTML = '<div class="empty">no skills match — clear the filter or query</div>'; return; }
  const order = DATA.groups.map(g=>g.key);
  list.innerHTML = order.filter(g=>groups[g]).map(g=>`
    <div class="grp">
      <div class="grp-head"><h2>${GLABEL[g]}</h2><span class="n">${groups[g].length} skill${groups[g].length>1?'s':''}</span></div>
      <div class="grid">
        ${groups[g].map(s=>`
          <div class="card" data-name="${esc(s.n)}" title="copy: ${esc(s.n)}">
            <div class="name">${esc(s.n)}</div>
            <div class="desc">${esc(s.x)||'—'}</div>
            <div class="meta">
              ${s.r?`<span class="tag r">${s.r} ref</span>`:''}
              ${s.s?`<span class="tag s">${s.s} script</span>`:''}
              ${s.t?`<span class="tag t">${s.t} tpl</span>`:''}
              ${s.v?`<span class="tag">v${esc(s.v)}</span>`:''}
              <span class="tag">${s.ln} ln</span>
            </div>
            <span class="copy">copy</span>
          </div>`).join('')}
      </div>
    </div>`).join('');
  list.querySelectorAll('.card').forEach(c=>c.addEventListener('click', ()=>copyName(c.dataset.name)));
}

function copyName(n){
  navigator.clipboard?.writeText(n);
  const t = document.getElementById('toast');
  t.textContent = '✓ skill_view(name=\''+n+'\')';
  t.classList.add('on'); setTimeout(()=>t.classList.remove('on'), 1600);
}

document.getElementById('q').addEventListener('input', e=>{ query = e.target.value; render(); });

// neural mesh
(function(){
  const c=document.getElementById('mesh'), x=c.getContext('2d');
  let W,H,pts=[];
  function size(){ W=c.width=innerWidth; H=c.height=innerHeight;
    const n=Math.min(60,Math.floor(W*H/32000));
    pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28})); }
  addEventListener('resize',size); size();
  (function loop(){
    x.clearRect(0,0,W,H);
    for(const p of pts){ p.x+=p.vx;p.y+=p.vy; if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1; }
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.hypot(dx,dy);
      if(d<130){ x.strokeStyle=`rgba(212,175,55,${(1-d/130)*.13})`;x.lineWidth=1;
        x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[j].x,pts[j].y);x.stroke(); } }
    for(const p of pts){ x.fillStyle='rgba(212,175,55,.5)';x.beginPath();x.arc(p.x,p.y,1.5,0,7);x.fill(); }
    requestAnimationFrame(loop);
  })();
})();

render();
</script>
