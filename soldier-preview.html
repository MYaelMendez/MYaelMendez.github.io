<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HERMES-AGENT // Digital Human Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;font-family:"JetBrains Mono","SF Mono",monospace}
#stage{position:absolute;inset:0;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.hud{position:absolute;z-index:2;pointer-events:none;color:#c8d8e8}
.hud-top{top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}
.hud-title{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6fd0ff}
.hud-title b{color:#ffe6a3}
.hud-status{font-size:10px;letter-spacing:.14em;color:#00ff9d;text-transform:uppercase}
.hud-status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#00ff9d;margin-right:6px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hud-bottom{bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-end;font-size:9px;letter-spacing:.12em;color:#5a7a8a;text-transform:uppercase}
.hud-bottom .left,.hud-bottom .right{display:flex;flex-direction:column;gap:3px}
.hud-bottom .right{text-align:right}
.hud-bottom b{color:#6fd0ff}
.scan{position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.15) 2px 4px)}
.vig{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,10,.7) 100%)}
.gate{position:absolute;left:0;right:0;top:50%;height:1px;z-index:2;pointer-events:none;background:linear-gradient(90deg,transparent,#ff3355,transparent);opacity:.5}
.gate-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;font-size:8px;letter-spacing:.3em;color:#ff3355;text-transform:uppercase;background:rgba(10,10,15,.8);padding:4px 12px;border:1px solid #ff335533}
</style>
</head>
<body>
<div id="stage">
  <canvas id="h"></canvas>
  <div class="scan"></div>
  <div class="vig"></div>
  <div class="gate"></div>
  <div class="gate-label">THE GATE</div>
  <div class="hud hud-top">
    <div class="hud-title">HERMES-AGENT <b>//</b> DIGITAL HUMAN</div>
    <div class="hud-status"><span class="dot"></span>LIVE</div>
  </div>
  <div class="hud hud-bottom">
    <div class="left">
      <div>æ:// <b>sovereign</b></div>
      <div>ææ:// <b>private client</b></div>
      <div>æææ:// <b>digital twin</b></div>
    </div>
    <div class="right">
      <div>ED25519 <b>signed</b></div>
      <div>9:16 <b>vertical</b></div>
      <div>three.js <b>webgl</b></div>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"./assets/vendor/three.module.js","three/addons/":"./assets/vendor/","three/addons/utils/":"./assets/utils/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/GLTFLoader.js';

const cv = document.getElementById('h');
const renderer = new THREE.WebGLRenderer({canvas:cv, alpha:false, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setClearColor(0x0a0a0f, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.06);

scene.add(new THREE.AmbientLight(0x1a2a3a, 0.6));
const key = new THREE.DirectionalLight(0xffe6a3, 1.8);
key.position.set(4, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6fd0ff, 1.2);
rim.position.set(-4, 3, -4);
scene.add(rim);
const fill = new THREE.PointLight(0x00ff9d, 0.5, 20);
fill.position.set(0, 2, 3);
scene.add(fill);

const grid = new THREE.GridHelper(20, 40, 0x1a3a4a, 0x0d1f2a);
grid.position.y = 0;
scene.add(grid);

const camera = new THREE.PerspectiveCamera(38, 9/16, 0.1, 60);
camera.position.set(0, 1.8, 6.5);
camera.lookAt(0, 1.2, 0);

function resize(){
  const b = cv.getBoundingClientRect();
  renderer.setSize(b.width, b.height, false);
  camera.aspect = b.width/b.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function makeHalo(color, radius, tilt){
  const g = new THREE.TorusGeometry(radius, 0.015, 8, 64);
  const m = new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.7});
  const mesh = new THREE.Mesh(g, m);
  mesh.rotation.x = tilt;
  mesh.rotation.z = tilt * 0.5;
  return mesh;
}
const halo1 = makeHalo(0xffe6a3, 0.9, Math.PI/2.2);
const halo2 = makeHalo(0x6fd0ff, 1.1, Math.PI/2.5);
halo1.position.y = 2.2;
halo2.position.y = 2.2;
scene.add(halo1, halo2);

const mixer = { value: null };
let soldier = null;
let clips = {};
let currentAction = null;
let nextAction = null;
let blendT = 0;
const BLEND_DUR = 0.8;

new GLTFLoader().load('assets/gltf/Soldier.glb', (gltf) => {
  soldier = gltf.scene;
  scene.add(soldier);
  soldier.position.set(0, 0, 0);
  soldier.scale.set(1.1, 1.1, 1.1);
  soldier.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; }});

  const anims = gltf.animations || [];
  anims.forEach(c => { clips[c.name.toLowerCase()] = c; });

  const mixerObj = new THREE.AnimationMixer(soldier);
  mixer.value = mixerObj;

  const idleClip = clips['idle'] || clips['mixamo.com'] || anims[0];
  if(idleClip){
    currentAction = mixerObj.clipAction(idleClip);
    currentAction.play();
  }

  let state = 0;
  const states = ['idle', 'walk', 'run', 'walk', 'idle'];
  setInterval(() => {
    state = (state + 1) % states.length;
    const nextClip = clips[states[state]];
    if(nextClip && mixerObj){
      nextAction = mixerObj.clipAction(nextClip);
      nextAction.reset();
      nextAction.play();
      blendT = 0;
    }
  }, 4000);

}, undefined, (e) => console.error('Soldier load failed', e));

let t = 0;
renderer.setAnimationLoop(() => {
  t += 0.016;

  if(mixer.value && currentAction && nextAction && blendT < BLEND_DUR){
    blendT += 0.016;
    const alpha = Math.min(blendT / BLEND_DUR, 1);
    currentAction.weight = 1 - alpha;
    nextAction.weight = alpha;
    if(alpha >= 1){
      currentAction = nextAction;
      nextAction = null;
    }
  }
  if(mixer.value) mixer.value.update(0.016);

  if(soldier){
    soldier.rotation.y = Math.sin(t * 0.25) * 0.08;
    soldier.position.y = Math.sin(t * 0.8) * 0.02;
  }

  halo1.rotation.z += 0.003;
  halo2.rotation.z -= 0.002;
  halo1.position.y = 2.2 + Math.sin(t * 0.5) * 0.05;
  halo2.position.y = 2.2 + Math.sin(t * 0.5 + 1) * 0.05;

  grid.position.z = (t * 0.3) % 0.5;

  renderer.render(scene, camera);
});
</script>
</body>
</html>
