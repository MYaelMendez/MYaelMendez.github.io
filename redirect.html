<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>æææ:// → github.io redirect</title>
<meta http-equiv="refresh" content="0; url=https://MYaelMendez.github.io/">
<link rel="canonical" href="https://MYaelMendez.github.io/">
<style>
:root{
  --void:#050505;
  --gold:#D4AF37;
  --neon:#00ff9f;
  --ink:#e2e8f0;
  --muted:#66758a;
  --border:rgba(212,175,55,.25);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px}
.glyph{font-size:64px;font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(212,175,55,.4);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.msg{font-size:13px;letter-spacing:.15em;color:var(--muted)}
.msg strong{color:var(--neon)}
.url{font-size:11px;color:var(--gold);text-decoration:none;border:1px solid var(--border);padding:8px 16px;border-radius:999px;transition:.2s}
.url:hover{background:rgba(212,175,55,.1);border-color:var(--gold)}
.scan{position:fixed;inset:0;pointer-events:none;opacity:.15;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.3) 3px 4px)}
</style>
</head>
<body>
<div class="scan"></div>
<div class="glyph">æææ</div>
<div class="msg">REDIRECTING TO <strong>github.io</strong> · GLOCAL CONTROL</div>
<a class="url" href="https://MYaelMendez.github.io/">https://MYaelMendez.github.io/</a>
<div class="msg" style="font-size:10px;opacity:.5">æææ.com → github.io · sovereign surface migration</div>
<script>
window.location.replace("https://MYaelMendez.github.io/");
</script>

<!-- æ:// QR Verification Badge -->

  width:56px;height:56px;border:1px solid #D4AF37;border-radius:8px;
  background:#050505;padding:4px;cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
" onmouseover="this.style.transform='scale(1.1)';this.style.boxShadow='0 0 20px rgba(212,175,55,0.4)'"
   onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none'"
