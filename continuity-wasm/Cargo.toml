[package]
name = "continuity-core"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM core for the governed continuity record — reactive derivation + canonical hash."
license = "MIT"
repository = "https://github.com/MYaelMendez/MYaelMendez.github.io"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
