name: test
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: python -m py_compile __init__.py scripts/*.py dashboard/*.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Desktop plugin check
        run: npm run check && npm test
