[project]
name = "tiny-voca-voice"
version = "1.2.0"
description = "Self-hosted English TTS for Hermes agents: tiny-voca ONNX runtime, named voices, voice-to-compute identity map, hash-chained receipts, and narrated Asimov stick lessons."
authors = [{name = "Yæl Méndez", email = "yaelmendez@users.noreply.github.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
runtime = ["numpy", "onnxruntime>=1.16", "dizione"]
dev = ["pytest"]

[tool.tiny-voca]
model = "n4ze3m/tiny-voca"
model_sha256 = "fe6d918791a15b82e37465981d7f27a070e46b46635e5a3482fc8dff87a1ae46"
voices = ["F2", "M2"]
sample_rate = 24000
