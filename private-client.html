const CMDS={'#connect':[{t:'cmd',x:'>_æ|#connect'},{t:'r',k:'hermes conductor',v:'standing by',c:'n'},{t:'r',k:'mcp protocol',v:'1517'},{t:'r',k:'context',v:'#startabusiness',c:'g'},{t:'r',k:'status',v:'ready',c:'n'}],'#deploy':[{t:'cmd',x:'>_æ|#deploy'},{t:'r',k:'skill',v:'installed',c:'n'},{t:'r',k:'viewport',v:'9:16 native'},{t:'r',k:'namespace',v:'æ.store',c:'g'},{t:'r',k:'surface',v:'github pages · live'}],'#formation':[{t:'cmd',x:'>_æ|#formation'},{t:'r',k:'blueprint',v:'loaded',c:'n'},{t:'r',k:'providers',v:'^atlas · ^doola',c:'g'},{t:'r',k:'entity',v:'user-controlled'},{t:'r',k:'jurisdiction',v:'your rules'}],'^cash':[{t:'cmd',x:'>_æ|^cash'},{t:'r',k:'stripe',v:'connected',c:'n'},{t:'r',k:'mode',v:'self-owning',c:'g'},{t:'r',k:'keys',v:'user-held'},{t:'r',k:'reachy',v:'watching'}],'#serve':[{t:'cmd',x:'>_æ|#serve'},{t:'r',k:'clerk',v:'reachyᴿ',c:'g'},{t:'r',k:'surface',v:'physical · digital'},{t:'r',k:'posture',v:'ready',c:'n'},{t:'r',k:'role',v:'explain #startabusiness'}],'$OS250':[{t:'cmd',x:'>_æ|$OS250'},{t:'r',k:'mission',v:'250 businesses',c:'g'},{t:'r',k:'philosophy',v:'#opensourceware',c:'n'},{t:'r',k:'method',v:'one command · one person'},{t:'r',k:'promise',v:'full agency',c:'g'}],'#manifesto':[{t:'cmd',x:'>_æ|#manifesto'},{t:'r',k:'+æ',v:'adds context',c:'g'},{t:'r',k:'^æ',v:'compresses language',c:'g'},{t:'r',k:'>_æ',v:'executes',c:'n'},{t:'r',k:'',v:'we equip owners with care',c:'g'}]};

const $=id=>document.getElementById(id);const wait=ms=>new Promise(r=>setTimeout(r,ms));async function type(el,text,spd=48){el.textContent='';for(const ch of text){el.textContent+=ch;await wait(spd+Math.random()*20)}}function mkLine(d){const el=document.createElement('div');el.className='ln '+d.t;if(d.t==='sys'||d.t==='meta'||d.t==='cmd'){el.textContent=d.x}else if(d.t==='r'){const k=d.k?'<span class="k">'+d.k+'</span>':'';const c=d.c?' '+d.c:'';el.innerHTML='<span class="arr">→</span>'+k+'<span class="v'+c+'">'+d.v+'</span>'}return el}async function feed(lines,ms=65){const o=$('o');for(const d of lines){const el=mkLine(d);o.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));o.scrollTop=o.scrollHeight;await wait(ms)}}function exec(raw){const cmd=raw.trim();if(!cmd)return;const key=cmd.toLowerCase();if(CMDS[key]){feed(CMDS[key]);const p=$('sg').querySelector('[data-c="'+key+'"]');if(p)p.classList.add('done')}else{feed([{t:'cmd',x:'>_æ|'+cmd},{t:'err',x:'  not recognized'},{t:'err',x:'  try: '+SUG.slice(0,4).join(' · ')}])}}$('ci').addEventListener('keydown',e=>{if(e.key==='Enter'){exec($('ci').value);$('ci').value=''}});function buildSug(){SUG.forEach(cmd=>{const b=document.createElement('button');b.className='pill';b.textContent=cmd;b.dataset.c=cmd.toLowerCase();b.addEventListener('click',()=>{exec(cmd);b.classList.add('done')});$('sg').appendChild(b)})}function tick(){$('clk').textContent=new Date().toTimeString().slice(0,8)}setInterval(tick,1000);tick();async function auth(){await wait(500);await type($('at'),'æ:// authenticating...',52);await wait(900);$('ag').classList.add('show');await wait(1100);$('auth').classList.add('out');await wait(700);$('auth').style.display='none';$('term').classList.remove('hidden');await wait(200);await feed(BOOT,55);await wait(250);buildSug()}auth();
