<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>æ:// digital human · three.js</title>
<style>
  html,body{margin:0;height:100%;background:#050505;color:#e8e6df;
    font-family:ui-monospace,Consolas,monospace;overflow:hidden}
  body{display:grid;place-items:center}
  .stage{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));
    aspect-ratio:9/16;background:radial-gradient(120% 80% at 50% 20%,#0c0c12 0%,#050505 70%);
    overflow:hidden;box-shadow:0 0 60px rgba(212,175,55,.08)}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;inset:0;pointer-events:none;padding:22px;display:flex;flex-direction:column;justify-content:space-between}
  .hud .top small{color:#D4AF37;letter-spacing:.14em;font-size:11px}
  .hud .top h1{margin:6px 0 0;font-size:clamp(18px,4.4vw,30px);font-weight:700;letter-spacing:.02em}
  .hud .top p{margin:6px 0 0;color:#8f8a7c;font-size:11px;letter-spacing:.06em}
  .hud .bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:10.5px;color:#6f6a5c}
  .hud .bot b{color:#D4AF37;font-weight:400}
  .badge{display:inline-block;padding:4px 8px;border:1px solid #D4AF37;border-radius:4px;color:#D4AF37;font-size:10px}
  .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%)}
</style></head>
<body>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="scan"></div><div class="vig"></div>
  <div class="hud">
    <div class="top">
      <small>&gt;_ æ:// DIGITAL HUMAN</small>
      <h1>the mirror</h1>
      <p>voice + face &nbsp;·&nbsp; the thing mirrored is the twin</p>
    </div>
    <div class="bot">
      <span>sovereign <b>·</b> x10:y7:z0:æ3</span>
      <span class="badge">three.js native · no NVIDIA · no Blender</span>
    </div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050505, 0.045);

const camera = new THREE.PerspectiveCamera(40, 9/16, 0.1, 120);
camera.position.set(0, 2.05, 7.8);
camera.lookAt(0, 1.7, 0);

const GOLD = 0xD4AF37;
scene.add(new THREE.AmbientLight(0x404040, 0.7));
const key = new THREE.PointLight(0xffe6a3, 1.5, 40); key.position.set(4, 6, 5); scene.add(key);
const rim = new THREE.PointLight(0x6fd0ff, 1.1, 40); rim.position.set(-5, 2, -4); scene.add(rim);

const human = new THREE.Group(); scene.add(human);
const wire  = new THREE.MeshBasicMaterial({color:GOLD, wireframe:true, transparent:true, opacity:0.9});
const wire2 = new THREE.MeshBasicMaterial({color:0xf0d27a, wireframe:true, transparent:true, opacity:0.5});
function add(geo, x, y, z, mat){ const m = new THREE.Mesh(geo, mat||wire); m.position.set(x,y,z); human.add(m); return m; }

// ── the figure ──
const head = add(new THREE.IcosahedronGeometry(0.60, 1), 0, 3.20, 0);
add(new THREE.CylinderGeometry(0.22, 0.26, 0.34, 8), 0, 2.72, 0, wire2);       // neck
const chest = add(new THREE.CapsuleGeometry(0.66, 0.95, 6, 16), 0, 1.90, 0);    // torso
add(new THREE.CapsuleGeometry(0.50, 0.40, 6, 14), 0, 1.00, 0, wire2);           // waist
add(new THREE.CapsuleGeometry(0.56, 0.30, 6, 14), 0, 0.60, 0);                  // pelvis
[-1,1].forEach(s=>{                                                             // arms
  add(new THREE.SphereGeometry(0.28, 10, 8), s*0.78, 2.40, 0, wire2);
  const ua = add(new THREE.CapsuleGeometry(0.19, 0.72, 6, 12), s*0.95, 1.92, 0); ua.rotation.z = s*0.22;
  const fa = add(new THREE.CapsuleGeometry(0.16, 0.66, 6, 12), s*1.06, 1.16, 0, wire2); fa.rotation.z = s*0.12;
  add(new THREE.IcosahedronGeometry(0.16, 0), s*1.10, 0.78, 0, wire2);          // hand
});
[-1,1].forEach(s=>{                                                             // legs
  add(new THREE.CapsuleGeometry(0.24, 0.90, 6, 12), s*0.30, -0.05, 0, wire2);
  add(new THREE.CapsuleGeometry(0.18, 0.86, 6, 12), s*0.30, -1.00, 0, wire2);
});

// sovereign halo + ground rings
const halo = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.018, 8, 90),
  new THREE.MeshBasicMaterial({color:GOLD, transparent:true, opacity:0.85}));
halo.position.set(0, 3.20, 0); halo.rotation.x = Math.PI/2; human.add(halo);

const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.010, 6, 120),
  new THREE.MeshBasicMaterial({color:0x6fd0ff, transparent:true, opacity:0.5}));
ring2.position.set(0, 3.20, 0); ring2.rotation.x = Math.PI/2; human.add(ring2);

const base = new THREE.Mesh(new THREE.TorusGeometry(1.55, 0.012, 6, 140),
  new THREE.MeshBasicMaterial({color:0x6fd0ff, transparent:true, opacity:0.45}));
base.position.set(0, -1.55, 0); base.rotation.x = Math.PI/2; scene.add(base);

// particles
const N = 460, pg = new THREE.BufferGeometry(), pp = new Float32Array(N*3);
for(let i=0;i<N;i++){ pp[i*3]=(Math.random()-0.5)*17; pp[i*3+1]=Math.random()*9-2.2; pp[i*3+2]=(Math.random()-0.5)*17; }
pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
const pts = new THREE.Points(pg, new THREE.PointsMaterial({color:GOLD, size:0.035, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending}));
scene.add(pts);

const grid = new THREE.GridHelper(46, 46, 0x3a3320, 0x16130a); grid.position.y = -1.55; scene.add(grid);

// ── resize ──
function resize(){ const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width/r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(canvas); resize();

// ── animate ──
const clock = new THREE.Clock();
function frame(){
  const t = clock.getElapsedTime();
  human.position.y = Math.sin(t*0.8)*0.05;
  human.rotation.y = Math.sin(t*0.28)*0.30;
  head.rotation.y  = Math.sin(t*0.60)*0.12;
  head.rotation.x  = Math.sin(t*0.40)*0.05;
  const b = Math.sin(t*1.3);
  chest.scale.set(1+b*0.02, 1+b*0.03, 1+b*0.02);
  halo.rotation.z += 0.008;
  ring2.rotation.z -= 0.005;
  base.rotation.z -= 0.004;
  pts.rotation.y = t*0.02;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
window.__ready = true;
</script>
</body></html>
