<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
const stage=document.getElementById('stage');const scene=new THREE.Scene();scene.background=new THREE.Color(0x02051b);scene.fog=new THREE.FogExp2(0x02051b,.013);
const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,200);camera.position.set(0,0,29);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
const sign=new THREE.Group();scene.add(sign);const cyan=new THREE.Color('#00dfff');const core=new THREE.MeshBasicMaterial({color:0xc9ffff});const inner=new THREE.MeshBasicMaterial({color:cyan});const glow=new THREE.MeshBasicMaterial({color:0x005eff,transparent:true,opacity:.085,depthWrite:false,blending:THREE.AdditiveBlending});const blueGlow=new THREE.MeshBasicMaterial({color:0x00dfff,transparent:true,opacity:.065,depthWrite:false,blending:THREE.AdditiveBlending});
function tube(points,r,material){const curve=new THREE.CatmullRomCurve3(points);const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(16,points.length*2),r,7,false),material);sign.add(mesh);return mesh}
const paths=[...document.querySelectorAll('#paths path')];for(const p of paths){const len=p.getTotalLength(),n=Math.max(24,Math.ceil(len/4)),pts=[];for(let i=0;i<=n;i++){const v=p.getPointAtLength(len*i/n);pts.push(new THREE.Vector3((v.x-300)/54,(400-v.y)/54,Number(p.dataset.depth||0)))}tube(pts,.039,core);tube(pts,.07,inner);tube(pts,.17,blueGlow);tube(pts,.32,glow)}
const plate=new THREE.Mesh(new THREE.BoxGeometry(10.6,14.4,.32),new THREE.MeshPhysicalMaterial({color:0x030c32,metalness:.3,roughness:.17,transparent:true,opacity:.94,clearcoat:1,clearcoatRoughness:.1}));plate.position.z=-.33;sign.add(plate);
const back=new THREE.Mesh(new THREE.BoxGeometry(11.2,15,.25),new THREE.MeshStandardMaterial({color:0x020820,metalness:.65,roughness:.25}));back.position.z=-.57;sign.add(back);
const light=new THREE.PointLight(0x008dff,45,30);light.position.set(0,0,3);scene.add(light);scene.add(new THREE.AmbientLight(0x2946b0,.7));
const stars=new THREE.BufferGeometry(),arr=[];for(let i=0;i<360;i++){arr.push((Math.random()-.5)*85,(Math.random()-.5)*75,-10-Math.random()*40)}stars.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));const particles=new THREE.Points(stars,new THREE.PointsMaterial({color:0x235cb9,size:.045,transparent:true,opacity:.6}));scene.add(particles);
let orbit=true,pulse=true,drag=false,lastX=0,lastY=0,targetX=0,targetY=0,zoom=29;const spin=document.getElementById('spin'),puls=document.getElementById('pulse');spin.onclick=()=>{orbit=!orbit;spin.textContent=orbit?'⟳ ORBIT ON':'⟳ ORBIT OFF'};puls.onclick=()=>{pulse=!pulse;puls.textContent=pulse?'✦ PULSE ON':'✦ PULSE OFF'};document.getElementById('reset').onclick=()=>{targetX=targetY=0;zoom=29;orbit=true;pulse=true;spin.textContent='⟳ ORBIT ON';puls.textContent='✦ PULSE ON'};
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;targetY=Math.max(-.8,Math.min(.8,targetY+(e.clientX-lastX)*.005));targetX=Math.max(-.4,Math.min(.4,targetX+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(19,Math.min(45,zoom+e.deltaY*.018))},{passive:true});
let t=0;function animate(){requestAnimationFrame(animate);t+=.012;const auto=orbit?Math.sin(t*.22)*.16:0;sign.rotation.y+=(targetY+auto-sign.rotation.y)*.05;sign.rotation.x+=(targetX-sign.rotation.x)*.05;camera.position.z+=(zoom-camera.position.z)*.08;light.intensity=pulse?36+Math.sin(t*1.7)*8:40;particles.rotation.y+=.00009;renderer.render(scene,camera)}animate();
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<650?51:37;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}window.addEventListener('resize',resize);resize();
