<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#050505"/>
<title>æ:/markets · stocks · bonds · commodities</title>
<meta name="description" content="Sovereign market tape — equities, treasuries, commodities. Keyless, client-side, honest about staleness."/>
<link rel="canonical" href="https://myaelmendez.github.io/aipodcast_me/markets.html"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --void:#050505;--gold:#D4AF37;--gold2:#f0d487;--emerald:#00ff9d;--cyan:#00eaff;
  --red:#ff4d5f;--violet:#8c72ff;--ink:#e8e6df;--muted:#6f6a5c;--line:rgba(212,175,55,.22);
  --mono:"JetBrains Mono",ui-monospace,monospace;--display:"Orbitron",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:var(--void);color:var(--ink);font-family:var(--mono)}
body{padding:max(12px,env(safe-area-inset-top)) 12px calc(26px + env(safe-area-inset-bottom))}
.scan{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:.16;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.5) 2px 4px)}
.wrap{position:relative;z-index:10;width:min(100%,1180px);margin:0 auto}

.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-size:9px;letter-spacing:.16em;color:var(--muted);
  border:1px solid var(--line);border-top:2px solid var(--gold);
  padding:9px 12px;background:rgba(8,8,7,.82)}
.bar a{color:var(--gold);text-decoration:none}
.bar .live{color:var(--emerald)}
.bar .stale{color:var(--red)}

/* ── the tape ── */
.tape{margin-top:0;border:1px solid var(--line);border-top:0;background:#070706;overflow:hidden;
  white-space:nowrap;position:relative;height:34px;display:flex;align-items:center}
.tape-inner{display:inline-flex;gap:26px;padding-left:12px;
  animation:scroll 60s linear infinite;will-change:transform}
.tape:hover .tape-inner{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick{font-size:10px;letter-spacing:.04em;display:inline-flex;gap:6px;align-items:baseline}
.tick .s{color:var(--muted)}
.tick .p{color:var(--ink);font-weight:700}
.tick .c{font-weight:700}
.up{color:var(--emerald)}
.dn{color:var(--red)}
.fl{color:var(--muted)}

.hero{text-align:center;padding:26px 12px 18px}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(17px,4.2vw,26px);letter-spacing:.05em;
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--cyan));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .sub{margin-top:9px;font-size:9px;letter-spacing:.19em;color:var(--muted)}

.panel{margin-top:16px;border:1px solid var(--line);background:rgba(8,8,7,.78)}
.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;
  padding:10px 13px;border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.18em;color:var(--gold)}
.panel-head .tag{color:var(--muted);font-size:8px;letter-spacing:.14em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:1px;background:var(--line)}
.cell{background:#070706;padding:12px 13px}
.cell .k{font-size:8px;letter-spacing:.16em;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.cell .n{margin-top:7px;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.02em}
.cell .px{margin-top:8px;font-family:var(--display);font-size:19px;font-weight:900;letter-spacing:.01em}
.cell .ch{margin-top:6px;font-size:9.5px;font-weight:700}
.cell .mt{margin-top:5px;font-size:7.5px;color:var(--muted);line-height:1.5}
.cell.err .px{color:var(--red);font-size:12px;font-family:var(--mono);font-weight:400}

.bar-l{height:2px;background:rgba(212,175,55,.14);margin-top:9px;overflow:hidden}
.bar-l i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}

.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 13px}
button{font:700 9px var(--mono);letter-spacing:.12em;padding:9px 14px;cursor:pointer;
  border:1px solid rgba(0,255,157,.4);background:rgba(0,255,157,.07);color:var(--emerald)}
button:active{background:var(--emerald);color:#00160e}
button.alt{border-color:rgba(212,175,55,.4);background:rgba(212,175,55,.07);color:var(--gold)}
label.sw{display:flex;align-items:center;gap:6px;font-size:8px;color:var(--muted);cursor:pointer}
.foot{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;
  font-size:8.5px;letter-spacing:.13em;color:var(--muted)}
.foot a{color:var(--gold);text-decoration:none}
@media(max-width:640px){ .grid{grid-template-columns:1fr 1fr} .cell .px{font-size:16px} }
</style>
</head>
<body>
<div class="scan"></div>

<main class="wrap">

  <div class="bar">
    <span>æ:/markets</span>
    <span id="status">INITIALIZING</span>
    <span><a href="./">← HQ</a></span>
  </div>

  <!-- tape -->
  <div class="tape"><div class="tape-inner" id="tape"><span class="tick"><span class="s">loading…</span></span></div></div>

  <section class="hero">
    <h1>SOVEREIGN MARKET TAPE</h1>
    <div class="sub">EQUITIES · TREASURIES · COMMODITIES · <span style="color:var(--emerald)">CLIENT-SIDE, NO API KEY</span></div>
  </section>

  <!-- EQUITIES -->
  <section class="panel">
    <div class="panel-head"><span>◈ EQUITIES</span><span class="tag" id="eqTag">—</span></div>
    <div class="grid" id="eq"></div>
  </section>

  <!-- BONDS -->
  <section class="panel">
    <div class="panel-head"><span>◈ BOND MARKETS · TREASURY YIELDS</span><span class="tag" id="bdTag">—</span></div>
    <div class="grid" id="bd"></div>
  </section>

  <!-- COMMODITIES -->
  <section class="panel">
    <div class="panel-head"><span>◈ COMMODITIES</span><span class="tag" id="cmTag">—</span></div>
    <div class="grid" id="cm"></div>
  </section>

  <section class="panel">
    <div class="ctrls">
      <button id="bRef">REFRESH</button>
      <button class="alt" id="bAuto">AUTO: OFF</button>
      <label class="sw"><input type="checkbox" id="cbCors"/> show transport detail</label>
      <span id="tmeta" style="font-size:8px;color:var(--muted)"></span>
    </div>
  </section>

  <div class="foot">
    <span>source · Yahoo Finance chart API (keyless) · æ:/markets</span>
    <span>#HERMIPHICATIONISINEVITABLE</span>
  </div>
</main>

<script type="module">
/* ══════════════════════════════════════════════════════════════
   æ:/markets — client-side tape.
   Keyless Yahoo chart endpoint. Every value is fetched or the cell
   says why it is empty. No invented prices, ever.
   ══════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);

const GROUPS = {
  eq: {
    tag:"eqTag", el:"eq",
    items:[
      { s:"^GSPC", n:"S&P 500",   d:"US large cap" },
      { s:"^IXIC", n:"Nasdaq",    d:"US tech" },
      { s:"^DJI",  n:"Dow Jones", d:"US industrials" },
      { s:"AAPL",  n:"Apple",     d:"equity" },
      { s:"NVDA",  n:"NVIDIA",    d:"equity · compute" },
      { s:"MSFT",  n:"Microsoft", d:"equity" },
      { s:"BTC-USD", n:"Bitcoin", d:"digital" },
      { s:"^VIX",  n:"VIX",       d:"volatility" },
    ]
  },
  bd: {
    tag:"bdTag", el:"bd",
    items:[
      { s:"^TNX", n:"US 10Y",  d:"10-year treasury yield", unit:"%" },
      { s:"^FVX", n:"US 5Y",   d:"5-year treasury yield",  unit:"%" },
      { s:"^TYX", n:"US 30Y",  d:"30-year treasury yield", unit:"%" },
      { s:"^IRX", n:"US 13W",  d:"13-week bill yield",     unit:"%" },
    ]
  },
  cm: {
    tag:"cmTag", el:"cm",
    items:[
      { s:"GC=F", n:"Gold",      d:"COMEX gold · USD/oz" },
      { s:"SI=F", n:"Silver",    d:"COMEX silver · USD/oz" },
      { s:"CL=F", n:"Crude WTI", d:"NYMEX light sweet" },
      { s:"BZ=F", n:"Brent",     d:"ICE brent crude" },
      { s:"NG=F", n:"Nat Gas",   d:"Henry Hub" },
      { s:"HG=F", n:"Copper",    d:"COMEX copper" },
      { s:"ZC=F", n:"Corn",      d:"CBOT corn" },
      { s:"ZW=F", n:"Wheat",     d:"CBOT wheat" },
    ]
  }
};

const ALL = Object.values(GROUPS).flatMap(g => g.items);
const cache = new Map();

/* ── transport ─────────────────────────────────────────────
   Three tiers, in order, each honest about what it did:

   1. LIVE BROKER — the droplet's /xrpc/ae.vps.markets. It reaches the
      upstream chart API and returns ACAO:*, which the upstream does NOT.
      Blocked today by mixed content (this page is https, the broker is
      http) until TLS exists on the droplet — which needs DNS + port 80,
      currently held by nginx. So this tier is usually unreachable.
   2. LIVE DIRECT — upstream chart API straight from the tab. No ACAO
      header, so the browser blocks it from an https origin.
   3. BAKED SNAPSHOT — markets.json, refreshed by the broker and committed
      with the surface. Always renders; always labelled with its age.

   No tier invents a price. If all three fail the cell prints why.
   ────────────────────────────────────────────────────────── */

const BROKER = "http://129.212.180.252:3000/xrpc/ae.vps.markets";
const SNAPSHOT = "./markets.json";
let lastMode = "";

async function viaBroker(){
  const res = await fetch(BROKER, { cache:"no-store" });
  if(!res.ok) throw new Error("broker HTTP " + res.status);
  const j = await res.json();
  if(!j || !Array.isArray(j.quotes)) throw new Error("broker: bad shape");
  return j.quotes;
}

async function viaSnapshot(){
  const res = await fetch(SNAPSHOT, { cache:"no-store" });
  if(!res.ok) throw new Error("snapshot HTTP " + res.status);
  const j = await res.json();
  if(!j || !Array.isArray(j.quotes)) throw new Error("snapshot: bad shape");
  return j;
}

async function viaDirect(sym){
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=1d&interval=1d`;
  const res = await fetch(url, { cache:"no-store" });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  const m = j?.chart?.result?.[0]?.meta;
  if(!m) throw new Error("no meta");
  const price = m.regularMarketPrice;
  if(price === undefined || price === null) throw new Error("no price");
  const prev = m.chartPreviousClose ?? m.previousClose;
  const chg = (prev !== undefined && prev !== null) ? price - prev : null;
  return { sym, ok:true, price, prev, chg,
           pct: (chg !== null && prev) ? (chg / prev) * 100 : null,
           currency: m.currency, marketTime: m.regularMarketTime,
           exchange: m.fullExchangeName || m.exchangeName };
}

/* ── render ──────────────────────────────────────────────── */

const fmt = (v, unit) => {
  if(v === null || v === undefined) return "—";
  const n = unit === "%" ? v.toFixed(3)
          : v >= 1000 ? v.toLocaleString(undefined,{maximumFractionDigits:2})
          : v.toFixed(2);
  return n + (unit || "");
};

const ageOf = ts => {
  if(!ts) return "no timestamp";
  const s = Math.max(0, Math.floor(Date.now()/1000) - ts);
  if(s < 90)  return s + "s ago";
  if(s < 5400) return Math.round(s/60) + "m ago";
  if(s < 172800) return Math.round(s/3600) + "h ago";
  return Math.round(s/86400) + "d ago";
};

function cell(item, q, err, transport){
  const cls = err ? "cell err" : "cell";
  if(err){
    return `<div class="${cls}">
      <div class="k"><span>${item.s}</span><span>ERR</span></div>
      <div class="n">${item.n}</div>
      <div class="px">${err.slice(0,44)}</div>
      <div class="mt">${transport || ""}</div>
    </div>`;
  }
  const dir = q.chg === null ? "fl" : (q.chg > 0 ? "up" : q.chg < 0 ? "dn" : "fl");
  const arrow = q.chg === null ? "" : (q.chg > 0 ? "▲" : q.chg < 0 ? "▼" : "·");
  const sign = q.chg !== null && q.chg > 0 ? "+" : "";
  return `<div class="${cls}">
    <div class="k"><span>${q.sym}</span><span>${q.exchange ? q.exchange.slice(0,14) : ""}</span></div>
    <div class="n">${item.n}</div>
    <div class="px">${fmt(q.price, item.unit)}</div>
    <div class="ch ${dir}">${arrow} ${sign}${fmt(q.chg)} ${q.pct !== null ? "(" + sign + q.pct.toFixed(2) + "%)" : ""}</div>
    <div class="mt">${item.d}<br>${ageOf(q.marketTime)}${transport ? " · " + transport : ""}</div>
  </div>`;
}

function renderGroup(key, results){
  const g = GROUPS[key];
  const ok = results.filter(r => !r.err).length;
  $(g.tag).textContent = `${ok}/${g.items.length} live`;
  $(g.el).innerHTML = results.map(r => cell(r.item, r.q, r.err, r.transport)).join("");
}

/* ── refresh all ─────────────────────────────────────────── */

let refreshing = false;
let lastGood = 0;

async function refresh(){
  if(refreshing) return;
  refreshing = true;
  $("bRef").disabled = true;

  const showCors = $("cbCors").checked;
  const results = new Map();
  let mode = "", detail = "";

  // ── tier 1: live broker (one request for the whole board) ──
  let fromBroker = null;
  try{
    const t0 = performance.now();
    const quotes = await viaBroker();
    fromBroker = new Map(quotes.map(q => [q.sym, q]));
    mode = "LIVE · broker";
    detail = `droplet · ${Math.round(performance.now()-t0)}ms · ${quotes.filter(q=>q.ok).length}/${quotes.length}`;
    for(const q of quotes) if(q.ok) cache.set(q.sym, q);
  }catch(e){
    detail = "broker unreachable";
  }

  // ── tier 3 prep: baked snapshot (fetched once, used if broker missed) ──
  let snap = null, snapAt = null;
  if(!fromBroker){
    try{
      const s = await viaSnapshot();
      snap = new Map(s.quotes.map(q => [q.sym, q]));
      snapAt = s.baked_at;
      mode = "SNAPSHOT";
      detail = "baked · " + ageOf(snapAt);
    }catch(e){ detail += " · snapshot failed"; }
  }

  await Promise.all(ALL.map(async item => {
    if(fromBroker && fromBroker.has(item.s) && fromBroker.get(item.s).ok){
      results.set(item.s, { item, q: fromBroker.get(item.s), transport: showCors ? detail : "" });
      return;
    }
    if(snap && snap.has(item.s) && snap.get(item.s).ok){
      results.set(item.s, { item, q: snap.get(item.s), transport: showCors ? detail : "" });
      return;
    }
    try{
      const q = await viaDirect(item.s);
      if(!mode){ mode = "LIVE · direct"; detail = "tab → upstream"; }
      cache.set(item.s, q);
      results.set(item.s, { item, q, transport: showCors ? "direct" : "" });
    }catch(e){
      const prev = cache.get(item.s);
      if(prev){
        results.set(item.s, { item, q:prev, transport: showCors ? `cached (${e.message.slice(0,24)})` : "" });
      }else{
        results.set(item.s, { item, err: e.message, transport: showCors ? detail : "" });
      }
    }
  }));

  for(const key of Object.keys(GROUPS)){
    const rs = GROUPS[key].items.map(i => results.get(i.s));
    renderGroup(key, rs);
  }

  const live = [...results.values()].filter(r => !r.err).length;
  $("status").innerHTML = live === ALL.length
    ? `<span class="live">● ALL ${live}/${ALL.length} LIVE</span>`
    : `<span class="stale">● ${live}/${ALL.length} live · ${ALL.length - live} unavailable</span>`;
  lastMode = mode || "offline";
  $("tmeta").textContent = `${lastMode} · ${detail} · ${new Date().toLocaleTimeString()}`;

  buildTape([...results.values()].filter(r => r.q && !r.err));
  $("bRef").disabled = false;
  refreshing = false;
}

/* ── scrolling tape ──────────────────────────────────────── */

function buildTape(rows){
  if(!rows.length) return;
  const one = rows.map(r => {
    const dir = r.q.chg === null ? "fl" : (r.q.chg > 0 ? "up" : r.q.chg < 0 ? "dn" : "fl");
    const sign = r.q.chg !== null && r.q.chg > 0 ? "+" : "";
    return `<span class="tick"><span class="s">${r.item.n}</span>` +
           `<span class="p">${fmt(r.q.price, r.item.unit)}</span>` +
           `<span class="c ${dir}">${sign}${r.q.pct !== null ? r.q.pct.toFixed(2) + "%" : "—"}</span></span>`;
  }).join("");
  $("tape").innerHTML = one + one;   // duplicated for a seamless loop
}

/* ── controls ────────────────────────────────────────────── */

let autoTimer = null;
$("bRef").onclick = refresh;
$("bAuto").onclick = () => {
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; $("bAuto").textContent = "AUTO: OFF"; $("bAuto").classList.add("alt"); }
  else { autoTimer = setInterval(refresh, 60000); $("bAuto").textContent = "AUTO: 60s"; $("bAuto").classList.remove("alt"); refresh(); }
};
$("cbCors").onchange = refresh;

refresh();
console.info("%cæ:/markets%c keyless client-side tape",
  "color:#D4AF37;background:#050505;padding:5px 10px;font-weight:bold",
  "color:#00ff9d;font-family:monospace");
</script>
</body>
</html>
