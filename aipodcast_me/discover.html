<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",

<script type="module">
import * as THREE from "three/webgpu";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ══════════════════════════════════════════════════════════
   TAXONOMY — episode clusters with videolab wired in
   ══════════════════════════════════════════════════════════ */

const CATEGORIES = [
  { name:"MESH OVERVIEW",  signal:"æ://mesh → 3 bots + liveness · RTX 3050 @ 325ms",
    surface:"/",                color:0xD4AF37 },
  { name:"VIDEO LAB",      signal:"æ://videolab render → cuda-mcp2 + holomesh · {{matmul_ms}}",
    surface:"/videolab.html",   color:0x00eaff },
  { name:"4D HOLOMESH",    signal:"æ://gpu/probe · tesseract hologram · 128 particles",
    surface:"/holomesh.html",   color:0xff4d8f },
  { name:"MARKET TAPE",    signal:"æ://mesh · 20 tickers live · WebGPU + WebMCP probes",
    surface:"/markets.html",   color:0x00ff9d },
  { name:"SCIENCE & TECH", signal:"Effects of noise on man · #neuroplasticity · systems, compute, capability",
    surface:"/llm-store-dna-qr.html",        color:0x00eaff },
  { name:"FAITH & RELIGION", signal:"Biblioteca Luterana · Haugean legacy · theology of agency",
    surface:"/hauge-teologia.html",          color:0xD4AF37 },
  { name:"AI ETHICS & GOV", signal:"Who should act? · authority, consent, revocation",
    surface:"/sovaereign-os.html",           color:0x8c72ff },
  { name:"E+LEARNING",     signal:"Molt School · open knowledge · teach early what others learn late",
    surface:"/molt-earth-ultimate-fractal.html",  color:0x00ff9d },
  { name:"GENERATIVE #E-Learning", signal:"Generated curricula · agentic literacy · distributed learning",
    surface:"/ae-store-pico-os.html",        color:0x67e8f9 },
  { name:"POLITICS & ECONOMY", signal:"Consumer Redline Index · household balance sheet · sovereign value",
    surface:"/cri-school-of-hermes.html",    color:0xff9a4d },
  { name:"POPULAR CULTURE", signal:"#zeitgeist · conversation → delegation · the age of agents",
    surface:"/zeitgeist-4d.html",            color:0xff4d8f },
  { name:"🎙️ #DEEPDIVES", signal:"Coming 🔜 · long-form dives across every rail · in development",
    surface:"/cri-teleprompter.html",        color:0xf0d487 }
];

const FIELD_RADIUS = 15;

/* ══════════════════════════════════════════════════════════
   RENDERER — WebGPU (auto-falls back to WebGL2)
   ══════════════════════════════════════════════════════════ */

let renderer, scene, camera, controls;
let clusterGroups = [], labels = [], field, halo;
let selected = -1, autoOrbit = true;
let pointerDown = null;

const stage = document.getElementById("stage");

async function init(){

  renderer = new THREE.WebGPURenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x050505);
  stage.appendChild(renderer.domElement);

  await renderer.init();                       /* WebGPU device acquisition */

  const gpu = !!navigator.gpu;
  const label = gpu ? "GPU://WEBGPU" : "GPU://WEBGL2 FALLBACK";
  document.getElementById("modeLabel").textContent = label;
  document.getElementById("bootmode").textContent  = label;

  scene  = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050505, 0.012);

  camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, .1, 400);
  camera.position.set(0, 13, 34);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = .05;
  controls.minDistance = 8;
  controls.maxDistance = 90;
  controls.maxPolarAngle = Math.PI * .82;
  controls.autoRotate = false;
  controls.target.set(0, 0, 0);

  scene.add(new THREE.AmbientLight(0x101418, 2.2));

  const key = new THREE.DirectionalLight(0xD4AF37, 2.4);
  key.position.set(10, 18, 12);
  scene.add(key);

  const rim = new THREE.PointLight(0x00eaff, 40, 90);
  rim.position.set(-18, 8, -14);
  scene.add(rim);

  /* ── episodic particle field: the GPU does the work ── */
  buildField();

  /* ── category clusters ── */
  CATEGORIES.forEach((cat, i) => buildCluster(cat, i));

  /* ── interaction ── */
  window.addEventListener("resize", onResize);
  renderer.domElement.addEventListener("pointerdown", e => pointerDown = { x:e.clientX, y:e.clientY });
  renderer.domElement.addEventListener("pointerup", e => {
    if(!pointerDown) return;
    const moved = Math.hypot(e.clientX-pointerDown.x, e.clientY-pointerDown.y);
    pointerDown = null;
    if(moved > 6) return;                      /* that was an orbit drag */
    pick(e.clientX, e.clientY);
  });

  document.getElementById("bOrbit").onclick = e => {
    autoOrbit = !autoOrbit;
    e.currentTarget.classList.toggle("act", autoOrbit);
  };
  document.getElementById("bNext").onclick  = () => select((selected + 1) % CATEGORIES.length, true);
  document.getElementById("bReset").onclick = () => {
    camera.position.set(0, 13, 34); controls.target.set(0,0,0);
  };
  document.getElementById("bHome").onclick = () => location.href = "/";

  buildLegend();
  renderer.setAnimationLoop(animate);
  setTimeout(() => document.getElementById("boot").classList.add("done"), 1500);
}

/* ══════════════════════════════════════════════════════════
   FIELD — 90k additive points, seeded so it is stable
   ══════════════════════════════════════════════════════════ */

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildField(){
  const COUNT = 90000;
  const rand  = mulberry32(1517);
  const pos   = new Float32Array(COUNT * 3);
  const col   = new Float32Array(COUNT * 3);
  const c     = new THREE.Color();

  for(let i = 0; i < COUNT; i++){
    /* thick torus — the episodic manifold */
    const a  = rand() * Math.PI * 2;
    const r  = FIELD_RADIUS + (rand() - .5) * 9;
    const y  = (rand() - .5) * 6 * (1 - Math.abs(rand() - .5));

    pos[i*3]   = Math.cos(a) * r;
    pos[i*3+1] = y;
    pos[i*3+2] = Math.sin(a) * r;

    /* colour by nearest category, dimmed by depth */
    const ci = Math.round(((a / (Math.PI*2)) * CATEGORIES.length)) % CATEGORIES.length;
    c.setHex(CATEGORIES[ci].color);
    const dim = .22 + rand() * .55;
    col[i*3] = c.r * dim; col[i*3+1] = c.g * dim; col[i*3+2] = c.b * dim;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color",    new THREE.BufferAttribute(col, 3));

  field = new THREE.Points(geo, new THREE.PointsMaterial({
    size: .11, vertexColors:true, transparent:true, opacity:.85,
    depthWrite:false, blending:THREE.AdditiveBlending
  }));
  scene.add(field);

  /* faint containment ring */
  halo = new THREE.Mesh(
    new THREE.TorusGeometry(FIELD_RADIUS, .045, 8, 220),
    new THREE.MeshBasicMaterial({ color:0xD4AF37, transparent:true, opacity:.18 })
  );
  halo.rotation.x = Math.PI / 2;
  scene.add(halo);
}

/* ══════════════════════════════════════════════════════════
   CLUSTERS
   ══════════════════════════════════════════════════════════ */

function buildCluster(cat, i){
  const a = (i / CATEGORIES.length) * Math.PI * 2;
  const x = Math.cos(a) * FIELD_RADIUS;
  const z = Math.sin(a) * FIELD_RADIUS;

  const g = new THREE.Group();
  g.position.set(x, 0, z);

  const colour = new THREE.Color(cat.color);

  const core = new THREE.Mesh(
    new THREE.IcosahedronGeometry(.72, 2),
    new THREE.MeshStandardMaterial({
      color:colour, emissive:colour, emissiveIntensity:1.5,
      metalness:.35, roughness:.2
    })
  );
  g.add(core);

  const shell = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.15, 1),
    new THREE.MeshBasicMaterial({ color:colour, wireframe:true, transparent:true, opacity:.28 })
  );
  g.add(shell);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.7, .022, 8, 64),
    new THREE.MeshBasicMaterial({ color:colour, transparent:true, opacity:.5 })
  );
  ring.rotation.x = Math.PI / 2;
  g.add(ring);

  const ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(2.15, .012, 8, 64),
    new THREE.MeshBasicMaterial({ color:colour, transparent:true, opacity:.22, wireframe:true })
  );
  ring2.rotation.set(Math.PI/2.6, .4, 0);
  g.add(ring2);

  scene.add(g);

  /* label sprite */
  const label = makeLabel(cat.name, cat.color);
  label.position.set(x, 3.1, z);
  scene.add(label);

  clusterGroups.push({ group:g, core, shell, ring, ring2, angle:a, colour });
  labels.push(label);
}

function makeLabel(text, hex){
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 128;
  const ctx = c.getContext("2d");
  const col = "#" + hex.toString(16).padStart(6,"0");

  ctx.fillStyle = "rgba(5,5,5,.82)";
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(6, 26, 1012, 76, 16); else ctx.rect(6, 26, 1012, 76);
  ctx.fill();

  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();

  ctx.shadowColor = col; ctx.shadowBlur = 16;
  ctx.fillStyle = "#f2f0e8";
  ctx.font = '700 40px "JetBrains Mono", monospace';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, 512, 66);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;

  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex, transparent:true, depthWrite:false, depthTest:false
  }));
  sp.scale.set(9.2, 1.15, 1);
  return sp;
}

/* ══════════════════════════════════════════════════════════
   SELECTION + PICKING
   ══════════════════════════════════════════════════════════ */

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();

function pick(clientX, clientY){
  ndc.x =  (clientX / innerWidth)  * 2 - 1;
  ndc.y = -(clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);

  const hits = ray.intersectObjects(clusterGroups.map(c => c.core), false);
  if(hits.length){
    const i = clusterGroups.findIndex(c => c.core === hits[0].object);
    select(i, false);
  }
}

function select(i, fly){
  selected = i;
  const cat = CATEGORIES[i];

  document.getElementById("dIdx").textContent   = String(i + 1).padStart(2, "0");
  document.getElementById("dName").textContent  = cat.name;
  document.getElementById("dSig").textContent   = cat.signal;
  const open = document.getElementById("dOpen");
  open.href = cat.surface;
  document.getElementById("dCount").textContent = (i + 1) + " / " + CATEGORIES.length;
  document.getElementById("roSel").textContent  = cat.name.slice(0, 22);
  document.getElementById("detail").classList.add("on");

  if(fly){
    const c = clusterGroups[i];
    const dir = new THREE.Vector3(c.group.position.x, 0, c.group.position.z).normalize();
    camera.position.copy(dir.multiplyScalar(11)).setY(6);
    controls.target.copy(c.group.position);
  }
}

function buildLegend(){
  const el = document.getElementById("legend");
  CATEGORIES.forEach((cat, i) => {
    const d = document.createElement("div");
    d.className = "lg";
    d.innerHTML = `<i style="background:#${cat.color.toString(16).padStart(6,"0")}"></i>${cat.name}`;
    d.style.cursor = "pointer";
    d.style.pointerEvents = "auto";
    d.onclick = () => select(i, true);
    el.appendChild(d);
  });
}

/* ══════════════════════════════════════════════════════════
   ANIMATE
   ══════════════════════════════════════════════════════════ */

let frames = 0, lastFps = performance.now();

function animate(t){
  const el = t * .001;

  if(field){
    field.rotation.y = el * .035;
    halo.rotation.z  = el * .05;
  }

  clusterGroups.forEach((c, i) => {
    const sel = i === selected;
    const target = sel ? 1.5 : 1;
    c.group.scale.lerp(new THREE.Vector3(target, target, target), .06);

    c.core.rotation.y  = el * .5 + i;
    c.core.rotation.x  = el * .3;
    c.shell.rotation.y = -el * .4;
    c.shell.rotation.z =  el * .22;
    c.ring.rotation.z  =  el * .35 + i;
    c.ring2.rotation.y =  el * .28;

    c.core.material.emissiveIntensity = (sel ? 2.6 : 1.5) + Math.sin(el * 2 + i) * .35;
    c.ring.material.opacity = sel ? .95 : .5;
  });

  if(autoOrbit){
    const r = Math.hypot(camera.position.x, camera.position.z);
    const a = Math.atan2(camera.position.z, camera.position.x) + .0016;
    camera.position.x = Math.cos(a) * r;
    camera.position.z = Math.sin(a) * r;
  }

  controls.update();
  renderer.render(scene, camera);

  /* fps */
  frames++;
  if(performance.now() - lastFps > 1000){
    document.getElementById("roFps").textContent =
      Math.round(frames * 1000 / (performance.now() - lastFps)) + " fps";
    frames = 0; lastFps = performance.now();
  }
}

function onResize(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
}

document.getElementById("roNodes").textContent = "90,000 nodes";

init().catch(err => {
  console.error(err);
  document.getElementById("boot").innerHTML =
    '<div class="bg">æ</div><div class="bl">RUNTIME ERROR</div>' +
    '<div class="bl" style="font-size:8px;max-width:280px;text-align:center">' +
    String(err.message || err) + '</div>';
});

console.info("%cæ:/aipodcast.me/discover%c WebGPU episodic field",
  "color:#D4AF37;background:#050505;padding:5px 10px;font-weight:bold",
  "color:#00ff9d;font-family:monospace");
</script>

</body>
