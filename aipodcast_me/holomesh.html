<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#050505"/>
<title>æ:/aipodcast.me/holomesh — 4D HOLOGRAPHIC MESH</title>
<meta name="description" content="4D tesseract hologram projection — inside point of view of the sovereign compute mesh">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  :root{--void:#050505;--gold:#D4AF37;--emerald:#00ff9d;--cyan:#00eaff;--ink:#e8e6df;--muted:#6f6a5c;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--ink);
    font-family:"JetBrains Mono",monospace;font-size:13px}
  #stage{position:fixed;inset:0;z-index:0}
  .scan{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.20;
    background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.5) 2px 4px)}
  .vig{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(circle at 50% 45%,transparent 30%,rgba(5,5,5,.6) 70%,rgba(5,5,5,.96) 100%)}
  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:max(12px,env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .bar{display:flex;justify-content:space-between;gap:10px;font-size:8.5px;letter-spacing:.16em;color:var(--muted);
    border:1px solid rgba(212,175,55,.22);border-top:2px solid var(--gold);
    padding:8px 11px;background:rgba(8,8,7,.82);pointer-events:auto}
  .live{color:var(--emerald);display:flex;align-items:center;gap:6px}
  .readout{text-align:right;font-size:7.5px;letter-spacing:.14em;color:var(--muted);
    border:1px solid rgba(212,175,55,.22);background:rgba(8,8,7,.78);padding:8px 10px;pointer-events:auto}
  .readout b{color:var(--gold);font-weight:700;font-size:9px}
  video{width:100%;height:100%;object-fit:contain;border:1px solid rgba(212,175,55,.3);
    box-shadow:0 0 50px rgba(212,175,55,.15)}
  .foot{display:flex;justify-content:space-between;font-size:7.5px;letter-spacing:.14em;color:var(--muted);
    border-top:1px solid rgba(212,175,55,.22);padding-top:10px;margin-top:20px}
  .foot a{color:var(--gold);text-decoration:none}
  #boot{position:fixed;inset:0;z-index:900;background:var(--void);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;
    transition:opacity .8s,visibility .8s}
  #boot.done{opacity:0;visibility:hidden}
  #boot .bg{font-size:48px;color:var(--gold);text-shadow:0 0 40px rgba(212,175,55,.5)}
  #boot .bl{font-size:9px;letter-spacing:.28em;color:var(--muted)}
  #boot .bline{width:170px;height:1px;background:rgba(212,175,55,.15);position:relative;overflow:hidden}
  #boot .bline i{position:absolute;inset:0;background:var(--gold);transform-origin:left;animation:load 1.8s ease forwards}
  @keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes blink{50%{opacity:.25}}
  .dot{width:5px;height:5px;background:var(--emerald);border-radius:50%;
    box-shadow:0 0 10px var(--emerald);animation:blink 2s infinite}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">
    <video id="v1" controls autoplay muted loop playsinline style="max-width:90vw;max-height:80vh">
      <source src="holomesh.mp4" type="video/mp4">
    </video>
  </div>
</div>
<div class="vig"></div>
<div class="scan"></div>

<div id="boot">
  <div class="bg">æ</div>
  <div class="bl">INITIALIZING HOLOFIELD</div>
  <div class="bline"><i></i></div>
  <div class="bl" style="font-size:8px">GPU://WEBGPU</div>
</div>

<div id="hud">
  <div class="row">
    <div class="bar">
      <span>æ:/aipodcast.me/holomesh</span>
      <span class="live"><span class="dot"></span>4D HOLOGRAPHIC MESH</span>
    </div>
    <div class="readout">
      <b>4D HOLOGRAPHIC MESH</b>
      <span>20s · 1920×1080</span>
      <span>H.264 · RTX 3050</span>
      <span>128 particles</span>
    </div>
  </div>
  <div class="foot">
    <span>CATEGORY//02 · 4D HOLOMESH · inside point of view</span>
    <span><a href="/videolab.html">← BACK TO CUDA_MCP²</a></span>
  </div>
</div>

<script>
  setTimeout(() => document.getElementById("boot").classList.add("done"), 1500);
  document.getElementById("v1").addEventListener("loadedmetadata", () => {
    document.getElementById("roNodes").textContent = "128 particles";
  });
</script>
</body>
</html>
