function draw(){
  ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2+ox,H/2+oy);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);
  E.forEach(e=>{const a=N[e.a],b=N[e.b];if(!visible(a)||!visible(b))return;const lit=(pinned!=null&&(e.a===pinned||e.b===pinned))||(hover!=null&&(e.a===hover||e.b===hover));const base=e.w>=3?0.20:e.w>=2?0.14:0.09;ctx.strokeStyle=lit?'rgba(212,175,55,.6)':`rgba(212,175,55,${base})`;ctx.lineWidth=(lit?1.6:e.w>=3?1.1:0.7)/zoom;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();});
  N.forEach((n,i)=>{if(!visible(n))return;const isH=i===hover||i===pinned||(pinned!=null&&nbr[pinned].has(i));const r=n.r*(isH?1.35:1);const cc=n.sov?'#D4AF37':n.fleet?'#00ff9d':n.col;
    if(isH||n.deg>=6||n.sov||n.fleet){const gr=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*4);gr.addColorStop(0,hexA(cc,isH?0.5:n.sov||n.fleet?0.35:0.22));gr.addColorStop(1,hexA(cc,0));ctx.fillStyle=gr;ctx.beginPath();ctx.arc(n.x,n.y,r*4,0,7);ctx.fill();}
    ctx.fillStyle=isH?cc:hexA(cc,0.72);ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();
    if(n.sov||n.fleet){ctx.strokeStyle=hexA(cc,.9);ctx.lineWidth=1.2/zoom;ctx.beginPath();ctx.arc(n.x,n.y,r+2/zoom,0,7);ctx.stroke();}
    if(n.deg>=8||isH||n.sov||n.fleet||n.type==='page'){ctx.fillStyle=isH?'rgba(240,236,228,.95)':'rgba(240,236,228,.6)';ctx.font=`${(isH?10.5:9.5)/zoom}px 'JetBrains Mono', monospace`;ctx.textAlign='center';ctx.fillText(n.id,n.x,n.y-r-5/zoom);}});
  ctx.restore();
}
function loop(){tick();draw();requestAnimationFrame(loop);}
function hit(px,py){const w=toWorld(px,py);let best=null,bd=1e9;N.forEach((n,i)=>{if(!visible(n))return;const d=Math.hypot(n.x-w.x,n.y-w.y);if(d<Math.max(9,n.r+5)&&d<bd){bd=d;best=i;}});return best;}
cv.addEventListener('mousemove',ev=>{if(drag){drag.dx=ev.clientX-drag.x;drag.dy=ev.clientY-drag.y;ox=drag.ox+drag.dx;oy=drag.oy+drag.dy;didDrag=true;return;}const i=hit(ev.clientX,ev.clientY);if(i!==hover){hover=i;if(i!=null)showDetail(N[i]);}cv.style.cursor=i!=null?'pointer':'grab';});
cv.addEventListener('mousedown',ev=>{drag={x:ev.clientX,y:ev.clientY,ox,oy};didDrag=false;cv.classList.add('drag');});
addEventListener('mouseup',ev=>{if(drag&&!didDrag){const i=hit(ev.clientX,ev.clientY);if(pinned===i){pinned=null;showDetail(null);}else if(i!=null){pinned=i;showDetail(N[i]);openNode(N[i]);}}drag=null;cv.classList.remove('drag');});
cv.addEventListener('wheel',ev=>{ev.preventDefault();const f=ev.deltaY<0?1.12:1/1.12;const w=toWorld(ev.clientX,ev.clientY);zoom=Math.max(0.25,Math.min(4,zoom*f));const w2=toWorld(ev.clientX,ev.clientY);ox+=(w2.x-w.x)*zoom;oy+=(w2.y-w.y)*zoom;},{passive:false});
const detail=document.getElementById('detail');
function showDetail(n){
  if(!n){detail.innerHTML='<div class="row">Hover a node to inspect. Click to pin. Edge weight: declared 3 · tag 2 · mention 1.</div>';return;}
  const i=idx[n.id],ns=[...nbr[i]].map(k=>N[k].id).sort();
  const lbl=(G.groups.find(g=>g.key===n.g)||{}).label||n.g;
  const typeLabel=n.type==='skill'?'SKILL':n.type==='page'?'PAGE':'STANDALONE';
  const typeBadge=n.type==='skill'?'':'<span class="badge p">'+typeLabel+'</span>';
  detail.innerHTML=`<div class="nm">${n.id}${n.sov?'<span class="badge">SOVEREIGN</span>':''}${n.fleet?'<span class="badge f">FLEET</span>':''}${typeBadge}</div><div class="row">group <b>${lbl}</b></div><div class="row">degree <b>${n.deg}</b> · ${n.ln} lines · type <b>${n.type}</b></div>${n.path?`<div class="row">path <b>${n.path}</b></div>`:''}${n.url?`<div class="row">url <b>${n.url}</b></div>`:''}${ns.length?`<div class="nb">neighbors (${ns.length}): ${ns.map(x=>`<span data-go="${x}">${x}</span>`).join('')}</div>`:`<div class="nb">no connections — standalone</div>`}`;
  detail.querySelectorAll('[data-go]').forEach(el=>{el.addEventListener('click',()=>{const k=idx[el.dataset.go];if(k==null)return;pinned=k;showDetail(N[k]);ox=-(N[k].x-W/2)*zoom;oy=-(N[k].y-H/2)*zoom;})});
  const act=document.getElementById('actions');act.innerHTML='';
  if(n.type==='page'&&n.url){const ab=document.createElement('button');ab.className='ab';ab.textContent='OPEN';ab.onclick=()=>window.open(n.url,'_blank');act.appendChild(ab);}
  if(n.type==='page'){const ab=document.createElement('button');ab.className='ab';ab.textContent='CONVERT → SKILL';ab.onclick=()=>convertPage(n);act.appendChild(ab);}
  if(n.type==='skill'&&n.path){const ab=document.createElement('button');ab.className='ab';ab.textContent='VIEW SKILL';ab.onclick=()=>window.open(n.path.replace(/\\/g,'/'),'_blank');act.appendChild(ab);}
}
function openNode(n){if(n.url)window.open(n.url,'_blank');else if(n.path)window.open(n.path.replace(/\\/g,'/'),'_blank');}
function convertPage(n){
  const name=n.id.replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  const skillName=name.replace(/-skill$/,'')+'-skill';
  const frontmatter=`---\nname: ${skillName}\ndescription: "Use when building ${name} surface."\nversion: 1.0.0\nauthor: Yael Méndez × Hermes Agent\nlicense: MIT\nmetadata:\n  hermes:\n    tags: [${n.tags.join(', ')}]\n    category: sovereign\n---\n\n# ${skillName}\n\nSurface converted from page.\n`;
  const blob=new Blob([frontmatter],{type:'text/markdown'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=skillName+'.md';a.click();URL.revokeObjectURL(url);
  toast('Converted: '+skillName+'.md');
  n.type='skill';n.sov=true;n.col='#D4AF37';n.sz=8;
  if(!G.groups.find(g=>g.key==='sovereign'))G.groups.push({key:'sovereign',label:'◈ SOVEREIGN SKILLS',col:'#D4AF37'});
  rebuild();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
const legend=document.getElementById('legend');const counts={};N.forEach(n=>counts[n.g]=(counts[n.g]||0)+1);
legend.innerHTML=G.groups.filter(g=>counts[g.key]).map(g=>`<div class="leg" data-g="${g.key}"><span class="sw" style="background:${g.col}"></span>${g.label}<span class="ct">${counts[g.key]}</span></div>`).join('');
legend.addEventListener('click',e=>{const el=e.target.closest('.leg');if(!el)return;const g=el.dataset.g;if(hidden.has(g)){hidden.delete(g);el.classList.remove('off');}else{hidden.add(g);el.classList.add('off');}updateVis();});
function updateVis(){document.getElementById('vis').textContent=N.filter(visible).length+'/'+N.length;}
updateVis();
function setFocus(m){focusMode=(focusMode===m)?null:m;document.querySelectorAll('.qb').forEach(b=>b.classList.toggle('on',b.id==='qb-'+focusMode));pinned=null;updateVis();}
document.getElementById('qb-sov').onclick=()=>setFocus('sov');
document.getElementById('qb-fleet').onclick=()=>setFocus('fleet');
document.getElementById('qb-hub').onclick=()=>setFocus('hub');
document.getElementById('qb-page').onclick=()=>setFocus('page');
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();if(!q){hover=null;pinned=null;return;}const m=N.find(n=>visible(n)&&n.id.toLowerCase().includes(q));if(m){pinned=idx[m.id];hover=idx[m.id];showDetail(m);ox=-(m.x-W/2)*zoom;oy=-(m.y-H/2)*zoom;}});
loop();
function rebuild(){for(let i=0;i<N.length;i++)idx[N[i].id]=i;for(let i=0;i<nbr.length;i++)nbr[i].clear();E.forEach(e=>{nbr[e.a].add(e.b);nbr[e.b].add(e.a);});document.getElementById('skc').textContent=N.filter(n=>n.type==='skill').length;document.getElementById('pgc').textContent=N.filter(n=>n.type==='page').length;const counts={};N.forEach(n=>counts[n.g]=(counts[n.g]||0)+1);legend.innerHTML=G.groups.filter(g=>counts[g.key]).map(g=>`<div class="leg" data-g="${g.key}"><span class="sw" style="background:${g.col}"></span>${g.label}<span class="ct">${counts[g.key]}</span></div>`).join('');}

</script>
