<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>æSYMOV blueprint · Menlo Research · Author Electronic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #dffaff; }
  #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; }
  .header h1 { font-size: 12px; color: #b4ff2e; letter-spacing: 0.1em; }
  .header .root { font-size: 8px; color: #ff00ff; }
  .viewport { flex: 1; position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; background: #02051c; overflow: hidden; }
  .viewport canvas { display: block; max-width: 100%; max-height: 100%; }
  .viewport .label { position: absolute; top: 8px; left: 8px; font-size: 8px; color: rgba(0,204,255,0.6); }
  .viewport .sign-count { position: absolute; top: 8px; right: 8px; font-size: 8px; color: #ff00ff; }
  .telemetry { display: flex; gap: 6px; padding: 6px 12px; flex-wrap: wrap; }
  .telemetry .chip { background: #061a30; border: 1px solid #1a5471; border-radius: 10px; padding: 4px 8px; font-size: 8px; color: #bcf8ff; }
  .telemetry .chip b { color: #b4ff2e; }
  .telemetry .chip .mag { color: #ff00ff; }
  .cmd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 12px; }
  .cmd-grid button { background: #061a30; color: #bcf8ff; border: 1px solid #2e7b98; padding: 10px 4px; border-radius: 8px; font-family: inherit; font-size: 9px; cursor: pointer; }
  .cmd-grid button:active { background: #b4ff2e; color: #0a0a0f; }
  .receipts { max-height: 70px; overflow-y: auto; background: #020918bb; border-top: 1px solid #1a5471; padding: 6px 12px; font-size: 8px; color: rgba(255,255,255,0.4); }
  .receipts .line b { color: #00eaff; }
  .receipts .line .ok { color: #b4ff2e; }
  .receipts .line .mag { color: #ff00ff; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>æSYMOV blueprint · Menlo Research</h1>
    <div class="root">æ://author_electronic</div>
  </div>
  <div class="viewport" id="viewport">
    <div class="label">MENLO ASIMOV-1 · 26 meshes · 25 joints</div>
    <div class="sign-count" id="sign-count">æ-signs: 0/26</div>
  </div>
  <div class="telemetry">
    <div class="chip">body: <b>ASIMOV-1</b></div>
    <div class="chip">dof: <b>25</b></div>
    <div class="chip">meshes: <b>26</b></div>
    <div class="chip">æ-signed: <b id="signed">0</b></div>
    <div class="chip">receipts: <b class="mag">0x00</b></div>
    <div class="chip">status: <b>ACTIVE</b></div>
  </div>
  <div class="cmd-grid">
    <button onclick="cmd('STAND')">STAND</button>
    <button onclick="cmd('WALK')">WALK</button>
    <button onclick="cmd('WAVE')">WAVE</button>
    <button onclick="cmd('SCAN')">SCAN</button>
    <button onclick="cmd('SIGN_ALL')">SIGN ALL</button>
    <button onclick="cmd('VERIFY')">VERIFY</button>
    <button onclick="cmd('SPEAK')">SPEAK</button>
    <button onclick="cmd('HOME')">HOME</button>
  </div>
  <div class="receipts" id="receipts">
    <div class="line">— blueprint mode · awaiting æ-signing —</div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02051c);
scene.fog = new THREE.FogExp2(0x02051c, 0.015);

const camera = new THREE.PerspectiveCamera(50, 9/16, 0.1, 500);
camera.position.set(0, 2.2, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(720, 1280);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
viewport.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(0, 1.8, 0);

scene.add(new THREE.AmbientLight(0x404060, 0.4));
const key = new THREE.DirectionalLight(0x00eaff, 1.0); key.position.set(10,15,10); scene.add(key);
const rim = new THREE.DirectionalLight(0x00eaff, 0.8); rim.position.set(0,8,-12); scene.add(rim);
const red = new THREE.PointLight(0xff2244, 1.5, 20); red.position.set(0, 8, 2); scene.add(red);

const grid = new THREE.GridHelper(30, 30, 0x1a3a5c, 0x0a1a2e);
grid.position.y = 0;
scene.add(grid);

const MESH_BASE = '../asimov-meshes/';
const URDF = {"links": {"pelvis_link": {"mesh": "pelvis_link.STL"}, "left_hip_pitch_link": {"mesh": "left_hip_pitch_link.STL"}, "left_hip_roll_link": {"mesh": "left_hip_roll_link.STL"}, "left_hip_yaw_link": {"mesh": "left_hip_yaw_link.STL"}, "left_knee_link": {"mesh": "left_knee_link.STL"}, "left_ankle_pitch_link": {"mesh": "left_ankle_pitch_link.STL"}, "left_ankle_roll_link": {"mesh": "left_ankle_roll_link.STL"}, "right_hip_pitch_link": {"mesh": "right_hip_pitch_link.STL"}, "right_hip_roll_link": {"mesh": "right_hip_roll_link.STL"}, "right_hip_yaw_link": {"mesh": "right_hip_yaw_link.STL"}, "right_knee_link": {"mesh": "right_knee_link.STL"}, "right_ankle_pitch_link": {"mesh": "right_ankle_pitch_link.STL"}, "right_ankle_roll_link": {"mesh": "right_ankle_roll_link.STL"}, "waist_yaw_link": {"mesh": "waist_yaw_link.STL"}, "neck_yaw_link": {"mesh": "neck_yaw_link.STL"}, "neck_pitch_link": {"mesh": "neck_pitch_link.STL"}, "right_shoulder_pitch_link": {"mesh": "right_shoulder_pitch_link.STL"}, "right_shoulder_roll_link": {"mesh": "right_shoulder_roll_link.STL"}, "right_shoulder_yaw_link": {"mesh": "right_shoulder_yaw_link.STL"}, "right_elbow_link": {"mesh": "right_elbow_link.STL"}, "right_wrist_yaw_link": {"mesh": "right_wrist_yaw_link.STL"}, "left_shoulder_pitch_link": {"mesh": "left_shoulder_pitch_link.STL"}, "left_shoulder_roll_link": {"mesh": "left_shoulder_roll_link.STL"}, "left_shoulder_yaw_link": {"mesh": "left_shoulder_yaw_link.STL"}, "left_elbow_link": {"mesh": "left_elbow_link.STL"}, "left_wrist_yaw_link": {"mesh": "left_wrist_yaw_link.STL"}}, "joints": [{"name": "left_hip_pitch_joint", "type": "revolute", "parent": "pelvis_link", "child": "left_hip_pitch_link", "xyz": [-0.0519919979, 0.06849986203, -0.044045], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, 1.0, 0.0]}, {"name": "left_hip_roll_joint", "type": "revolute", "parent": "left_hip_pitch_link", "child": "left_hip_roll_link", "xyz": [0.0422501, 0.04000027594, 0.0], "rpy": [0.0, 0.0, 0.0], "axis": [1.0, 0.0, 0.0]}, {"name": "left_hip_yaw_joint", "type": "revolute", "parent": "left_hip_roll_link", "child": "left_hip_yaw_link", "xyz": [-0.04225, 0.0, -0.052], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, 0.0, -1.0]}, {"name": "left_knee_joint", "type": "revolute", "parent": "left_hip_yaw_link", "child": "left_knee_link", "xyz": [0.0, 0.0, -0.19564], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, 1.0, 0.0]}, {"name": "left_ankle_pitch_joint", "type": "revolute", "parent": "left_knee_link", "child": "left_ankle_pitch_link", "xyz": [0.0, 0.0, -0.2946623361], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, 1.0, 0.0]}, {"name": "left_ankle_roll_joint", "type": "revolute", "parent": "left_ankle_pitch_link", "child": "left_ankle_roll_link", "xyz": [-0.0015, 0.0, -0.009999992], "rpy": [0.0, 0.0, 0.0], "axis": [-1.0, 0.0, 0.0]}, {"name": "right_hip_pitch_joint", "type": "revolute", "parent": "pelvis_link", "child": "right_hip_pitch_link", "xyz": [-0.0519919979, -0.06850013797, -0.044045], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, -1.0, 0.0]}, {"name": "right_hip_roll_joint", "type": "revolute", "parent": "right_hip_pitch_link", "child": "right_hip_roll_link", "xyz": [0.0422501, -0.04000027594, 0.0], "rpy": [0.0, 0.0, 0.0], "axis": [1.0, 0.0, 0.0]}, {"name": "right_hip_yaw_joint", "type": "revolute", "parent": "right_hip_roll_link", "child": "right_hip_yaw_link", "xyz": [-0.04225, 0.0, -0.052], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, 0.0, -1.0]}, {"name": "right_knee_joint", "type": "revolute", "parent": "right_hip_yaw_link", "child": "right_knee_link", "xyz": [0.0, 0.0, -0.19564], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, -1.0, 0.0]}, {"name": "right_ankle_pitch_joint", "type": "revolute", "parent": "right_knee_link", "child": "right_ankle_pitch_link", "xyz": [0.0, 0.0, -0.2946623361], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, -1.0, 0.0]}, {"name": "right_ankle_roll_joint", "type": "revolute", "parent": "right_ankle_pitch_link", "child": "right_ankle_roll_link", "xyz": [-0.0015, 0.0, -0.009999992], "rpy": [0.0, 0.0, 0.0], "axis": [-1.0, 0.0, 0.0]}, {"name": "waist_yaw_joint", "type": "revolute", "parent": "pelvis_link", "child": "waist_yaw_link", "xyz": [-0.0519919979, 0.0, 0.074755], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, 0.0, 1.0]}, {"name": "neck_yaw_joint", "type": "revolute", "parent": "waist_yaw_link", "child": "neck_yaw_link", "xyz": [-0.01659877455, 0.0, 0.37817729], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, 0.0, 1.0]}, {"name": "neck_pitch_joint", "type": "revolute", "parent": "neck_yaw_link", "child": "neck_pitch_link", "xyz": [0.0, 0.0, 0.03735], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, -1.0, 0.0]}, {"name": "right_shoulder_pitch_joint", "type": "revolute", "parent": "waist_yaw_link", "child": "right_shoulder_pitch_link", "xyz": [-0.02621282535, -0.0965, 0.2611404833], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, -1.0, 0.0]}, {"name": "right_shoulder_roll_joint", "type": "revolute", "parent": "right_shoulder_pitch_link", "child": "right_shoulder_roll_link", "xyz": [5e-05, -0.06535322324, 6.334135041e-05], "rpy": [0.0, 0.0, 0.0], "axis": [-1.0, 0.0, 0.0]}, {"name": "right_shoulder_yaw_joint", "type": "revolute", "parent": "right_shoulder_roll_link", "child": "right_shoulder_yaw_link", "xyz": [0.0, -0.0007840587182, -0.1289963672], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, -0.006078033456, -0.9999815286]}, {"name": "right_elbow_joint", "type": "revolute", "parent": "right_shoulder_yaw_link", "child": "right_elbow_link", "xyz": [0.0, 0.0004006795283, -0.09860555673], "rpy": [-0.06357995311, 1.483359028, -0.06939277108], "axis": [0.0, 0.9999815286, -0.006078033456]}, {"name": "right_wrist_yaw_joint", "type": "revolute", "parent": "right_elbow_link", "child": "right_wrist_yaw_link", "xyz": [0.106, -0.0009999815286, 0.0], "rpy": [0.0, 0.0, 0.0], "axis": [1.0, 0.0, 0.0]}, {"name": "left_shoulder_pitch_joint", "type": "revolute", "parent": "waist_yaw_link", "child": "left_shoulder_pitch_link", "xyz": [-0.02621282535, 0.0965, 0.2611404833], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, 1.0, 0.0]}, {"name": "left_shoulder_roll_joint", "type": "revolute", "parent": "left_shoulder_pitch_link", "child": "left_shoulder_roll_link", "xyz": [5e-05, 0.06535322324, 6.334135041e-05], "rpy": [0.0, 0.0, 0.0], "axis": [-1.0, 0.0, 0.0]}, {"name": "left_shoulder_yaw_joint", "type": "revolute", "parent": "left_shoulder_roll_link", "child": "left_shoulder_yaw_link", "xyz": [0.0, 0.0007840587182, -0.1289963672], "rpy": [0.0, 0.0, 0.0], "axis": [0.0, 0.006078009292, -0.9999815287]}, {"name": "left_elbow_joint", "type": "revolute", "parent": "left_shoulder_yaw_link", "child": "left_elbow_link", "xyz": [0.0, -0.0004006795283, -0.09860555673], "rpy": [0.06360378094, 1.483388955, 0.06941669025], "axis": [0.0, -0.9999815286, -0.006078033456]}, {"name": "left_wrist_yaw_joint", "type": "revolute", "parent": "left_elbow_link", "child": "left_wrist_yaw_link", "xyz": [0.106, 0.0009999815286, 0.0], "rpy": [0.0, 0.0, 0.0], "axis": [1.0, 0.0, 0.0]}]};

const linkGroups = {};
const root = new THREE.Group();
root.scale.setScalar(3);
scene.add(root);

for (const linkName of Object.keys(URDF.links)) {
  const g = new THREE.Group();
  g.name = linkName;
  linkGroups[linkName] = g;
}
for (const joint of URDF.joints) {
  const parent = linkGroups[joint.parent];
  const child = linkGroups[joint.child];
  if (!parent || !child) continue;
  child.position.set(joint.xyz[0], joint.xyz[1], joint.xyz[2]);
  child.rotation.set(joint.rpy[0], joint.rpy[1], joint.rpy[2]);
  parent.add(child);
}
root.add(linkGroups['pelvis_link']);

// æ-signs (floating glyphs at each mesh)
const signGroup = new THREE.Group();
scene.add(signGroup);
let signedCount = 0;

const loader = new STLLoader();
let loaded = 0;
const total = Object.keys(URDF.links).filter(k => URDF.links[k].mesh).length;

for (const [linkName, linkData] of Object.entries(URDF.links)) {
  if (!linkData.mesh) continue;
  const url = MESH_BASE + linkData.mesh;
  loader.load(url, (geometry) => {
    geometry.computeBoundingBox();
    const center = geometry.boundingBox.getCenter(new THREE.Vector3());
    geometry.translate(-center.x, -center.y, -center.z);

    // Wireframe
    const wireGeo = new THREE.WireframeGeometry(geometry);
    const wireMat = new THREE.LineBasicMaterial({ color: 0x00eaff, transparent: true, opacity: 0.25 });
    linkGroups[linkName].add(new THREE.LineSegments(wireGeo, wireMat));

    // Points
    const pos = geometry.attributes.position;
    const pts = [];
    for (let i = 0; i < pos.count; i += 2) {
      pts.push(new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i)));
    }
    const pGeo = new THREE.BufferGeometry().setFromPoints(pts);
    const pMat = new THREE.PointsMaterial({ color: 0x00eaff, size: 0.05, transparent: true, opacity: 0.8 });
    linkGroups[linkName].add(new THREE.Points(pGeo, pMat));

    // Fill
    const fillMat = new THREE.MeshBasicMaterial({ color: 0x02051c, transparent: true, opacity: 0.3 });
    linkGroups[linkName].add(new THREE.Mesh(geometry, fillMat));

    // æ-sign marker (small torus at mesh center)
    const sign = new THREE.Mesh(
      new THREE.TorusGeometry(0.15, 0.03, 6, 16),
      new THREE.MeshBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0 })
    );
    sign.position.set(center.x, center.y, center.z);
    linkGroups[linkName].add(sign);
    linkGroups[linkName].userData.sign = sign;

    loaded++;
    document.getElementById('sign-count').textContent = `æ-signs: ${loaded}/${total}`;
    if (loaded === total) {
      // Chest sigil
      const sigil = new THREE.Group();
      const ring1 = new THREE.Mesh(
        new THREE.TorusGeometry(0.7, 0.1, 8, 32),
        new THREE.MeshStandardMaterial({ color: 0xff2244, emissive: 0xff2244, emissiveIntensity: 2.0 })
      );
      sigil.add(ring1);
      const ring2 = new THREE.Mesh(
        new THREE.TorusGeometry(0.35, 0.08, 8, 24),
        new THREE.MeshStandardMaterial({ color: 0xff2244, emissive: 0xff2244, emissiveIntensity: 2.0 })
      );
      sigil.add(ring2);
      sigil.position.set(0, 8.2, 1.2);
      linkGroups['waist_yaw_link'].add(sigil);
      controls.target.set(0, 1.8, 0);
      camera.position.set(0, 2.2, 7);
      camera.lookAt(0, 1.8, 0);
      controls.update();
    }
  }, undefined, (err) => { loaded++; });
}

let rxCount = 0;
const receiptsEl = document.getElementById('receipts');
let anim = null;

window.cmd = function(action) {
  rxCount++;
  const time = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.className = 'line';
  line.innerHTML = `<b>${action}</b> · ${time} · <span class="ok">✓ receipt #${rxCount}</span>`;
  receiptsEl.appendChild(line);
  receiptsEl.scrollTop = receiptsEl.scrollHeight;
  if (anim) { clearInterval(anim); anim = null; }
  if (action === 'STAND') { root.position.set(0,0,0); root.rotation.set(0,0,0); }
  if (action === 'WALK') {
    let p = 0;
    anim = setInterval(() => { p += 0.1; root.position.y = Math.abs(Math.sin(p)) * 0.2; root.rotation.z = Math.sin(p) * 0.05; }, 50);
  }
  if (action === 'WAVE') { root.rotation.z = 0.3; setTimeout(() => root.rotation.z = 0, 1000); }
  if (action === 'SCAN') {
    let s = 0;
    anim = setInterval(() => { s += 0.1; root.rotation.y = s; }, 50);
    setTimeout(() => { clearInterval(anim); anim = null; }, 3000);
  }
  if (action === 'SIGN_ALL') {
    // Sign all meshes with æ
    let i = 0;
    for (const [name, g] of Object.entries(linkGroups)) {
      if (g.userData.sign) {
        g.userData.sign.material.opacity = 1;
        i++;
      }
    }
    signedCount = i;
    document.getElementById('signed').textContent = signedCount;
    document.getElementById('sign-count').textContent = `æ-signs: ${signedCount}/${total}`;
    line.innerHTML = `<b>SIGN ALL</b> · ${time} · <span class="mag">${signedCount} meshes æ-signed</span>`;
  }
  if (action === 'VERIFY') {
    const valid = signedCount === total;
    line.innerHTML = `<b>VERIFY</b> · ${time} · <span class="${valid ? 'ok' : 'mag'}">${valid ? '✓ chain valid' : '✗ ' + (total - signedCount) + ' unsigned'}</span>`;
  }
  if (action === 'HOME') { root.position.set(0,0,0); root.rotation.set(0,0,0); }
  if (action === 'SPEAK') {
    line.innerHTML = `<b>SPEAK</b> · ${time} · <span class="ok">"hello, human://root"</span>`;
  }
};

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (!anim) {
    root.position.y = Math.sin(t * 0.8) * 0.1;
    const s = 1 + Math.sin(t * 0.5) * 0.02;
    root.scale.setScalar(3 * s);
  }
  // Pulse æ-signs
  for (const [name, g] of Object.entries(linkGroups)) {
    if (g.userData.sign && g.userData.sign.material.opacity > 0) {
      g.userData.sign.rotation.y = t * 2;
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = 9/16;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
