name: hermes-asimov
version: 2.1.0
description: Hermes-Asimov robot actor and spokesrobot. Official Asimov-1 25-DOF URDF/MJCF assembled; tiny-voca speech wired to the menlo-sdk speaker path (play_pcm) with HUMAN://ROOT receipts. Local simulation works without a robot; SDK mode plays on a configured Asimov over hybrid/livekit.
author: "@yaelmendez"
provides_tools:
  - asimov_status
  - asimov_say
  - asimov_voice_video
  - asimov_studio_video
  - asimov_receipts
