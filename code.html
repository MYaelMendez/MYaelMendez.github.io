<!DOCTYPE html>
<html lang="en">
<head>
<link rel="webmcp" href="/webmcp-tools.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>æ://code-mode · terminal I/O</title>
<meta name="description" content="Code-mode terminal I/O — a live, ranked, composable way for agents to find the mesh's resources. æ.manifest() · æ.find() · æ.path() · æ.open() · pipes.">
<link rel="canonical" href="https://myaelmendez.github.io/code.html">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="manifest" href="./capability-manifest.json" type="application/json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#D4AF37;--gold-hi:#ffda83;--neon:#00ff9d;--cyan:#70dcff;--purple:#b98cff;--ink:#e8e6df;--muted:#6f6a5c;--frame:#0c0c0c;--line:rgba(212,175,55,.18)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--void);color:var(--ink);font-family:'JetBrains Mono',monospace}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(212,175,55,.025) 0 1px,transparent 1px 3px)}
.wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 0 12px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.bar .b1{color:var(--gold);font-weight:700;text-transform:none}
.bar .live{color:var(--neon);display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media(max-width:560px){.bar .mid{display:none}}
.out{flex:1;overflow-y:auto;padding:16px 0;font-size:12.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.out .g{color:var(--gold);font-weight:700}
.out .ok{color:var(--neon)}
.out .c{color:var(--cyan)}
.out .e{color:#ff6b6b}
.out .h{color:var(--gold-hi)}
.out .addr{color:var(--cyan)}
.out .nm{color:var(--gold);font-weight:700}
.out .cat{color:var(--muted)}
.out .ly{font-weight:700}
.out .sc{color:var(--purple);opacity:.8}
.out .k{color:var(--muted)}
.inrow{display:flex;border:1px solid var(--line);background:rgba(5,5,5,.7);margin-bottom:8px}
.inrow .p{color:var(--gold);padding:0 0 0 14px;display:flex;align-items:center;font-family:'Orbitron';font-weight:700;font-size:13px}
#cmd{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:14px;padding:14px 10px;letter-spacing:.5px}
#go{background:var(--gold);color:var(--void);border:none;font-family:'Orbitron';font-weight:700;font-size:11px;letter-spacing:1px;padding:0 22px;cursor:pointer;text-transform:uppercase}
#go:hover{background:var(--gold-hi)}
.hint{font-size:9px;color:var(--muted);letter-spacing:.5px;padding:0 0 16px;opacity:.75;text-align:center;line-height:1.8;white-space:normal;word-break:break-word}
.hint b{color:var(--gold)}
</style>
</head>
<body>
<div class="scan"></div>
<div class="wrap">
  <div class="bar">
    <span class="b1">æ://code-mode</span>
    <span class="mid">TERMINAL I/O · LIVE · RANKED · COMPOSABLE</span>
    <span class="live"><span class="dot"></span><span id="ct">loading mesh…</span></span>
  </div>
  <div class="out" id="out"></div>
  <div class="inrow"><span class="p">æ›</span><input id="cmd" placeholder="æ.find('cuda') · æ.path('vault') · æ.find('gpu') | open · help" autocomplete="off" spellcheck="false" autofocus><button id="go">RUN</button></div>
  <div class="hint"><b>æ.manifest()</b> · <b>æ.find()</b> · <b>æ.path()</b> · <b>æ.open()</b> · <b>æ.stats()</b> · <b>æ.chain()</b> · <b>find(q) | open</b> · <b>help</b></div>
</div>
<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)};
var AXC=['#D4AF37','#70dcff','#00ff9d','#b98cff'];
var AXN=['public','published','operator','custody'];
var CHAIN=['custody','format','gate','authority','contract','dispatch','publish','delivery','adoption'];
var MANIFEST={homebase:'https://myaelmendez.github.io',operator:'Yæl Méndez',count:0,capabilities:[]};
var CAPS=[], LIVE=false, TAGS={};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function out(h){var el=$('out');el.innerHTML+=h+'\n';el.scrollTop=el.scrollHeight}
function row(c,sc){return '<span class="addr">'+esc(c.address)+'</span>  <span class="nm">'+esc(c.name)+'</span>  <span class="cat">'+esc(c.category)+'</span>  <span class="ly" style="color:'+(AXC[c.layer]||'#888')+'">æ'+c.layer+' '+esc(c.layer_name||AXN[c.layer])+'</span>'+(sc!=null?'  <span class="sc">'+sc+'</span>':'')}
function subseq(q,s){var i=0;for(var j=0;j<s.length&&i<q.length;j++){if(s[j]===q[i])i++}return i===q.length}
function score(c,q){
  if(!q)return 1;
  var id=(c.id||'').toLowerCase(),nm=(c.name||'').toLowerCase(),cat=(c.category||'').toLowerCase(),url=(c.url||'').toLowerCase(),tags=(c.capabilities||[]).join(' ').toLowerCase();
  if(id===q||nm===q)return 100;
  if(id.split('-').indexOf(q)>=0)return 92;   // canonical id segment — beats a name-prefix tie
  if(nm.indexOf(q)===0||id.indexOf(q)===0)return 85;
  if(nm.indexOf(q)>=0||id.indexOf(q)>=0)return 65;
  if(cat.indexOf(q)>=0)return 45;
  if(tags.indexOf(q)>=0)return 35;
  if(url.indexOf(q)>=0)return 25;
  if(subseq(q,nm)||subseq(q,id))return 12;
  return 0;
}
function search(q){q=(q||'').toLowerCase().trim();
  return CAPS.map(function(c){return {c:c,s:score(c,q)}}).filter(function(x){return x.s>0})
    .sort(function(a,b){return b.s-a.s||a.c.layer-b.c.layer||String(a.c.id).localeCompare(String(b.c.id))});
}
function open(c){out('<span class="ok">  → '+esc(c.address)+'  '+esc(c.name)+'  ('+esc(c.url)+')</span>');setTimeout(function(){location.href=c.url},520)}
function parseCmd(s){s=String(s||'').trim().replace(/^æ\./,'').replace(/^ae\./,'');
  var m=s.match(/^([a-zA-Z]+)\s*\(?\s*(.*?)\s*\)?$/);
  return {name:(m?m[1]:s).toLowerCase(),arg:(m&&m[2])?m[2].replace(/^['"]|['"]$/g,'').trim():''};
}
function stats(){
  var by={0:0,1:0,2:0,3:0},cats={};CAPS.forEach(function(c){by[c.layer]=(by[c.layer]||0)+1;cats[c.category]=(cats[c.category]||0)+1});
  out('<span class="c">  '+CAPS.length+' capabilities · '+Object.keys(cats).length+' categories · '+Object.keys(TAGS).length+' tags · '+(LIVE?'LIVE':'cached')+'</span>');
  for(var a=0;a<4;a++)out('  <span class="ly" style="color:'+AXC[a]+'">æ'+a+' '+AXN[a]+'</span>  <span class="k">'+by[a]+' surface'+(by[a]===1?'':'s')+'</span>');
}
function record(c){
  out('  <span class="addr">'+esc(c.address)+'</span>  <span class="nm">'+esc(c.name)+'</span>');
  out('  <span class="k">id        </span>'+esc(c.id));
  out('  <span class="k">category  </span>'+esc(c.category));
  out('  <span class="k">layer     </span><span class="ly" style="color:'+(AXC[c.layer]||'#888')+'">æ'+c.layer+' '+esc(c.layer_name||AXN[c.layer])+'</span>');
  out('  <span class="k">access    </span>'+esc(c.access||'read'));
  out('  <span class="k">url       </span><span class="c">'+esc(c.url)+'</span>');
  out('  <span class="k">capabils  </span>'+esc((c.capabilities||[]).join(' · ')));
}
function run(raw){
  var c=(raw||'').trim();if(!c)return;
  out('<span class="g">æ› '+esc(c)+'</span>');
  if(c.indexOf('|')>=0){
    var parts=c.split('|').map(function(s){return s.trim()});
    var pc=parseCmd(parts[0]);
    var r=(pc.name==='find'||pc.name==='grep'||pc.name==='manifest'||pc.name==='ls')?search(pc.arg):search(parts[0]);
    if(!r.length){out('<span class="e">  no match for "'+esc(pc.arg||parts[0])+'"</span>');return}
    parts.slice(1).forEach(function(op){
      var o=op.toLowerCase();
      if(o==='open'||o==='goto')open(r[0].c);
      else if(o==='list'||o==='ls'||o==='manifest'){r.forEach(function(x){out(row(x.c,x.s))});out('<span class="c">  '+r.length+' → top '+esc(r[0].c.id)+'</span>')}
      else if(o==='path')out('<span class="c">  '+esc(r[0].c.url)+'</span>');
      else out('<span class="e">  unknown pipe "'+esc(op)+'"</span>');
    });
    return;
  }
  var pc=parseCmd(c), name=pc.name, arg=pc.arg;
  if(name==='help'){
    out('<span class="h">  æ.manifest(q)     every capability, ranked — address · name · category · layer</span>');
    out('<span class="h">  æ.find(q)         ranked discovery across id · name · category · tags · url</span>');
    out('<span class="h">  æ.path(x)         the fastest route — just the URL of the top hit</span>');
    out('<span class="h">  æ.open(x)         reach a surface (by id, name, or x:y:z:æ address)</span>');
    out('<span class="h">  æ.help(x)         the full record for one capability</span>');
    out('<span class="h">  æ.stats()         the mesh at a glance — layers, categories, tags</span>');
    out('<span class="h">  æ.chain()         the væult chain status</span>');
    out('<span class="h">  æ.capabilities()  list every capability tag</span>');
    out('<span class="h">  find(q) | open    compose: search, then act on the top hit</span>');
    out('<span class="h">  ---- codebase (agentic environment) ----</span>');
    out('<span class="h">  æ.tree()          the codebase — packages, runtime, counts</span>');
    out('<span class="h">  æ.module(id)      one module: kind · path · exports · address</span>');
    out('<span class="h">  æ.grep(q)         search modules by id · path · export · desc</span>');
    out('<span class="h">  clear             wipe the terminal</span>');
  }
  else if(name==='clear'){$('out').innerHTML=''}
  else if(name==='stats'||name==='status'){stats()}
  else if(name==='chain'||name==='scan'||name==='verify'){out('<span class="ok">  væult chain · '+CHAIN.length+'/'+CHAIN.length+' links answer</span>');out('<span class="c">  '+CHAIN.join(' → ')+'</span>');out('<span class="k">  a thing not checked back is not a thing</span>')}
  else if(name==='capabilities'||name==='caps'){var ks=Object.keys(TAGS).sort();out('<span class="c">  '+ks.length+' capability tags:</span>');out('  '+ks.join(' · '))}
  else if(name==='path'||name==='url'||name==='where'){var r=search(arg)[0];if(r)out('<span class="c">  '+esc(r.c.url)+'</span>');else out('<span class="e">  no capability "'+esc(arg)+'"</span>')}
  else if(name==='open'||name==='goto'){var r=search(arg)[0];if(r)open(r.c);else out('<span class="e">  no capability "'+esc(arg)+'"</span>')}
  else if(name==='manifest'||name==='ls'||name==='list'){var r=search(arg);r.forEach(function(x){out(row(x.c,arg?x.s:null))});out('<span class="c">  '+r.length+' / '+CAPS.length+' capabilities · '+(LIVE?'live manifest':'cached')+'</span>')}
  else if(name==='find'||name==='grep'||name==='search'){var r=search(arg);r.forEach(function(x){out(row(x.c,x.s))});out('<span class="c">  '+r.length+' match'+(r.length===1?'':'es')+' · ranked by relevance</span>')}
  else if(name==='tree'||name==='codebase'||name==='cwd'){
    if(!CODEBASE){out('<span class="e">  codebase not loaded</span>');return}
    out('<span class="c">  '+esc(CODEBASE.name)+'  ·  entry '+esc(CODEBASE.entry)+'</span>');
    out('<span class="k">  '+CODEBASE.counts.modules+' modules · '+CODEBASE.counts.surfaces+' surfaces · '+CODEBASE.counts.packages+' packages</span>');
    out('  <span class="k">packages:</span>  '+CODEBASE.modules.filter(function(m){return m.kind==='package'}).map(function(m){return m.id}).join(' · '));
    out('  <span class="k">runtime:</span>  terminal '+esc(CODEBASE.runtime.terminal)+'  ·  webllm '+esc(CODEBASE.runtime.webllm)+'  ·  webmcp '+esc(CODEBASE.runtime.webmcp));
  }
  else if(name==='module'||name==='cat'||name==='show'){
    if(!CODEBASE){out('<span class="e">  codebase not loaded</span>');return}
    var m=CODEBASE.modules.filter(function(x){return x.id===arg||x.id.indexOf(arg)===0})[0];
    if(!m){out('<span class="e">  no module "'+esc(arg)+'"</span>');return}
    out('  <span class="nm">'+esc(m.id)+'</span>  <span class="k">'+esc(m.kind)+'</span>  <span class="c">'+esc(m.path)+'</span>');
    out('  <span class="k">exports  </span>'+esc((m.exports||[]).join(' · ')));
    if(m.address)out('  <span class="k">address  </span><span class="addr">'+esc(m.address)+'</span>');
    out('  <span class="k">desc     </span>'+esc(m.desc||''));
  }
  else if(name==='grep'||name==='exports'||name==='files'){
    if(!CODEBASE){out('<span class="e">  codebase not loaded</span>');return}
    var q=(arg||'').toLowerCase();
    var r=CODEBASE.modules.filter(function(m){return !q||m.id.toLowerCase().indexOf(q)>=0||m.path.toLowerCase().indexOf(q)>=0||(m.exports||[]).join(' ').indexOf(q)>=0||String(m.desc).toLowerCase().indexOf(q)>=0});
    r.slice(0,24).forEach(function(m){out('  <span class="nm">'+esc(m.id)+'</span>  <span class="k">'+esc(m.kind)+'</span>  <span class="c">'+esc(m.path)+'</span>  <span class="k">'+esc((m.exports||[]).join(' '))+'</span>')});
    out('<span class="c">  '+r.length+' module'+(r.length===1?'':'es')+(r.length>24?' (first 24)':'')+'</span>');
  }
  else {var r=search(c)[0];if(r)open(r.c);else out('<span class="e">  unknown: '+esc(c)+' — type help</span>')}
}
function boot(){
  out('<span class="h">æ://code-mode · terminal I/O</span>');
  out('<span class="c">homebase   myaelmendez.github.io</span>');
  out('<span class="c">manifest   '+CAPS.length+' capabilities'+(LIVE?' · live':' · cached')+'</span>');
  out('<span class="c">axis       public → published → operator → custody</span>');
  out('<span class="c">one manifest makes every surface available to the right code.</span>');
  out('');
  out('<span class="g">æ› </span><span class="c">try æ.find(\'cuda\') · æ.path(\'vault\') · æ.stats() · help</span>');
}
function load(M){
  if(!M||!M.capabilities||!M.capabilities.length)return false;
  MANIFEST=M;CAPS=M.capabilities;LIVE=true;
  TAGS={};CAPS.forEach(function(c){(c.capabilities||[]).forEach(function(t){TAGS[t]=(TAGS[t]||0)+1})});
  $('ct').textContent=CAPS.length+' caps · live';
  return true;
}
$('go').addEventListener('click',function(){run($('cmd').value);$('cmd').value=''});
$('cmd').addEventListener('keydown',function(e){if(e.key==='Enter'){run($('cmd').value);$('cmd').value=''}});
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('cmd').focus()}});
var CODEBASE=null;
fetch('codebase.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(B){CODEBASE=B}).catch(function(){});
fetch('capability-manifest.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(M){
  if(load(M)){boot()}else{out('<span class="e">manifest empty — cached fallback in use</span>');boot()}
}).catch(function(){out('<span class="e">manifest unreachable — cached fallback in use</span>');boot()});
})();
</script>
<script src="webmcp.js"></script>
</body>
</html>
