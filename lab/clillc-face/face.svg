<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<style>
text{font:800 13px "JetBrains Mono",monospace;fill:#e8e2cf}
.n{fill:#D4AF37;animation:b 2.6s ease-in-out infinite}
.e{transform-box:fill-box;transform-origin:50% 70%;animation:k 4.2s infinite}
@keyframes k{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
</style>
<rect width="64" height="64" rx="12" fill="#050505"/>
<text x="4" y="38">c</text><text class="e" x="12" y="38">l</text><text x="20" y="38">i</text>
<text class="n" x="28" y="38">•</text>
<text x="36" y="38">l</text><text class="e" x="44" y="38">l</text><text x="52" y="38">c</text>
</svg>
