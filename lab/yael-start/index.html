<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yæl.com · Digital Twin</title>
<meta name="description" content="Make something agents want. — Yael Mendez · Many agents. One principal.">
<style>
:root{--paper:#f6efdf;--ink:#16130f;--y:#f2c318;--b:#2b86d1;--g:#34a853;--dur:5.5s}
.chalk{--paper:#1d1f1c;--ink:#f1ede2}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .6s,color .6s}
#start{position:relative;height:100svh;min-height:560px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:height .7s cubic-bezier(.7,0,.2,1),min-height .7s}
#art{height:min(78svh,140vw);width:auto;display:block;transition:all .7s cubic-bezier(.7,0,.2,1)}
#art path{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease forwards, sfade .8s 3.6s forwards;animation-delay:calc(var(--i)*0.0267s), 3.8s}
#art #fillp{fill:var(--ink);stroke:none;opacity:0;animation:ffade .9s 3.5s forwards}
@keyframes sfade{to{stroke-opacity:0}}@keyframes ffade{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.sq{opacity:0;transform:scale(.2);transform-origin:center;transform-box:fill-box;animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards}
.sq:nth-of-type(1){animation-delay:4.2s}.sq:nth-of-type(2){animation-delay:4.4s}.sq:nth-of-type(3){animation-delay:4.6s}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.cursor{fill:var(--ink);animation:blink 1s steps(1) infinite 4.8s;opacity:0}@keyframes blink{50%{opacity:1}}
.motto{position:absolute;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;padding:0 16px}
.motto h1{margin:0;font:600 clamp(1.3rem,5.2vw,2.2rem)/1.15 "Iowan Old Style","Palatino",Georgia,serif;min-height:1.2em}
.motto p{margin:.35em 0 0;font-size:.85rem;opacity:0;animation:fadein .8s 5.2s forwards}
@keyframes fadein{to{opacity:.8}}
.brand{position:absolute;left:16px;top:16px;font:800 1rem system-ui;letter-spacing:.02em;opacity:0}
.ctrl{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:10px;justify-content:center;opacity:0;animation:fadein2 .8s 5.4s forwards}
@keyframes fadein2{to{opacity:1}}
button{font:700 .95rem system-ui;padding:12px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
button.alt{background:transparent;color:var(--ink);padding:12px 14px}
/* collapsed */
.collapsed #start{height:68px;min-height:68px;position:sticky;top:0;z-index:5;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 12px;border-bottom:1.5px solid var(--ink);background:var(--paper)}
.collapsed #art{height:58px;width:58px;object-fit:cover}
.collapsed #art{}
.collapsed .motto{position:static;text-align:left;padding:0;flex:1;min-width:0}
.collapsed .motto h1{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collapsed .motto p{font-size:.72rem;margin:0}
.collapsed .ctrl{position:static;opacity:1;animation:none}
.collapsed .ctrl button{padding:8px 12px;font-size:.85rem}
.collapsed #enter{display:none}#open{display:none}.collapsed #open{display:inline-block}
.done #art path{animation:none;stroke-opacity:0}.done #art #fillp{animation:none;opacity:1}.done .sq{animation:none;opacity:1;transform:none}
.done .motto p,.done .ctrl{animation:none;opacity:1}.done .cursor{animation-delay:0s}
main{max-width:720px;margin:0 auto;padding:28px 18px 60px}
main h2{font:800 1.6rem/1.1 "Arial Narrow",Impact,system-ui;text-transform:uppercase;margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.tiles a{border:2px solid var(--ink);border-radius:14px;padding:14px;color:inherit;text-decoration:none;font-weight:700}
.tiles small{display:block;font-weight:400;opacity:.75;margin-top:4px}
.lab{font-size:.78rem;opacity:.7;margin-top:28px}
@media (prefers-reduced-motion:reduce){#art path{animation:none;stroke-opacity:0}#art #fillp{animation:none;opacity:1}.sq,.motto p,.ctrl{animation:none;opacity:1;transform:none}#start,#art{transition:none}}
</style></head>
