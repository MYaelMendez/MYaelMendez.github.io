<script>
(()=>{
"use strict";
const D = JSON.parse(document.getElementById("face-data").textContent);
const $ = id => document.getElementById(id);
const MOODS = ["hold","lost","tired","sleep","think","ready","work"];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ── 1 · Stage ── */
const stage=$("stage"), cv=$("bg"), cx=cv.getContext("2d");
function layout(){
  const W=innerWidth, H=innerHeight, wide = W > H;
  const r = wide ? 16/9 : 9/16;
  let w=W, h=W/r; if (h>H){ h=H; w=H*r; }
  stage.style.width=w+"px"; stage.style.height=h+"px";
  document.documentElement.style.setProperty("--u", (Math.min(w,h)/100)+"px");
  const dpr=Math.min(devicePixelRatio||1,3);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  drawBg(cv.width,cv.height,dpr);
}
function drawBg(w,h,dpr){
  cx.fillStyle="#000"; cx.fillRect(0,0,w,h);
  const g=Math.min(w,h)/20;
  cx.strokeStyle="rgba(0,243,255,.07)"; cx.lineWidth=1;
  cx.beginPath();
  for(let x=g;x<w;x+=g){cx.moveTo(x,0);cx.lineTo(x,h);}
  for(let y=g;y<h;y+=g){cx.moveTo(0,y);cx.lineTo(w,y);}
  cx.stroke();
  const m=6*dpr; cx.strokeStyle="#00f3ff"; cx.lineWidth=1.5*dpr;
  cx.strokeRect(m,m,w-2*m,h-2*m);
  const k=g*.8; cx.lineWidth=3*dpr; cx.beginPath();
  [[m,m,1,1],[w-m,m,-1,1],[m,h-m,1,-1],[w-m,h-m,-1,-1]].forEach(([x,y,sx,sy])=>{cx.moveTo(x,y+sy*k);cx.lineTo(x,y);cx.lineTo(x+sx*k,y);});
  cx.stroke();
}
addEventListener("resize",layout); layout();

/* ── 5 · Witness ── */
const chain=[]; let prev="GENESIS";
async function sha(s){
  if(!(crypto&&crypto.subtle)) return "no-webcrypto";
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function witness(ev){
  const e=JSON.stringify({t:new Date().toISOString(),...ev});
  const h=await sha(prev+"|"+e);
  chain.push({prev,e,h}); prev=h;
  $("hash-tag").textContent="witness #"+chain.length+" · "+h.slice(0,16)+"… · æ1 DEMO";
  if(cur===2) renderWit();
  return h;
}

/* ── 4 · Face engine ── */
const FIL={
  hold:["M96 128 H144","#ffb000"],
  lost:["M98 128 q11 -16 22 0 t22 0 M112 140 h16","#a78bfa"],
  tired:["M96 126 Q120 142 144 126","#8899aa"],
  sleep:["M100 130 H112 M128 130 H140","#3a6fe0"],
  think:["M96 128 C106 108 116 148 126 128 S140 112 146 128","#00f3ff"],
  ready:["M98 128 L113 140 L144 114","#39ff88"],
  work:["M94 128 L102 116 L110 140 L118 116 L126 140 L134 116 L142 140 L148 128","#ff6a3d"]
};
const POSTURE={hold:[0,0],lost:[14,-6],tired:[0,10],sleep:[0,16],think:[-6,-4],ready:[0,-3],work:[0,4]};
const TAU={motor:.18,mood:.9};
const tgt={mood:"think",yaw:0,pitch:0,glow:1}, st={yaw:0,pitch:0,glow:1};
let finger=null, fingerT=0, drift=null, raf=0, last=0;
const ease=(x,t,dt,tau)=>x+(t-x)*(1-Math.exp(-dt/tau));
function paintMood(){
  const [d,c]=FIL[tgt.mood];
  $("fil").setAttribute("d",d); $("fil").setAttribute("stroke",c); $("h0").setAttribute("stop-color",c);
  $("mood-tag").textContent="🤖 "+tgt.mood+" · "+D.moods[tgt.mood];
}
async function face(m,why="human",react=false){
  if(!FIL[m]) return false;
  const from=tgt.mood; tgt.mood=m; paintMood();
  clearTimeout(drift);
  if(react && m!=="think") drift=setTimeout(()=>face("think","drift"),3500);
  if(from!==m) await witness({op:"mood",from,to:m,why});
  return true;
}
function frame(t){
  const dt=Math.min(.05,(t-(last||t))/1000)||.016; last=t;
  const p=POSTURE[tgt.mood];
  const here=finger&&performance.now()-fingerT<3000&&!reduce&&tgt.mood!=="sleep";
  let ty=here?finger[0]:p[0], tp=here?finger[1]:p[1];
  if(!reduce&&!here){ty+=Math.sin(t/1400)*2;tp+=Math.sin(t/1100+1)*1.2;}
  if(kick&&t<kick.u){ty+=kick.y;tp+=kick.p;}
  if(mbProg&&!here){const e=MB.vm(mbProg,{t:t/1000,y:ty,p:tp});if(isFinite(e.y))ty=Math.max(-40,Math.min(40,e.y));if(isFinite(e.p))tp=Math.max(-30,Math.min(30,e.p));}
  aw=ease(aw,score(),dt,TAU.mood);
  $("hud").textContent=`${ratio()} · ${innerWidth}×${innerHeight} @${Math.min(3,devicePixelRatio||1)}x · ${orient}\nzoom ${(vv?vv.scale:1).toFixed(2)} · finger ${here?"✓":"—"} · aw ${Math.round(aw*100)}%\nyaw ${st.yaw.toFixed(0)}° · pitch ${st.pitch.toFixed(0)}°`;
  const tg=tgt.mood==="sleep"?.25:tgt.mood==="work"?(.75+.25*Math.abs(Math.sin(t/90))):1;
  st.yaw=ease(st.yaw,ty,dt,TAU.motor); st.pitch=ease(st.pitch,tp,dt,TAU.motor); st.glow=ease(st.glow,tg,dt,TAU.mood);
  $("head").setAttribute("transform",`rotate(${(st.yaw*.12).toFixed(2)} 120 140) translate(0 ${(st.pitch*.25).toFixed(2)})`);
  $("iris").setAttribute("cx",(120+st.yaw*.06).toFixed(2)); $("iris").setAttribute("cy",(42+st.pitch*.05).toFixed(2));
  $("pupil").setAttribute("cx",(120+st.yaw*.09).toFixed(2)); $("pupil").setAttribute("cy",(42+st.pitch*.07).toFixed(2));
  $("fil").setAttribute("opacity",st.glow.toFixed(2));
  raf=requestAnimationFrame(frame);
}
function loop(on){ if(on&&!raf){last=0;raf=requestAnimationFrame(frame);} if(!on&&raf){cancelAnimationFrame(raf);raf=0;} }

/* ── 4b · Viewport awareness (from the æsymov Viewport Face page) ── */
const vv=window.visualViewport, DK=matchMedia("(prefers-color-scheme: dark)");
let orient=innerWidth>innerHeight?"landscape":"portrait", zoomed=false, kb=false, rz=0, kick=null, aw=0, idleLv=0, t0=performance.now(), back=0;
const ratio=()=>innerWidth>innerHeight?"16:9":"9:16";
function sense(m,why,line){ if(line) $("cap").textContent=line; face(m,"viewport: "+why); }
function score(){const r=[innerWidth>0,!!devicePixelRatio,!!vv,performance.now()-fingerT<3000,!document.hidden,document.hasFocus(),navigator.onLine,true,true];return r.filter(Boolean).length/r.length;}
function aware(){return{size:{w:innerWidth,h:innerHeight},dpr:devicePixelRatio||1,orientation:orient,ratio:ratio(),
  visualViewport:vv?{scale:+vv.scale.toFixed(2),height:Math.round(vv.height),keyboard:kb}:null,
  pointer:{present:performance.now()-fingerT<3000,idleMs:Math.round(performance.now()-(fingerT||t0))},
  hidden:document.hidden,focus:document.hasFocus(),reducedMotion:reduce,colorScheme:DK.matches?"dark":"light",online:navigator.onLine,
  mood:tgt.mood,awareness:Math.round(aw*100)};}
addEventListener("resize",()=>{const o=innerWidth>innerHeight?"landscape":"portrait";
  if(o!==orient){orient=o;kick={y:o==="landscape"?14:0,p:o==="portrait"?-8:0,u:performance.now()+700};sense("think","orientation","giraste el mundo · you turned the world");clearTimeout(back);back=setTimeout(()=>sense("ready","orientation settled","listo · ready"),1400);return;}
  if(zoomed||kb)return; if(!kick||performance.now()>kick.u+700){ if(tgt.mood!=="work") sense("work","resize","me estiran · resizing"); clearTimeout(rz); rz=setTimeout(()=>sense("ready","resize end","listo · ready"),250);} });
if(vv) vv.addEventListener("resize",()=>{const z=vv.scale>1.05;
  if(z!==zoomed){zoomed=z;z?sense("hold","pinch zoom","me acercas · close-up"):sense("think","zoom reset","vuelvo a escala · back to scale");return;}
  const k=!z&&vv.height<.75*innerHeight; if(k!==kb){kb=k;k?sense("think","keyboard","te escucho · listening"):sense("ready","keyboard closed","listo · ready");}});
document.addEventListener("visibilitychange",()=>{ if(document.hidden){clearTimeout(back);sense("sleep","hidden","a oscuras · lights out");}
  else {fingerT=0;t0=performance.now();idleLv=0;sense("lost","visible","¿quién está? · who's there?");clearTimeout(back);back=setTimeout(()=>sense("think","returned","pensando · thinking"),1500);} });
addEventListener("offline",()=>sense("lost","offline","sin red · offline"));
addEventListener("online",()=>sense("ready","online","red de vuelta · back online"));
setInterval(()=>{ if(document.hidden||!navigator.onLine||zoomed||kb||cur!==3) return; const i=performance.now()-(fingerT||t0);
  if(i>30000&&idleLv<2){idleLv=2;sense("sleep","absent 30s","me duermo · going to sleep");}
  else if(i>8000&&idleLv<1){idleLv=1;sense("tired","absent 8s","¿sigues ahí? · still there?");} },500);

/* ── 🧮 MathByte v0.1 (lab/mathbyte/v0): text → bytes → VM ── */
const MB=(()=>{
/* ── ISA ── */
const OP={"+":1,"-":2,"*":3,"/":4,"^":5,sin:6,cos:7,tan:8,log:9,exp:10,PI:0x2A,E:0x2B,gpu_mul:0x30,gpu_add:0x31,
  if:0x40,else:0x41,for:0x42,while:0x43,"(":0x50,")":0x51,"{":0x52,"}":0x53,";":0x54,NUM:0x60};
const BYTE=Object.fromEntries(Object.entries(OP).map(([k,v])=>[v,k]));
for(let i=0;i<26;i++){const c=String.fromCharCode(97+i);OP[c]=0x10+i;BYTE[0x10+i]=c;}
const FN1=new Set(["sin","cos","tan","log","exp"]), FN2=new Set(["gpu_mul","gpu_add"]);
const PREC={"+":1,"-":1,"*":2,"/":2,"^":3};
const hx=b=>"0x"+b.toString(16).padStart(2,"0").toUpperCase();
/* ── text → bytes ── */
function tokens(s){
  s=s.replace(/\/\/.*$/gm,"");const re=/\s*(\d+\.?\d*|\.\d+|[A-Za-z_]+|[-+*/^(),=;])/y;const out=[];let m;
  while(re.lastIndex<s.length){const i=re.lastIndex;m=re.exec(s);if(!m){if(/^\s*$/.test(s.slice(i)))break;throw Error("símbolo raro cerca de: "+s.slice(i,i+8));}out.push(m[1]);}
  return out;
}
function compile(src){
  const t=tokens(src),bytes=[];let i=0;
  const f32=n=>{const b=new Uint8Array(new Float32Array([n]).buffer);bytes.push(OP.NUM,...b);};
  while(i<t.length){
    const tgt=t[i];if(!/^[a-z]$/.test(tgt)||t[i+1]!=="=")throw Error("esperaba  letra = expresión;  en «"+t.slice(i,i+3).join(" ")+"»");
    bytes.push(OP[tgt]);i+=2;
    const ops=[];let prevVal=false;
    const pop=()=>{const o=ops.pop();bytes.push(OP[o]);};
    for(;i<t.length&&t[i]!==";";i++){
      const k=t[i];
      if(/^[\d.]/.test(k)){f32(parseFloat(k));prevVal=true;}
      else if(k==="PI"||k==="E"){bytes.push(OP[k]);prevVal=true;}
      else if(/^[a-z]$/.test(k)){bytes.push(OP[k]);prevVal=true;}
      else if(FN1.has(k)||FN2.has(k)){ops.push(k);prevVal=false;}
      else if(k==="("){ops.push("(");prevVal=false;}
      else if(k===","){while(ops.length&&ops.at(-1)!=="(")pop();prevVal=false;}
      else if(k===")"){while(ops.length&&ops.at(-1)!=="(")pop();if(!ops.length)throw Error("falta (");ops.pop();if(ops.length&&(FN1.has(ops.at(-1))||FN2.has(ops.at(-1))))pop();prevVal=true;}
      else if(k in PREC){
        if(k==="-"&&!prevVal){f32(-1);ops.push("*");continue;}
        while(ops.length&&ops.at(-1) in PREC&&(PREC[ops.at(-1)]>PREC[k]||(PREC[ops.at(-1)]===PREC[k]&&k!=="^")))pop();
        ops.push(k);prevVal=false;
      } else throw Error("no conozco «"+k+"»");
    }
    while(ops.length){if(ops.at(-1)==="(")throw Error("falta )");pop();}
    bytes.push(OP[";"]);i++;
  }
  return new Uint8Array(bytes);
}
/* ── bytes → statements of RPN ── */
function decode(b){
  const st=[];let cur=null;
  for(let i=0;i<b.length;i++){
    const x=b[i];
    if(!cur){if(x<0x10||x>0x29)throw Error("byte "+hx(x)+": se esperaba variable");cur={tgt:BYTE[x],rpn:[]};continue;}
    if(x===OP[";"]){st.push(cur);cur=null;continue;}
    if(x===OP.NUM){cur.rpn.push(new Float32Array(b.slice(i+1,i+5).buffer)[0]);i+=4;continue;}
    if(!(x in BYTE))throw Error("byte desconocido "+hx(x));
    cur.rpn.push(BYTE[x]);
  }
