<style>
:root{--c:#00f3ff;--li:#0a66c2;--ink:#e9f6f7;--dim:#7d9a9e;--ok:#3ddc84;--warn:#ffc53d;--stop:#ff5d5d;--bg:#000}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050607;color:var(--ink);font:16px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{display:grid;place-items:center;min-height:100dvh}
#st{position:relative;width:min(100vw,calc(100dvh*9/16));height:min(100dvh,calc(100vw*16/9));background:var(--bg);overflow:hidden;
 border:1px solid #0e3b3f;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom))}
#st::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
 background:linear-gradient(var(--c) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--c) 1px,transparent 1px) 0 0/28px 28px}
header{display:flex;justify-content:space-between;align-items:flex-start;z-index:1}
.brand{font-weight:700;font-size:16px}.brand small{display:block;font-weight:400;font-size:11px;color:var(--dim);letter-spacing:.08em}
.lang{background:none;border:1px solid #1d4a4e;color:var(--dim);border-radius:22px;min-width:44px;min-height:44px;font:inherit;font-size:12px}
main{flex:1;display:flex;flex-direction:column;z-index:1;min-height:0}
section{display:none;flex:1;flex-direction:column;min-height:0;animation:in .35s ease}
section.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.face{width:min(62%,260px);margin:4% auto 0;cursor:pointer;display:block;border:0;background:none}
.face svg{width:100%;height:auto;display:block}
.visor{transition:stroke .4s}
.pulse .visor{animation:pv 2.2s ease-in-out infinite}
@keyframes pv{50%{stroke:var(--li);filter:drop-shadow(0 0 10px var(--li))}}
h1{font:700 clamp(20px,6.2vw,30px)/1.2 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center;margin:5% 0 2%}
h2{font:700 20px/1.25 system-ui,-apple-system,sans-serif;margin:6px 0 10px}
.sub{color:var(--dim);text-align:center;font-size:13px}
.pcm{width:1.1em;height:1.1em;vertical-align:-.2em;color:var(--c)}
.big .pcm{width:72px;height:72px}
.kick{color:var(--c);text-align:center;font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
.promise{list-style:none;margin:auto 0 8px;font-size:12px;color:var(--dim);display:grid;gap:6px}
.promise li::before{content:"🧿 "}
.btn{min-height:52px;border-radius:14px;border:1px solid var(--c);background:transparent;color:var(--ink);font:600 16px system-ui,sans-serif;padding:0 18px;cursor:pointer;width:100%}
.btn.li{background:var(--li);border-color:var(--li);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.li b{background:#fff;color:var(--li);border-radius:4px;padding:0 6px;font:800 15px/22px system-ui}
.btn.ghost{border-color:#1d4a4e;color:var(--dim)}
.btn:disabled{opacity:.35}
.row{display:flex;gap:10px;margin-top:10px}
textarea{flex:1;min-height:0;width:100%;resize:none;background:#06191b;border:1px solid #1d4a4e;border-radius:14px;color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:14px;outline:none}
textarea:focus{border-color:var(--c)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin:8px 0 2px;gap:8px}
.tog{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--c)}
.card{background:#fff;color:#191919;border-radius:12px;padding:14px;font:15px/1.45 system-ui,-apple-system,sans-serif;overflow:auto;max-height:46%;flex-shrink:1}
.card .who{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.card .av{width:40px;height:40px;border-radius:50%;background:var(--li);color:#fff;display:grid;place-items:center;font-weight:700}
.card .nm{font-weight:600}.card .tm{font-size:12px;color:#666}
.card pre{white-space:pre-wrap;word-wrap:break-word;font:inherit}
.card img{width:100%;border-radius:8px;margin-top:10px;display:block;background:#000}
.kl{width:100%;min-height:44px;margin-top:10px;background:#06191b;border:1px solid #1d4a4e;border-radius:12px;color:var(--ink);font:16px system-ui,sans-serif;padding:0 12px}
.kl:focus{border-color:var(--c);outline:none}
.card .foot{color:#666;font-size:13px;margin-top:10px;border-top:1px solid #eee;padding-top:8px;white-space:pre-wrap}
.checks{list-style:none;margin:12px 0;font-size:13px;display:grid;gap:6px;overflow:auto}
.checks li{display:flex;gap:8px}.checks .ok{color:var(--ok)}.checks .warn{color:var(--warn)}.checks .stop{color:var(--stop)}
.hold{position:relative;height:64px;border-radius:32px;border:1px solid var(--c);background:transparent;color:var(--ink);font:700 17px system-ui,sans-serif;overflow:hidden;width:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.hold i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#00f3ff33,#00f3ff88)}
.hold span{position:relative}
.rc{border:1px solid #1d4a4e;border-radius:14px;padding:14px;font-size:13px;display:grid;gap:6px;margin:12px 0;word-break:break-all}
.rc b{color:var(--c)}
.big{font-size:44px;text-align:center;margin-top:6%}
.tag{font-size:11px;color:var(--dim);text-align:center;margin-top:8px}
a{color:var(--c)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

 <!-- 0 · door -->
 <section id="s0" class="on">
  <button class="face pulse" id="face" aria-label="Sign in with LinkedIn">
   <svg viewBox="0 0 240 270" aria-hidden="true">
    <path d="M52 78 Q52 18 120 18 Q188 18 188 78 V176 Q188 246 120 250 Q52 246 52 176 Z" fill="#141416" stroke="#3a3a3e" stroke-width="2"/>

    <g id="inMark"><rect x="104" y="104" width="32" height="32" rx="6" fill="#0a66c2"/><text x="120" y="129" text-anchor="middle" font-family="system-ui" font-weight="800" font-size="21" fill="#fff">in</text></g>

  <h1 data-en="Posted. You approved it." data-es="Publicado. Tú lo aprobaste."></h1>

 </section>

<script>
"use strict";
const $=id=>document.getElementById(id);
const LIVE=["privateclient.ai","www.privateclient.ai","auth.llm.store"].includes(location.hostname);
let L=(navigator.language||"en").startsWith("es")?"es":"en",ME=null,LAST=null,DEMO_N=0,DEMO_P=null,RID=null,CARD=null;
const tr=(en,es)=>L==="es"?es:en;
function paint(){document.documentElement.lang=L;$("lang").textContent=L==="es"?"EN":"ES";
 document.querySelectorAll("[data-en]").forEach(e=>e.textContent=e.dataset[L]);
 $("kl").placeholder=tr("Line for your card","Frase para tu tarjeta");
 $("tx").placeholder=tr("What do you want to say? Write it, or paste what your AI drafted.","¿Qué quieres decir? Escríbelo o pega lo que tu IA redactó.");
 if(ME)$("hello").textContent=tr(`Hi ${ME.name.split(" ")[0]}. What's the message?`,`Hola ${ME.name.split(" ")[0]}. ¿Cuál es el mensaje?`);
 $("tag0").textContent=LIVE?"privateclient.ai · 🧿 guarded":tr("LAB DEMO · no LinkedIn calls","LAB DEMO · sin llamadas a LinkedIn");}
$("lang").onclick=()=>{L=L==="es"?"en":"es";paint();if($("s2").classList.contains("on"))review();};
function show(n){document.querySelectorAll("section").forEach((s,i)=>s.classList.toggle("on",i===n));}

/* ── checks: same rules as checks.py (the server's word is final when live) ── */
const SEC=[["API key",/\bsk-[A-Za-z0-9_-]{20,}/],["GitHub token",/\bgh[pousr]_[A-Za-z0-9]{30,}/],["AWS key",/\bAKIA[0-9A-Z]{16}\b/],["Slack token",/\bxox[abprs]-[A-Za-z0-9-]{10,}/],["Private key",/-----BEGIN [A-Z ]*PRIVATE KEY-----/],["Google key",/\bAIza[0-9A-Za-z_-]{35}\b/]];
const luhn=d=>{let s=0,a=false;for(const c of [...d].reverse()){let n=+c;if(a){n*=2;if(n>9)n-=9}s+=n;a=!a}return s%10===0};
function localCheck(t){const o=[],add=(level,code,en,es)=>o.push({level,code,en,es}),n=t.trim().length,w=t.split(/\s+/).filter(Boolean).length,m=Math.max(1,Math.round(w/200));
 if(!n)add("stop","empty","Nothing to post yet.","Aún no hay nada que publicar.");
 else if(n>2800)add("stop","long",`${n} characters; keep it under 2800.`,`${n} caracteres; menos de 2800.`);
 else add("ok","length",`${n} characters · about ${m} min read`,`${n} caracteres · ~${m} min de lectura`);
 for(const [nm,rx] of SEC)if(rx.test(t))add("stop","secret",`Looks like a secret (${nm}). Remove it before posting.`,`Parece una credencial (${nm}). Quítala antes de publicar.`);
 let card=false;for(const x of t.matchAll(/(?<!\d)(?:\d[ -]?){13,19}(?!\d)/g)){const d=x[0].replace(/\D/g,"");if(d.length>=13&&d.length<=19&&luhn(d)){card=true;add("stop","card","Looks like a card number. Remove it.","Parece un número de tarjeta. Quítalo.");break}}
 if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(t))add("warn","email","Contains an email address: public on purpose?","Incluye un email: ¿público a propósito?");
 if(!card&&/(?<!\d)(?:\+?\d[\s().-]?){10,13}(?!\d)/.test(t))add("warn","phone","Contains a phone number: public on purpose?","Incluye un teléfono: ¿público a propósito?");
 const lk=t.match(/https?:\/\/\S+/g)||[];if(lk.length>2)add("warn","links",`${lk.length} links; LinkedIn tends to show fewer.`,`${lk.length} enlaces; LinkedIn suele mostrar menos.`);else if(lk.length)add("ok","links",`${lk.length} link`,`${lk.length} enlace`);
 const tg=t.match(/(?<!\w)#\w+/g)||[];if(tg.length>5)add("warn","tags",`${tg.length} hashtags; 3 to 5 reads cleaner.`,`${tg.length} hashtags; 3 a 5 se lee mejor.`);
 const al=[...t].filter(c=>/\p{L}/u.test(c)).length,up=[...t].filter(c=>c!==c.toLowerCase()).length;if(n>20&&up>.6*al)add("warn","caps","Mostly capitals reads as shouting.","Casi todo en mayúsculas se lee como gritar.");
 return{ok:!o.some(c=>c.level==="stop"),checks:o};}

/* ── API: live server, or a mock in the LAB ── */
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const API=LIVE?{
 me:()=>fetch("/me",{credentials:"same-origin"}).then(r=>r.json()),
 prepare:b=>fetch("/prepare",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>({status:r.status,...await r.json()})),
 check:t=>fetch("/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})}).then(r=>r.json()),
 sign:b=>fetch("/sign",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>({status:r.status,...await r.json()})),
 out:()=>fetch("/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})
}:{
 me:async()=>sessionStorage.pc_demo?{signed_in:true,name:"Ana Demo",can_post:true}:{signed_in:false},
 check:async t=>localCheck(t),
 prepare:async b=>{const c=localCheck(b.text);if(!c.ok)return{status:422,...c};const rid=(await sha(b.text+Date.now()+Math.random())).slice(0,12);DEMO_P={rid,text:b.text,ai:b.ai_assisted};return{status:200,rid,verify:"https://privateclient.ai/r/"+rid,...c}},
 sign:async b=>{const t=Math.floor(Date.now()/1e3),ts=await sha(DEMO_P.text),cs=b.image?await sha(b.image):null;
  return{status:200,rid:b.rid,t,text_sha:ts,card_sha:cs,ai_assisted:DEMO_P.ai,post:"urn:li:share:DEMO"+(++DEMO_N),url:null,verify:"https://privateclient.ai/r/"+b.rid,demo:true}},
 out:async()=>{delete sessionStorage.pc_demo}
};
function signin(){$("face").classList.remove("pulse");
 if(LIVE){location.href="/linkedin/login?scope=post&next=client";return}
 sessionStorage.pc_demo=1;boot();}
$("face").onclick=signin;$("go").onclick=signin;
$("face").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();signin()}};

const footer=rid=>"— "+tr("I approve this message.","I approve this message.")+($("ai").checked?"\nAI-assisted · human-reviewed":"")+"\n>_PrivateClient · privateclient.ai/r/"+(rid||"············");
$("tx").oninput=()=>{const n=$("tx").value.trim().length;$("cnt").textContent=n+" / 2800";$("cnt").style.color=n>2800?"var(--stop)":""};
$("paste").onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t){$("tx").value+=t;$("tx").oninput()}}catch(e){$("tx").focus()}};
let CK=null;
const keyLine=t=>{const f=(t.trim().split(/\n/)[0].match(/^.*?[.!?](\s|$)/)||[t.trim().split(/\n/)[0]])[0].trim();return f.length>140?f.slice(0,137).trimEnd()+"…":f};
/* the signed card · 1080×1350 (4:5, LinkedIn feed) */
const FACE=["M52 78 Q52 18 120 18 Q188 18 188 78 V176 Q188 246 120 250 Q52 246 52 176 Z","M52 176 Q60 232 120 240 Q180 232 188 176"];
function wrap(x,t,w){const out=[];let line="";for(const word of t.split(/\s+/)){const tst=line?line+" "+word:word;if(x.measureText(tst).width>w&&line){out.push(line);line=word}else line=tst}if(line)out.push(line);return out}
function drawCard(){const c=document.createElement("canvas");c.width=1080;c.height=1350;const x=c.getContext("2d");
 x.fillStyle="#000";x.fillRect(0,0,1080,1350);x.strokeStyle="rgba(0,243,255,.08)";x.lineWidth=1;
 for(let i=0;i<=1080;i+=54){x.beginPath();x.moveTo(i,0);x.lineTo(i,1350);x.stroke()}for(let j=0;j<=1350;j+=54){x.beginPath();x.moveTo(0,j);x.lineTo(1080,j);x.stroke()}
 x.strokeStyle="#00f3ff";x.lineWidth=3;x.strokeRect(24,24,1032,1302);
 x.fillStyle="#e9f6f7";x.font="700 40px ui-monospace,Menlo,monospace";x.fillText(">_PrivateClient",64,104);
 x.fillStyle="#7d9a9e";x.font="400 24px ui-monospace,Menlo,monospace";x.fillText("powered by llm.store",64,142);
 x.save();x.translate(540-120*1.5,170);x.scale(1.5,1.5);
 x.fillStyle="#141416";x.strokeStyle="#3a3a3e";x.lineWidth=2;const hd=new Path2D(FACE[0]);x.fill(hd);x.stroke(hd);
 x.fillStyle="#030a0b";x.strokeStyle="#00f3ff";x.lineWidth=2.5;x.beginPath();x.roundRect(66,92,108,56,26);x.fill();x.stroke();
 x.lineCap="round";x.lineWidth=4;x.beginPath();x.moveTo(88,120);x.lineTo(106,120);x.moveTo(134,120);x.lineTo(152,120);x.shadowColor="#00f3ff";x.shadowBlur=12;x.stroke();x.shadowBlur=0;
 x.lineWidth=3;x.beginPath();x.moveTo(100,196);x.quadraticCurveTo(120,206,140,196);x.stroke();
 x.strokeStyle="rgba(184,115,51,.55)";x.lineWidth=2;x.stroke(new Path2D(FACE[1]));
 x.strokeStyle="#3a6fe0";x.lineWidth=1.5;x.beginPath();x.arc(120,40,12,0,7);x.stroke();x.fillStyle="#00f3ff";x.beginPath();x.arc(120,40,4,0,7);x.fill();x.restore();
 const line=($("kl").value||keyLine($("tx").value)).trim();let fs=66,ls;
 do{x.font=`700 ${fs}px system-ui,-apple-system,Segoe UI,sans-serif`;ls=wrap(x,"“"+line+"”",920);fs-=4}while(ls.length>5&&fs>34);
 x.fillStyle="#fff";x.textAlign="center";const lh=fs*1.28,y0=790-((ls.length-1)*lh)/2;ls.forEach((l,i)=>x.fillText(l,540,y0+i*lh));
 x.fillStyle="#00f3ff";x.font="500 36px system-ui,sans-serif";x.fillText("— "+ME.name,540,Math.min(1080,y0+ls.length*lh+30));
 x.save();x.translate(540,1170);x.rotate(-0.05);x.strokeStyle="#0a66c2";x.lineWidth=6;x.beginPath();x.roundRect(-330,-52,660,104,18);x.stroke();
 let sf=40;x.font=`800 ${sf}px system-ui,sans-serif`;while(x.measureText("I APPROVE THIS MESSAGE").width>520&&sf>24){sf-=2;x.font=`800 ${sf}px system-ui,sans-serif`}
 const tw=x.measureText("I APPROVE THIS MESSAGE").width,mw=56,gap=22,x0=-(mw+gap+tw)/2;
 x.save();x.translate(x0-4,-40);x.scale(2.6,2.6);x.strokeStyle="#00f3ff";x.lineWidth=2.6;x.lineCap="round";x.lineJoin="round";x.stroke(new Path2D("M3 12 L7.5 17 L12 12 M17 3 V17"));x.restore();
 x.fillStyle="#4c9be8";x.textAlign="left";x.fillText("I APPROVE THIS MESSAGE",x0+mw+gap,sf*0.36);x.textAlign="center";x.restore();
 x.fillStyle="#7d9a9e";x.font="400 26px ui-monospace,Menlo,monospace";
 x.fillText(($("ai").checked?"AI-assisted · human-reviewed · ":"human-reviewed · ")+"privateclient.ai/r/"+(RID||"············"),540,1285);
 return c.toDataURL("image/png");}
const PCM='<svg class="pcm" viewBox="0 0 24 24" aria-label="Private Client check" role="img"><path d="M3 12 L7.5 17 L12 12 M17 3 V17" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let kt=0;$("kl").oninput=()=>{clearTimeout(kt);kt=setTimeout(()=>{CARD=drawCard();$("cardImg").src=CARD},150)};
async function review(){const t=$("tx").value.trim();$("toCheck").disabled=true;
 const r=await API.prepare({text:t,ai_assisted:$("ai").checked}).catch(()=>({status:0,...localCheck(t)}));$("toCheck").disabled=false;
 CK=r.checks?r:localCheck(t);RID=r.status===200?r.rid:null;
 $("pv").textContent=t;$("ft").textContent=footer(RID);$("nm").textContent=ME.name;$("av").textContent=ME.name[0];
 if(!$("kl").value)$("kl").value=keyLine(t);CARD=drawCard();$("cardImg").src=CARD;$("cardImg").alt=$("kl").value;
 $("ck").innerHTML="";for(const c of CK.checks){const li=document.createElement("li");li.className=c.level;li.textContent=(c.level==="warn"?"⚠ ":c.level==="ok"?" ":"✕ ")+c[L];if(c.level==="ok")li.insertAdjacentHTML("afterbegin",PCM);$("ck").appendChild(li)}
 const h=document.createElement("li");h.className="ok";h.textContent="🧿 "+tr("Private Client checked it. You decide.","Private Client lo revisó. Tú decides.");$("ck").appendChild(h);
 $("hold").disabled=!(CK.ok&&RID);show(2);}
$("toCheck").onclick=review;$("edit").onclick=()=>{$("kl").value="";show(1)};

/* hold-to-approve, 1.2 s */
let t0=0,raf=0,busy=false;const HOLD=1200;
function step(){const p=Math.min(1,(performance.now()-t0)/HOLD);$("fill").style.width=p*100+"%";if(p<1)raf=requestAnimationFrame(step);else approve(performance.now()-t0)}
function down(e){if($("hold").disabled||busy)return;e.preventDefault();t0=performance.now();raf=requestAnimationFrame(step);navigator.vibrate&&navigator.vibrate(10)}
function up(){if(busy)return;cancelAnimationFrame(raf);$("fill").style.width="0"}
$("hold").addEventListener("pointerdown",down);["pointerup","pointerleave","pointercancel"].forEach(ev=>$("hold").addEventListener(ev,up));
$("hold").onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&!e.repeat)down(e)};$("hold").onkeyup=up;
async function approve(held){busy=true;navigator.vibrate&&navigator.vibrate([20,40,20]);$("hold").querySelector("span").textContent=tr("Posting…","Publicando…");
 const r=await API.sign({rid:RID,image:CARD,alt:$("kl").value,held_ms:Math.round(held)}).catch(()=>({status:0}));
 busy=false;$("fill").style.width="0";paint();
 if(r.status!==200){$("ck").insertAdjacentHTML("afterbegin",`<li class="stop">✕ ${r.error||(r.checks?tr("Checks failed on the server.","La revisión falló en el servidor."):tr("Nothing was posted. Try again.","No se publicó nada. Intenta de nuevo."))}</li>`);return}
 LAST=r;const when=new Date(r.t*1e3).toLocaleString(L);
 $("rc").innerHTML="";[[tr("Receipt","Recibo"),r.rid],[tr("Approved","Aprobado"),when],[tr("Text SHA-256","SHA-256 del texto"),r.text_sha],[tr("Card SHA-256","SHA-256 de la tarjeta"),r.card_sha||"—"],[tr("AI-assisted","Con IA"),r.ai_assisted?tr("yes · human-reviewed","sí · revisado por humano"):tr("no","no")],[tr("Verify","Verificar"),r.verify.replace("https://","")]].forEach(([k,v])=>{const d=document.createElement("div");d.innerHTML="<b></b> ";d.firstChild.textContent=k;d.append(v);$("rc").appendChild(d)});
 if(r.demo){const d=document.createElement("div");d.textContent=tr("LAB DEMO: nothing was posted to LinkedIn.","LAB DEMO: no se publicó nada en LinkedIn.");$("rc").appendChild(d)}
 $("view").style.display=r.url?"":"none";if(r.url)$("view").href=r.url;
 $("tx").value="";$("kl").value="";RID=null;$("tx").oninput();show(3);}
$("again").onclick=()=>show(1);
async function out(){await API.out();ME=null;$("face").classList.add("pulse");show(0);paint()}
$("out1").onclick=out;$("out3").onclick=out;

async function boot(){const q=new URLSearchParams(location.search).get("signin");
 if(q&&q!=="ok")$("tag0").textContent=q==="cancelled"?tr("No problem. Nothing was shared.","Sin problema. No se compartió nada."):tr("That didn't finish. Tap me to try again.","No terminó. Tócame para intentar de nuevo.");
 const m=await API.me().catch(()=>({signed_in:false}));
 if(m.signed_in&&m.can_post){ME=m;paint();$("tx").oninput();show(1);history.replaceState(null,"",location.pathname)}
 else if(m.signed_in){ME=m;paint();show(0)} /* signed in without post access: tap the face to grant it */
 else{paint();if(q&&q!=="ok")$("tag0").textContent=q==="cancelled"?tr("No problem. Nothing was shared.","Sin problema. No se compartió nada."):tr("That didn't finish. Tap me to try again.","No terminó. Tócame para intentar de nuevo.")}}
paint();boot();
</script>
</body></html>
