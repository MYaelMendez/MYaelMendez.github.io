  $("agents").innerHTML=AGENTS.map(a=>`<div class="agent"><div class="top"><span>${a.emoji}</span><b>${esc(a.name)}</b><em class="chip ${a.prov==="verified"?"y":"h"}">${a.prov==="verified"?tr("verificado","verified"):tr("sin verificar","unverified")}</em></div>
   <p class="dim">${esc(a.role)} · ${esc(a.where)}</p>
   ${Object.entries(a.caps).map(([c,v])=>`<div class="grant"><span>${esc(CAPN[c])}</span>${c==="publish"?`<span class="chip h">${tr("solo humano","human only")}</span>`:`<select data-a="${a.id}" data-c="${c}" aria-label="${esc(a.name+" "+CAPN[c])}">${["deny","ask","allow"].map(o=>`<option value="${o}"${o===v?" selected":""}>${{deny:tr("no","deny"),ask:tr("pregúntame","ask me"),allow:tr("permitir","allow")}[o]}</option>`).join("")}</select>`}</div>`).join("")}</div>`).join("");
  $("agents").querySelectorAll("select").forEach(s=>s.onchange=async()=>{const a=AGENTS.find(x=>x.id===s.dataset.a);a.caps[s.dataset.c]=s.value;
    await witness({op:"grant",agent:a.id,cap:s.dataset.c,to:s.value});saveGrants();toast(tr("Permiso cambiado · recibo firmado","Grant changed · receipt signed"));envRender();inboxRender();});
}
function inboxRender(){
  const open=INTENTS.filter(i=>!i.done);
  $("dot").hidden=!open.length;$("dot").textContent=open.length;
  if(!INTENTS.length){$("intents").innerHTML=`<p class="dim" style="margin-top:10px">${tr("Nada esperando. Los agentes están tranquilos.","Nothing waiting. The agents are quiet.")}</p>`;return;}
  $("intents").innerHTML=INTENTS.map(i=>{const a=AGENTS.find(x=>x.id===i.agent)||{name:i.agent,emoji:"🛸"};const c=curate(i);
   const vc={pass:"y",hold:"h",reject:"n"}[c.verdict];
   return `<div class="intent"><div class="who">${a.emoji} ${esc(a.name)} · ${esc(i.kind)}</div><div class="what">${esc(i.title)}</div>
    <pre>${esc(i.body)}${i.media?"\n\n🎞 "+esc(i.media):""}</pre>
    <p class="dim">${tr("por qué","why")}: ${esc(i.why||"—")}</p>
    <p class="cur"><span class="chip ${vc}">${tr("curador","curator")}: ${c.verdict}</span> ${c.notes.map(esc).join(" · ")}</p>
    ${i.done?`<div class="rcpt">${esc(i.done)}</div>`:`<div class="row">
      <button class="btn ok hold" data-i="${i.id}" data-d="approve"><i></i>${tr("Mantén para firmar","Hold to sign")}</button>
      <button class="btn no" data-i="${i.id}" data-d="decline">${tr("No","Decline")}</button></div>
      ${LIVE&&i.kind==="post"?`<input type="password" id="k-${i.id}" placeholder="${tr("tu llave de aprobación","your approval key")}" autocomplete="off">`:""}`}
   </div>`}).join("");
  $("intents").querySelectorAll("button[data-d=decline]").forEach(b=>b.onclick=()=>decide(b.dataset.i,"decline"));
  $("intents").querySelectorAll("button.hold").forEach(holdify);
}
function holdify(b){let t0=0,raf=0;const bar=b.querySelector("i");const MS=1200;
  const stop=()=>{cancelAnimationFrame(raf);bar.style.width="0";t0=0;};
  const tick=()=>{const p=Math.min(1,(performance.now()-t0)/MS);bar.style.width=(p*100)+"%";if(p>=1){stop();navigator.vibrate&&navigator.vibrate(30);decide(b.dataset.i,"approve");}else raf=requestAnimationFrame(tick);};
  b.onpointerdown=e=>{e.preventDefault();t0=performance.now();mood("work");raf=requestAnimationFrame(tick);};
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>{if(t0){stop();mood("ready");}}));
  b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();decide(b.dataset.i,"approve");}};}
async function decide(id,d){
  const it=INTENTS.find(x=>x.id===id);if(!it||it.done)return;
  const c=curate(it);
  if(d==="approve"&&c.verdict!=="pass"){toast(tr("El curador lo retiene. Cambia el permiso o declina.","The curator holds this. Change the grant or decline."));mood("hold");return;}
  let extra={};
  if(LIVE){try{const k=$("k-"+id);const r=await fetch("/intents/decide",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,decision:d,key:k?k.value:""})});
      if(!r.ok){toast(tr("No autorizado.","Not authorized."));mood("hold");return;}extra=await r.json();}catch{toast(tr("Sin red.","Offline."));return;}}
  const h=await witness({op:d,intent:id,agent:it.agent,kind:it.kind,body_sha:await sha(it.body||"")});
  it.done=(d==="approve"?tr("✓ firmado","✓ signed"):tr("✕ declinado","✕ declined"))+` · ${h.slice(0,16)}…`+(extra.post?` · ${extra.post}`:"")+(!LIVE&&d==="approve"&&it.kind==="post"?tr(" · (demo: no se publicó)"," · (demo: not published)"):"");
  mood(d==="approve"?"ready":"sleep");toast(d==="approve"?tr("Firmado. Recibo en la cadena.","Signed. Receipt on the chain."):tr("Declinado. El agente lo sabrá.","Declined. The agent will know."));
  inboxRender();
}
function renderR(){
  if(!$("rcpts"))return;
  $("rcpts").innerHTML=CHAIN.slice().reverse().map(r=>`<div class="rcpt"><b>${esc(r.op)}</b> ${esc(r.agent||"")} ${esc(r.cap||"")} ${esc(r.to||"")}<br><span class="dim">${esc(r.t)}</span><br>${r.hash}</div>`).join("")||`<p class="dim">GENESIS</p>`;
}
const store={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
function saveGrants(){store.set("pc.grants",Object.fromEntries(AGENTS.map(a=>[a.id,a.caps])));}
function loadGrants(){const g=store.get("pc.grants");if(g)AGENTS.forEach(a=>{if(g[a.id])Object.assign(a.caps,g[a.id],{publish:"human"});});}
function dl(name,obj){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}

/* ── enter / leave ── */
async function enter(me){ME=me;await witness({op:"signin",who:(await sha("privateclient:"+(me.email||me.name))).slice(0,16)});
  if(!LIVE)INTENTS=DEMO_INTENTS();else{try{const r=await fetch("/intents",{credentials:"same-origin"});if(r.ok)INTENTS=(await r.json()).intents||[];}catch{}}
  mood("ready");await envRender();agentsRender();inboxRender();go("env");
  toast(INTENTS.length?tr(`${INTENTS.length} propuestas esperan tu decisión.`,`${INTENTS.length} intents await your decision.`):tr("Bienvenido.","Welcome."));}
async function leave(forget){
  if(LIVE)try{await fetch(forget?"/forget":"/logout",{method:"POST",credentials:"same-origin"});}catch{}
  if(forget)try{localStorage.removeItem("pc.grants");}catch{}
  await witness({op:forget?"forget":"signout"});ME=null;INTENTS=[];mood("sleep");inboxRender();go("door");
  toast(forget?tr("Olvidado. Borramos sesión, borradores y permisos.","Forgotten. Session, drafts and grants deleted."):tr("Saliste. No guardamos nada.","Signed out. Nothing kept."));}

const human=()=>{if(LIVE){location.href="/linkedin/login?next=portal";return;}enter({name:"Ana Demo",email:"ana@demo"});};
$("bigface").onclick=human;$("bigface").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();human();}};
addEventListener("pointermove",e=>{const y=(e.clientX/innerWidth-.5)*70,p=(e.clientY/innerHeight-.5)*50;for(const[id,k,kp]of[["biris",.06,.05],["bpupil",.09,.07]]){$(id).setAttribute("cx",(120+y*k).toFixed(2));$(id).setAttribute("cy",(42+p*kp).toFixed(2));}},{passive:true});
$("d-agent").onclick=()=>{$("agentdoc").hidden=false;mood("think");$("agentdoc").scrollIntoView({behavior:"smooth"});};
$("b-card").onclick=()=>dl("agent-card.json",CARD);
$("b-try").onclick=async()=>{
  const it={id:"x"+Date.now().toString(36),agent:"scout",kind:"ask",title:tr("¿Puedo mostrar tu portafolio?","May I show your portfolio?"),body:tr("Un agente externo pregunta.","An outside agent asks."),why:"discovery"};
  if(LIVE){try{const r=await fetch("/intents",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({agent:"scout.example",kind:"ask",title:it.title,body:it.body,why:it.why})});const j=await r.json();toast(tr(`Recibido: ${j.status}`,`Received: ${j.status}`));}catch{toast(tr("Sin red.","Offline."));}return;}
  INTENTS.unshift(it);inboxRender();await witness({op:"propose",agent:"scout",kind:"ask"});toast(tr("Propuesta recibida. Espera al humano.","Intent received. Waiting for the human."));};
$("b-fork").onclick=()=>dl("ae.json",{schema:"ae.manifest/0.1",id:ME.addr,name:"PRIVATE CLIENT · fork",status:"lab",address:"0:0:0:æ1",surface:location.origin+location.pathname,
  capabilities:AGENTS.map(a=>({agent:a.id,grants:a.caps})),authority:CARD.authority,provenance:{forked_from:CARD.url,author:">_æ: Yæl Méndez",license:CARD.license,witness_head:prev},"æQR":"conceptual, not scannable"});
$("b-out").onclick=()=>leave(false);$("b-forget").onclick=()=>leave(true);
$("b-export").onclick=()=>dl("receipts.json",{genesis:"0".repeat(64),chain:CHAIN});
[...$("nav").children].forEach(b=>b.onclick=()=>go(b.dataset.s));

/* agent edition */
window.PRIVATECLIENT={card:()=>CARD,chain:()=>CHAIN.slice(),propose:i=>{const it={id:"a"+Date.now().toString(36),agent:String(i.agent||"agent"),kind:String(i.kind||"ask"),title:String(i.title||"").slice(0,120),body:String(i.body||"").slice(0,3000),why:String(i.why||"").slice(0,300)};INTENTS.unshift(it);inboxRender();witness({op:"propose",agent:it.agent,kind:it.kind});return{status:"awaiting human",id:it.id,curator:curate(it)};}};

T();loadGrants();renderR();inboxRender();go("door");witness({op:"boot",mode:LIVE?"live":"lab"});
if(new URLSearchParams(location.search).has("agent")){document.body.innerHTML="";const p=document.createElement("pre");p.style.cssText="white-space:pre-wrap;color:#0ff;padding:16px;font:13px monospace";p.textContent=JSON.stringify(CARD,null,2);document.body.append(p);}
(async()=>{if(!LIVE)return;const q=new URLSearchParams(location.search);if(q.get("signin"))history.replaceState(null,"",location.pathname);
  try{const r=await fetch("/me",{credentials:"same-origin"});const j=await r.json();if(j.signed_in)enter(j);
  else if(q.get("signin")&&q.get("signin")!=="ok")toast({cancelled:tr("Sin problema, no compartiste nada.","No problem, nothing was shared."),expired:tr("El enlace caducó.","That link expired."),failed:tr("LinkedIn no respondió.","LinkedIn didn't answer.")}[q.get("signin")]||"");}catch{}})();
