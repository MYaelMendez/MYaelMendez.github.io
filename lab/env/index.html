<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>&gt;_æ^æ^æ://agentic_environments</title><meta name="robots" content="noindex"><meta name="theme-color" content="#050516">

<style>
body{margin:0;min-height:100vh;background:#050516;color:#e8e8f0;font:14px/1.5 ui-monospace,"JetBrains Mono",monospace}
main{width:min(94vw,620px);margin:0 auto;padding:26px 0 70px}
.sym{font:800 clamp(26px,8vw,44px)/1.05 ui-monospace,monospace;word-break:break-all}.p{color:#B4FF2E}.a{color:#D4AF37}.c{color:#00EAFF}
.sub{color:#9aa0b8;margin:10px 0 16px}
.lay{display:grid;gap:8px;margin:14px 0 22px}
.lay div{border:1px solid #2a2f6a;border-radius:10px;padding:10px 12px}.lay b{color:#D4AF37;margin-right:8px}
.lay div:nth-child(2) b{color:#E8423F}.lay div:nth-child(3) b{color:#00EAFF}
h2{font:800 13px/1 ui-monospace,monospace;letter-spacing:.25em;color:#8f94aa;margin:26px 0 10px}
.net{margin:14px 0 6px;color:#B4FF2E;font-weight:700}
.env{border:1px solid #2a2f6a;border-left:3px solid #D4AF37;border-radius:10px;padding:10px 12px;margin:8px 0}
.env .t{font-weight:700}.env .ad{color:#00EAFF;font-size:12px;word-break:break-all}
.st{float:right;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid #B4FF2E;color:#B4FF2E}.st.live{border-color:#D4AF37;color:#D4AF37}
.cap{display:inline-block;font-size:11px;color:#aab;border:1px solid #333a7a;border-radius:999px;padding:0 7px;margin:4px 4px 0 0}
.au{font-size:12px;color:#9aa0b8;margin-top:6px}.au i{color:#B4FF2E;font-style:normal}.au u{color:#E8423F;text-decoration:none}
.env a{color:#8f94aa;font-size:12px}
.err{border-left-color:#E8423F;color:#9aa0b8}
textarea{width:100%;box-sizing:border-box;min-height:120px;background:#0b0b24;border:1px solid #2a2f6a;color:#fff;border-radius:8px;padding:10px;font:12px ui-monospace,monospace}
button{background:none;border:1px solid #00EAFF;color:#00EAFF;border-radius:8px;padding:8px 14px;font:700 13px ui-monospace,monospace;cursor:pointer;margin-top:8px}
#vr{margin-top:10px;white-space:pre-wrap;font-size:12px}
.ok{color:#B4FF2E}.no{color:#E8423F}
.langs{margin-top:22px;display:flex;gap:6px}.langs button{margin:0;padding:2px 8px;font-size:11px;border-color:#2a2f6a;color:#8f94aa}.langs .on{color:#D4AF37;border-color:#D4AF37}
footer{margin-top:22px;color:#667;font-size:12px}footer a{color:#B4FF2E}
#cnt{color:#D4AF37}
</style></head><body><main>
<div class="sym"><span class="p">&gt;_</span><span class="a">æ^æ^æ</span><span class="c">://agentic<wbr>_environments</span></div>
<p class="sub" data-t="sub"></p>
<div class="lay"><div><b>æ</b><span data-t="l1"></span></div><div><b>æ^æ</b><span data-t="l2"></span></div><div><b>æ^æ^æ</b><span data-t="l3"></span></div></div>
<h2><span data-t="atlas"></span> · <span id="cnt">…</span></h2>
<div id="atlas"></div>
<h2 data-t="make"></h2>
<p class="sub" data-t="mk"></p>
<textarea id="src" placeholder='{ "schema": "ae.manifest/0.1", ... }  —  or https://…/ae.json'></textarea>
<button id="go" data-t="val"></button>
<div id="vr"></div>
<div class="langs" id="langs"></div>
<footer>Many agents. One principal. · <a href="ae.json">ae.json</a> · <a href="ae.schema.json">ae.schema.json</a> · <a href="llms.txt">llms.txt</a> · <a href="../opc/">#opc</a> · <a href="../">æææ</a> · #ioa · #opensourceware</footer>
</main><script>
var I={
en:{sub:"Every surface is an agentic environment: one principal, many agents, a manifest agents can read. Open to fork.",l1:"one environment · a store, a site, a class",l2:"a network of environments · #opc, L:// stores",l3:"the index of every network · this page",atlas:"LIVE ATLAS",make:"MAKE YOUR OWN",mk:"Paste your ae.json or its URL. Valid manifests can join by public issue; the steward approves.",val:"$validate",envs:"environments",may:"agents may",hum:"human only",ok:"✓ valid ae.manifest/0.1",join:"Open a public issue to join →"},
es:{sub:"Cada superficie es un entorno agéntico: un principal, muchos agentes, un manifiesto que los agentes leen. Abierto para fork.",l1:"un entorno · una tienda, un sitio, una clase",l2:"una red de entornos · #opc, tiendas L://",l3:"el índice de todas las redes · esta página",atlas:"ATLAS EN VIVO",make:"CREA EL TUYO",mk:"Pega tu ae.json o su URL. Los manifiestos válidos se unen por issue público; la responsable aprueba.",val:"$validar",envs:"entornos",may:"agentes pueden",hum:"solo humano",ok:"✓ ae.manifest/0.1 válido",join:"Abre un issue público para unirte →"},
zh:{sub:"每个界面都是一个智能体环境：一个负责人，一群智能体，一份智能体能读懂的清单。开源，可分叉。",l1:"一个环境 · 一家店、一个网站、一门课",l2:"一个环境网络 · #opc、L:// 商店",l3:"所有网络的索引 · 本页",atlas:"实时地图",make:"创建你自己的",mk:"粘贴你的 ae.json 或其网址。有效清单可通过公开 issue 加入，由负责人批准。",val:"$验证",envs:"个环境",may:"智能体可以",hum:"仅限人类",ok:"✓ 有效的 ae.manifest/0.1",join:"打开公开 issue 加入 →"}},K=Object.keys(I),L,T;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pick(){var s=localStorage.envL;if(s&&I[s])return s;var n=navigator.languages||[navigator.language||'en'];for(var i=0;i<n.length;i++){var c=(n[i]||'').slice(0,2).toLowerCase();if(I[c])return c}return 'en'}
function j(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
var DATA=null;
function load(){j('ae.json').then(function(root){return Promise.all(root.networks.map(function(n){return j(n.url).then(function(m){
 var kids=(m.environments||m.nodes||[]).map(function(e){return e.manifest}).filter(function(u,i,a){return u&&a.indexOf(u)===i});
 if(!kids.length)return {n:n,items:[{url:n.url,m:m}]};
 return Promise.all(kids.map(function(u){return j(u).then(function(x){return {url:u,m:x}},function(){return {url:u,err:1}})})).then(function(items){return {n:n,items:items}})
},function(){return {n:n,items:[{url:n.url,err:1}]}})}))}).then(function(d){DATA=d;render()})}
function card(it){if(it.err)return '<div class="env err">'+esc(it.url)+' · unreachable</div>';var m=it.m,a=m.authority||{};var live=/live/.test(m.status||'');
return '<div class="env"><span class="st'+(live?' live':'')+'">'+esc((m.status||'').split(' ')[0])+'</span><div class="t">'+esc(m.name||m.principal||m.surface||m.id)+'</div><div class="ad">'+esc(m.address||'')+'</div>'+
(m.capabilities||[]).slice(0,6).map(function(c){return '<span class="cap">'+esc(c)+'</span>'}).join('')+
'<div class="au"><i>'+T.may+'</i> '+esc((a.agents_may||[]).join(', ')||'—')+'<br><u>'+T.hum+'</u> '+esc((a.human_only||[]).join(', ')||'—')+'</div><a href="'+esc(it.url)+'">ae.json ↗</a></div>'}
function render(){if(!DATA)return;var c=0;$('atlas').innerHTML=DATA.map(function(g){c+=g.items.length;return '<div class="net">'+esc(g.n.name)+'</div>'+g.items.map(card).join('')}).join('');$('cnt').textContent=c+' '+T.envs}
function validate(m){var e=[];if(!m||typeof m!=='object')return ['not a JSON object'];
if(m.schema!=='ae.manifest/0.1')e.push('schema must be "ae.manifest/0.1"');
['address','status','checkout'].forEach(function(k){if(!m[k])e.push('missing '+k)});if(!m.principal&&!(m.authority&&m.authority.principal))e.push('missing principal (top level or authority.principal)');
if(m.status&&['lab','live','retired'].indexOf(String(m.status).split(' ')[0])<0)e.push('status: lab | live | retired');
if(!Array.isArray(m.capabilities))e.push('capabilities must be an array');
if(!m.authority||!Array.isArray(m.authority.agents_may)||!Array.isArray(m.authority.human_only))e.push('authority needs agents_may[] and human_only[]');
else if(!m.authority.human_only.length)e.push('human_only cannot be empty: the principal keeps authority');
return e}
$('go').onclick=function(){var s=$('src').value.trim(),out=$('vr');
var run=function(m){var e=validate(m);out.innerHTML=e.length?'<span class="no">✗ '+e.map(esc).join('\n✗ ')+'</span>':'<span class="ok">'+T.ok+' · '+esc(m.address)+'</span>\n<a style="color:#00EAFF" target="_blank" rel="noopener" href="https://github.com/LutheranInstitute/aeee-lab/issues/new?title='+encodeURIComponent('æ^æ^æ join · '+m.address)+'&body='+encodeURIComponent('```json\n'+JSON.stringify(m,null,2)+'\n```\n\n#ioa #opensourceware')+'">'+T.join+'</a>'};
if(/^https?:\/\//.test(s))j(s).then(run,function(){out.innerHTML='<span class="no">✗ fetch failed (CORS or 404)</span>'});
else{try{run(JSON.parse(s))}catch(x){out.innerHTML='<span class="no">✗ JSON: '+esc(x.message)+'</span>'}}};
function draw(l){L=l;T=I[l];document.documentElement.lang=l;[].forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=T[e.dataset.t]});
$('langs').innerHTML=K.map(function(k){return '<button data-l="'+k+'" class="'+(k===l?'on':'')+'">'+(k==='zh'?'中':k.toUpperCase())+'</button>'}).join('');render()}
$('langs').onclick=function(e){var l=e.target.dataset.l;if(l){localStorage.envL=l;draw(l)}};
draw(pick());load();
</script></body></html>
