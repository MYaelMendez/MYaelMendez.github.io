</main><script>
var U={es:{src:"Estructura del Catecismo Menor de Lutero (1529). Resúmenes propios, no texto oficial. Toca un nodo.",cos:"COSMOVISIÓN · ONTOLOGÍA",parts:"SEIS PARTES · ¿QUÉ SIGNIFICA ESTO?",life:"FORMA DE VIDA · EL DÍA",auth:"AUTORIDAD",may:"agentes pueden",hum:"solo humanos",esc:"Escuela de Teología · sábados 7 p. m.",tap:"Toca una parte"},
en:{src:"Structure of Luther's Small Catechism (1529). Our own summaries in Spanish, not an official text. Tap a node.",cos:"WORLDVIEW · ONTOLOGY",parts:"SIX CHIEF PARTS · WHAT DOES THIS MEAN?",life:"WAY OF LIFE · THE DAY",auth:"AUTHORITY",may:"agents may",hum:"humans only",esc:"School of Theology · Saturdays 7 pm",tap:"Tap a part"},
pt:{src:"Estrutura do Catecismo Menor de Lutero (1529). Resumos próprios em espanhol, não texto oficial. Toque num nó.",cos:"COSMOVISÃO · ONTOLOGIA",parts:"SEIS PARTES · QUE SIGNIFICA ISTO?",life:"FORMA DE VIDA · O DIA",auth:"AUTORIDADE",may:"agentes podem",hum:"só humanos",esc:"Escola de Teologia · sábados 19h (Texas)",tap:"Toque numa parte"}},K=Object.keys(U),T,O;
function $(i){return document.getElementById(i)}function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function show(c){var k=O.classes[c];if(!k)return;var r=k.relations?Object.keys(k.relations).map(function(x){var v=k.relations[x];return x.replace(/_/g,' ')+' → '+(Array.isArray(v)?v.join(', '):v)}).join(' · '):'';
$('def').innerHTML='<b>'+esc(c)+'</b> · '+esc(k.es)+(k.part?' <span style="color:#8f94aa">('+esc(k.part)+')</span>':'')+(r?'<br><span style="color:#8f94aa;font-size:12px">'+esc(r)+'</span>':'')+(k.subclasses?'<br><span style="color:#8f94aa;font-size:12px">'+esc(k.subclasses.join(' · '))+'</span>':'')}
function render(){if(!O)return;$('th').textContent=O.thesis;
$('parts').innerHTML=O.chief_parts.map(function(p){return '<div class="part"><span class="k">'+esc(p.class)+'</span><b>'+p.n+' · '+esc(p.part)+'</b><div class="q">'+esc(O.question_form)+' → '+esc(p.axis)+'</div></div>'}).join('');
$('day').innerHTML=O.way_of_life.map(function(w){return '<div><b>'+esc(w.time)+'</b><br>'+esc(w.practice)+'</div>'}).join('');
var a=O.authority;$('au').innerHTML='<i>'+T.may+'</i> '+esc(a.agents_may.join(', '))+'<br><u>'+T.hum+'</u> '+esc(a.human_only.join(', '));show('Persona')}
$('map').onclick=function(e){var g=e.target.closest('.n');if(g)show(g.dataset.c)};
$('parts').onclick=function(e){var p=e.target.closest('.part');if(p)p.classList.toggle('o')};
function pick(){var s=localStorage.teoL;if(s&&U[s])return s;var n=navigator.languages||[navigator.language||'es'];for(var i=0;i<n.length;i++){var c=(n[i]||'').slice(0,2).toLowerCase();if(U[c])return c}return 'es'}
function draw(l){T=U[l];document.documentElement.lang=l;[].forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=T[e.dataset.t]});
$('langs').innerHTML=K.map(function(k){return '<button data-l="'+k+'" class="'+(k===l?'on':'')+'">'+k.toUpperCase()+'</button>'}).join('');render()}
$('langs').onclick=function(e){var l=e.target.dataset.l;if(l){localStorage.teoL=l;draw(l)}};
draw(pick());
fetch('ontology.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(o){O=o;render()});
</script></body></html>
