 CK=r.checks?r:localCheck(t);RID=r.status===200?r.rid:null;QR=r.status===200?r.qr:null;
 $("pv").textContent=t;$("ft").textContent=footer(RID);$("nm").textContent=ME.name;$("av").textContent=ME.name[0];
 if(!$("kl").value)$("kl").value=keyLine(t);CARD=drawCard();$("cardImg").src=CARD;$("cardImg").alt=$("kl").value;
 $("ck").innerHTML="";for(const c of CK.checks){const li=document.createElement("li");li.className=c.level;li.textContent=(c.level==="warn"?"⚠ ":c.level==="ok"?" ":"✕ ")+(c[L]||c.en);if(c.level==="ok")li.insertAdjacentHTML("afterbegin",PCM);$("ck").appendChild(li)}
 const h=document.createElement("li");h.className="ok";h.textContent="🧿 "+tr("Private Client checked it. You decide.","Private Client lo revisó. Tú decides.");$("ck").appendChild(h);
 $("hold").disabled=!(CK.ok&&RID);show(2);mood(CK.ok&&RID?"ready":"stop");}
$("toCheck").onclick=review;$("edit").onclick=()=>{$("kl").value="";show(1)};

/* hold-to-approve, 1.2 s */
let t0=0,raf=0,busy=false;const HOLD=1200;
function step(){const p=Math.min(1,(performance.now()-t0)/HOLD);$("fill").style.width=p*100+"%";if(p<1)raf=requestAnimationFrame(step);else approve(performance.now()-t0)}
function down(e){if($("hold").disabled||busy)return;e.preventDefault();t0=performance.now();raf=requestAnimationFrame(step);navigator.vibrate&&navigator.vibrate(10)}
function up(){if(busy)return;cancelAnimationFrame(raf);$("fill").style.width="0"}
$("hold").addEventListener("pointerdown",down);["pointerup","pointerleave","pointercancel"].forEach(ev=>$("hold").addEventListener(ev,up));
$("hold").onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&!e.repeat)down(e)};$("hold").onkeyup=up;
async function approve(held){busy=true;mood("checking");navigator.vibrate&&navigator.vibrate([20,40,20]);$("hold").querySelector("span").textContent=tr("Posting…","Publicando…");
 const r=await API.sign({rid:RID,image:CARD,alt:$("kl").value,held_ms:Math.round(held)}).catch(()=>({status:0}));
 busy=false;$("fill").style.width="0";paint();
 if(r.status!==200){mood("stop");$("ck").insertAdjacentHTML("afterbegin",`<li class="stop">✕ ${r.error||(r.checks?tr("Checks failed on the server.","La revisión falló en el servidor."):tr("Nothing was posted. Try again.","No se publicó nada. Intenta de nuevo."))}</li>`);return}
 LAST=r;const when=new Date(r.t*1e3).toLocaleString(L);
 $("rc").innerHTML="";[[tr("Receipt","Recibo"),r.rid],[tr("Approved","Aprobado"),when],[tr("Text SHA-256","SHA-256 del texto"),r.text_sha],[tr("Card SHA-256","SHA-256 de la tarjeta"),r.card_sha||"—"],[tr("AI-assisted","Con IA"),r.ai_assisted?tr("yes · human-reviewed","sí · revisado por humano"):tr("no","no")],[tr("Verify","Verificar"),r.verify.replace("https://","")]].forEach(([k,v])=>{const d=document.createElement("div");d.innerHTML="<b></b> ";d.firstChild.textContent=k;d.append(v);$("rc").appendChild(d)});
 if(r.demo){const d=document.createElement("div");d.textContent=tr("LAB DEMO: nothing was posted to LinkedIn.","LAB DEMO: no se publicó nada en LinkedIn.");$("rc").appendChild(d)}
 $("view").style.display=r.url?"":"none";if(r.url)$("view").href=r.url;
 try{localStorage.setItem("pc_last_rid",RID)}catch(e){}$("tx").value="";$("kl").value="";RID=null;QR=null;$("tx").oninput();show(3);}
$("again").onclick=()=>show(1);
async function out(){await API.out();ME=null;$("face").classList.add("pulse");show(0);paint()}
$("out1").onclick=out;$("out3").onclick=out;

async function boot(){const q=new URLSearchParams(location.search).get("signin");
 if(q&&q!=="ok")$("tag0").textContent=q==="cancelled"?tr("No problem. Nothing was shared.","Sin problema. No se compartió nada."):tr("That didn't finish. Tap me to try again.","No terminó. Tócame para intentar de nuevo.");
 const m=await API.me().catch(()=>({signed_in:false}));
 if(m.signed_in&&m.can_post){ME=m;paint();$("tx").oninput();const g=new URLSearchParams(location.search).get("go");show(g==="write"?1:4);history.replaceState(null,"",location.pathname)}
 else if(m.signed_in){ME=m;paint();show(0)} /* signed in without post access: tap the face to grant it */
 else{paint();if(q&&q!=="ok")$("tag0").textContent=q==="cancelled"?tr("No problem. Nothing was shared.","Sin problema. No se compartió nada."):tr("That didn't finish. Tap me to try again.","No terminó. Tócame para intentar de nuevo.")}}

c://. Comece por ✍️ write.","fr":"👋 Nouveau ? Tout vit sur pc://. Commencez par ✍️ write.","de":"👋 Neu hier? Alles lebt unter pc://. Starten Sie mit ✍️ write.","sv":"👋 Ny här? Allt finns på pc://. Börja med ✍️ write."},"tip_write":{"en":"Write it, or paste what your AI drafted. Then ✅ Check it.","es":"Escríbelo o pega lo que redactó tu IA. Luego ✅ Revisar.","pt":"Escreva ou cole o que sua IA redigiu. Depois ✅ Revisar.","fr":"Écrivez-le ou collez le brouillon de votre IA. Puis ✅ Vérifier.","de":"Schreiben Sie es oder fügen Sie den KI-Entwurf ein. Dann ✅ Prüfen.","sv":"Skriv det eller klistra in AI-utkastet. Sedan ✅ Granska."},"tip_review":{"en":"Read the card. Holding this button is your signature ✍️.","es":"Lee la tarjeta. Mantener este botón es tu firma ✍️.","pt":"Leia o cartão. Segurar este botão é a sua assinatura ✍️.","fr":"Lisez la carte. Maintenir ce bouton, c’est votre signature ✍️.","de":"Lesen Sie die Karte. Dieses Halten ist Ihre Unterschrift ✍️.","sv":"Läs kortet. Att hålla in knappen är din signatur ✍️."},"tip_done":{"en":"🧾 Your public receipt. Anyone can verify it, forever.","es":"🧾 Tu recibo público. Cualquiera puede verificarlo, para siempre.","pt":"🧾 Seu recibo público. Qualquer pessoa pode verificar, para sempre.","fr":"🧾 Votre reçu public. Vérifiable par tous, pour toujours.","de":"🧾 Ihr öffentlicher Beleg. Jeder kann ihn prüfen, für immer.","sv":"🧾 Ditt offentliga kvitto. Vem som helst kan verifiera det, för alltid."},"ok":{"en":"Got it 👍","es":"Entendido 👍","pt":"Entendi 👍","fr":"Compris 👍","de":"Verstanden 👍","sv":"Uppfattat 👍"},"hide":{"en":"Hide tips","es":"Ocultar consejos","pt":"Ocultar dicas","fr":"Masquer les conseils","de":"Tipps ausblenden","sv":"Dölj tips"},"guide":{"en":"Private Client guide","es":"Guía de Private Client","pt":"Guia do Private Client","fr":"Guide Private Client","de":"Private-Client-Guide","sv":"Private Client-guide"},"owner":{"en":"Owner console · your MCP sites","es":"Consola del dueño · tus sitios MCP","pt":"Console do dono · seus sites MCP","fr":"Console propriétaire · vos sites MCP","de":"Inhaber-Konsole · Ihre MCP-Seiten","sv":"Ägarkonsol · dina MCP-sajter"}};
const pt=k=>(PC[k]||{})[L]||(PC[k]||{}).en||k;
const YMCP="https://privateclient.ai/yael/mcp";
function rows(){const r=[["✍️","write",()=>show(1)],["🎨","studio","/studio"],["🧪","labs","/labs"],["🧭","mcp","/mcp/connect"],["📚","yael",()=>copy(YMCP)],["🤝","setup","mailto:yaelmendez@pm.me?subject=Private%20Client%20owner-only%20setup"],["🚪","out",()=>out()]];
 if(ME&&ME.owner)r.unshift(["🗝️","owner","/owner"]);let last=null;try{last=localStorage.getItem("pc_last_rid")}catch(e){}if(last)r.splice(1,0,["🧾","r/"+last,"/r/"+last,"r"]);return r}
function index(){const q=$("pcq").value.trim().toLowerCase().replace(/^pc:\/\//,""),ul=$("pci");ul.innerHTML="";let first=true;
 for(const [e,k,act,dk] of rows()){const d=pt(dk||k);if(q&&!(k+" "+d).toLowerCase().includes(q))continue;
  const li=document.createElement("li"),a=document.createElement("a");a.href=typeof act==="string"?act:"#";a.dataset.k=k;
  a.innerHTML='<span class="e" aria-hidden="true"></span><span class="k"></span><span class="d"></span>';a.children[0].textContent=e;a.children[1].textContent="pc://"+k;a.children[2].textContent=d;
  if(typeof act==="function")a.onclick=ev=>{ev.preventDefault();act()};if(q&&first)a.classList.add("hit");first=false;li.appendChild(a);ul.appendChild(li)}
 $("pch").textContent=pt("go");}
$("pcq").oninput=index;
$("pcq").onkeydown=e=>{if(e.key==="Enter"){const h=$("pci").querySelector("a");if(h){e.preventDefault();h.click()}}};

 else{b.classList.remove("pc");b.innerHTML="&gt;_PrivateClient<small>powered by llm.store</small>"}}

/* ── the small æsymov: moves to what matters, training wheels for first-timers ── */
const TIPS={4:["tip_index",()=>$("pci").querySelector("a")],1:["tip_write",()=>$("tx")],2:["tip_review",()=>$("hold")],3:["tip_done",()=>$("rc")]};
let CUR=null;const seen=()=>{try{return JSON.parse(localStorage.getItem("pc_tw")||"{}")}catch(e){return{}}};
const mark=k=>{try{const s=seen();s[k]=1;localStorage.setItem("pc_tw",JSON.stringify(s))}catch(e){}};
function place(el){const st=$("st").getBoundingClientRect(),r=el.getBoundingClientRect(),bot=$("bot");
 let x=Math.min(st.width-52,Math.max(6,r.right-st.left-22)),y=r.top-st.top-56;if(y<56)y=r.bottom-st.top+6;y=Math.min(st.height-58,y);
 bot.style.transform=`translate(${x}px,${y}px)`;return{x,y,st}}
/* the face shows the real state: ae.face/0.1 moods */
function mood(m){const f=$("botf");if(f)f.mood=m}
function guide(n,force){const bot=$("bot"),tip=$("tip");tip.classList.remove("on");if(!ME||n===0){bot.classList.remove("on");return}
 bot.classList.add("on");const t=TIPS[n];if(!t){bot.style.transform="translate(8px,60px)";return}
 requestAnimationFrame(()=>{const el=t[1]();if(!el)return;const {x,y,st}=place(el);CUR=[n,t[0]];
  if(!force&&(seen()[t[0]]||seen().off))return;$("tipt").textContent=pt(t[0]);$("tipy").textContent=pt("ok");$("tiph").textContent=pt("hide");
  tip.classList.add("on");const w=tip.offsetWidth,h=tip.offsetHeight;let tx=Math.max(8,Math.min(st.width-w-8,x-w+40)),ty=y>st.height/2?y-h-6:y+56;tip.style.left=tx+"px";tip.style.top=Math.max(56,ty)+"px"})}
$("tipy").onclick=()=>{if(CUR)mark(CUR[1]);$("tip").classList.remove("on")};
$("tiph").onclick=()=>{mark("off");$("tip").classList.remove("on")};
$("bot").onclick=()=>{if($("tip").classList.contains("on")){$("tip").classList.remove("on");return}const n=[...document.querySelectorAll("section")].findIndex(s=>s.classList.contains("on"));guide(n,true)};
addEventListener("resize",()=>{const n=[...document.querySelectorAll("section")].findIndex(s=>s.classList.contains("on"));guide(n)});
paint();boot();

/* themes: 🌙 night · ☀️ day · 🤖 agent (ticker + nano teleprompter), shared with pc://terminal */
(function(){const $$=id=>document.getElementById(id),W=ms=>new Promise(r=>setTimeout(r,ms)),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const TH=["night","day","agent"],TI={night:"🌙",day:"☀️",agent:"🤖"};
function theme(t){document.documentElement.dataset.theme=t;$$("th").textContent=TI[t];$$("th").title=t;try{localStorage.setItem("pc_term_theme",t)}catch(e){}if(t==="agent")feed()}
$$("th").onclick=()=>theme(TH[(TH.indexOf(document.documentElement.dataset.theme)+1)%3]);
const txt=sel=>[...document.querySelectorAll(sel)].map(e=>e.textContent.trim()).filter(Boolean);
let run=0;async function feed(){
 const lines=[...txt("#s0 .sub"),...txt("#s0 .promise li"),...txt("#s0 .new p")];
 try{const g=await (await fetch("/guard",{cache:"no-store"})).json();lines.push("guard "+g.mood,"witness "+g.witness_head.slice(0,12)+"…",g.promise)}catch(e){}
 $$("tkr").textContent=lines.join("   ·   ")+"   ·   human stays root";
 if(run)return;run=1;const tp=$$("tp");
 while(document.documentElement.dataset.theme==="agent"){for(const l of lines){if(document.documentElement.dataset.theme!=="agent")break;
  if(RM){tp.textContent=l;await W(2500);continue}
  for(const w of l.split(/\s+/)){tp.textContent=w;await W(Math.min(420,180+w.length*22))}await W(500)}}
 run=0}
theme(localStorage.getItem("pc_term_theme")||(matchMedia("(prefers-color-scheme:light)").matches?"day":"night"));})();
