<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rtx:// asimov · WebGL</title>
<style>
  html,body{margin:0;padding:0;background:#050505;overflow:hidden}
  #stage{position:relative;width:720px;height:1280px;background:#050505}
  #view{position:absolute;left:0;top:92px;width:720px;height:720px;display:block}
  .bar{position:absolute;left:0;width:720px;box-sizing:border-box;
       font-family:Consolas,"JetBrains Mono",monospace}
  #hdr{top:0;height:92px;background:#D4AF37;color:#0b0a06;padding:14px 26px}
  #hdr b{font-size:30px;letter-spacing:.02em;display:block}
  #hdr span{font-size:19px;color:#3a3010}
  #hud{top:812px;height:468px;background:#0e0d08;border-top:5px solid #00aaff;
       padding:20px 26px;color:#fff6da}
  #hud .k{color:#c9b36a;font-size:17px;margin-bottom:12px}
  #hud .l{font-size:19px;line-height:1.6}
  #hud .f{position:absolute;bottom:18px;left:26px;color:#8a7a3f;font-size:17px}
  #banner{display:inline-block;background:#00aaff;color:#0b0a06;font-weight:bold;
          font-size:22px;padding:8px 16px;margin-bottom:12px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" width="720" height="720"></canvas>
  <div class="bar" id="hdr"><b id="title">rtx:// asimov</b><span id="tag">WEBGL · ANGLE D3D11 · RTX 3050</span></div>
  <div class="bar" id="hud">
    <div class="k" id="kick">REAL MENLO CAD · HARDWARE RASTER</div>
    <div id="banner">RTX://</div>
    <div class="l" id="lines"></div>
    <div class="f" id="foot">HUMAN://ROOT · Menlo Research CAD · zero OpenGL</div>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/webgpu":"./vendor/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const W = 720, VH = 720;
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W, VH, false);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 8; bgCanvas.height = 256;
const bx = bgCanvas.getContext('2d');
const grad = bx.createLinearGradient(0, 0, 0, 256);
grad.addColorStop(0, '#05070c'); grad.addColorStop(0.55, '#0b1220'); grad.addColorStop(1, '#141d2e');
bx.fillStyle = grad; bx.fillRect(0, 0, 8, 256);
const bgTex = new THREE.CanvasTexture(bgCanvas);
bgTex.colorSpace = THREE.SRGBColorSpace;
scene.background = bgTex;
scene.fog = new THREE.Fog(0x070a0f, 4.5, 11);

const camera = new THREE.PerspectiveCamera(45, W/VH, 0.05, 60);

// lighting: key + fill + rim, and a ground that catches shadow
const key = new THREE.DirectionalLight(0xfff0d0, 2.5);
key.position.set(2.4, -3.0, 4.2);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 14;
key.shadow.camera.left = -1.2; key.shadow.camera.right = 1.2;
key.shadow.camera.top = 2.2; key.shadow.camera.bottom = -0.4;
// Shadow acne: without a bias a surface self-shadows in a speckled black/white
// pattern that reads as shattered geometry. normalBias offsets along the normal
// and is the right fix for curved CAD; bias alone causes peter-panning.
key.shadow.bias = -0.00012;
key.shadow.normalBias = 0.012;
key.shadow.radius = 2;
scene.add(key);
// three-point: the key alone crushed the shadow side to black. Fill lifts it,
// rim separates the silhouette from the void, hemisphere gives sky/ground bounce.
const fill = new THREE.DirectionalLight(0x9fc4ff, 1.5); fill.position.set(-3.2, 1.6, 1.8); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xD4AF37, 2.0); rim.position.set(-1.2, 3.8, 2.6); scene.add(rim);
const back = new THREE.DirectionalLight(0x6f8cff, 0.8); back.position.set(-2.5, -2.0, 1.2); scene.add(back);
scene.add(new THREE.HemisphereLight(0x2a3a55, 0x0a0e16, 1.5));
scene.add(new THREE.AmbientLight(0x404860, 0.9));

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 24),
  new THREE.MeshStandardMaterial({color:0x0d1420, roughness:0.85, metalness:0.15}));
ground.receiveShadow = true;
scene.add(ground);
// GridHelper is built in the XZ plane (three.js is Y-up). This scene is Z-up,
// so an unrotated grid stands VERTICALLY through the robot — the "stray blue
// lines" were a wall of grid, not a geometry defect.
const grid = new THREE.GridHelper(24, 48, 0x16324a, 0x101e2e);
grid.rotation.x = Math.PI / 2;
grid.position.z = 0.002;
scene.add(grid);

const chassis = new THREE.MeshStandardMaterial({color:0xdcdfe6, roughness:0.42, metalness:0.55});
const headMat = new THREE.MeshStandardMaterial({color:0x00aaff, roughness:0.38, metalness:0.40,
                                                emissive:0x002438, emissiveIntensity:0.35});

// ---- URDF forward kinematics, identical to the Python harness ----
function rotEuler(rpy){
  const [x,y,z]=rpy;
  const Rx=new THREE.Matrix4().makeRotationX(x);
  const Ry=new THREE.Matrix4().makeRotationY(y);
  const Rz=new THREE.Matrix4().makeRotationZ(z);
  return Rz.multiply(Ry).multiply(Rx);
}
function axisRot(axis, ang){
  const v=new THREE.Vector3(...axis);
  if (v.length()<1e-9) return new THREE.Matrix4();
  return new THREE.Matrix4().makeRotationAxis(v.normalize(), ang);
}
const root = new THREE.Group(); scene.add(root);
const groups = {};      // link name -> THREE.Group holding its mesh
let JOINTS = [], LINKS = {};

async function load(){
  const man = await (await fetch('./scene/manifest.json')).json();
  JOINTS = man.joints; LINKS = man.links;
  const names = Object.keys(man.links);
  await Promise.all(names.map(async n => {
    const buf = await (await fetch('./scene/' + man.links[n].bin)).arrayBuffer();
    const f = new Float32Array(buf);
    const count = f.length / 6;
    const pos = new Float32Array(count*3), nor = new Float32Array(count*3);
    for (let i=0;i<count;i++){
      pos[i*3]=f[i*6]; pos[i*3+1]=f[i*6+1]; pos[i*3+2]=f[i*6+2];
      nor[i*3]=f[i*6+3]; nor[i*3+1]=f[i*6+4]; nor[i*3+2]=f[i*6+5];
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor,3));
    g.computeBoundingSphere();
    const mesh = new THREE.Mesh(g, n==='neck_pitch_link' ? headMat : chassis);
    mesh.castShadow = true; mesh.receiveShadow = true;
    const grp = new THREE.Group(); grp.add(mesh);
    groups[n] = grp; root.add(grp);
  }));
  // measure AFTER applying a pose — before pose() every group is identity and
  // all 26 meshes overlap at the origin, giving a box half the true height.
  pose(0);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  // The URDF root (pelvis) is at the origin, so the legs extend to NEGATIVE z.
  // A ground plane at z=0 therefore slices the robot in half. Lift the whole
  // rig so the feet rest on the floor, then measure again.
  window.__lift = -box.min.z;
  root.position.z = window.__lift;
  root.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(root);
  window.__box = {min: box2.min.toArray(), max: box2.max.toArray()};
  window.__ready = true;
  document.getElementById('lines').innerHTML =
    `${names.length} CAD links · ${JOINTS.length} joints<br>` +
    `${man.total_vertices.toLocaleString()} vertices<br>` +
    `hardware raster · ANGLE D3D11 · shadows on`;
}

function pose(tt){
  const ang = {};
  for (const j of JOINTS){
    const n = j.name;
    if (n.includes('knee')) ang[n]=0.22*Math.sin(tt*1.9);
    else if (n.includes('ankle_pitch')) ang[n]=-0.12*Math.sin(tt*1.9);
    else if (n.includes('hip_pitch')) ang[n]=0.10*Math.sin(tt*1.9+0.6);
    else if (n.includes('shoulder_pitch')) ang[n]=0.30*Math.sin(tt*1.5+1.0);
    else if (n.includes('elbow')) ang[n]=0.25*Math.sin(tt*1.5+2.0);
    else if (n.includes('waist_yaw')) ang[n]=0.14*Math.sin(tt*0.9);
    else if (n.includes('neck_yaw')) ang[n]=0.34*Math.sin(tt*1.2);
    else if (n.includes('neck_pitch')) ang[n]=0.12*Math.sin(tt*1.6);
    else ang[n]=0;
  }
  // walk parent -> child, composing local matrices
  const xf = {pelvis_link: new THREE.Matrix4()};
  for (let pass=0; pass<8; pass++){
    for (const j of JOINTS){
      if (xf[j.parent] && !xf[j.child]){
        const m = new THREE.Matrix4();
        m.multiplyMatrices(rotEuler(j.rpy), axisRot(j.axis||[0,0,1], ang[j.name]||0));
        m.setPosition(new THREE.Vector3(...j.xyz));
        xf[j.child] = new THREE.Matrix4().multiplyMatrices(xf[j.parent], m);
      }
    }
  }
  for (const n in groups){
    if (!xf[n]) continue;
    groups[n].matrix.copy(xf[n]);
    groups[n].matrixAutoUpdate = false;
    groups[n].matrixWorldNeedsUpdate = true;
  }
  root.rotation.z = 0.10*Math.sin(tt*0.7);
  root.position.z = (window.__lift || 0) + 0.03*Math.sin(tt*1.9);
}

const SCENES = [
  {k:'REAL MENLO CAD · HARDWARE RASTER', b:'RTX://', l:['26 links · 25 joints','ANGLE Direct3D11 on the RTX 3050']},
  {k:'NO OPENGL · NO SOFTWARE RASTER', b:'WEBGL', l:['the browser reaches the discrete GPU','one flag: --force_high_performance_gpu']},
  {k:'SHADOWS · LIGHTING · MSAA', b:'HARDWARE', l:['the fixed-function pipeline','not a hand-written kernel']},
  {k:'SAME CAD · SAME KINEMATICS', b:'DETERMINISTIC', l:['URDF forward kinematics in JS','frame index drives the pose']},
  {k:'YOURS TO RUN', b:'#OSWROBOTICS', l:['three.js vendored · zero CDN','nine by sixteen · the shape you hold']},
];

window.__renderFrame = function(i, total){
  window.__capturing = true;
  window.asimov._live = false;
  const secs = 10.0, fps = 24;
  const tt = i / fps;
  pose(tt);
  const s = SCENES[Math.min(SCENES.length-1, Math.floor(i / Math.max(1,total/SCENES.length)))];
  document.getElementById('kick').textContent = s.k;
  document.getElementById('banner').textContent = s.b;
  document.getElementById('lines').innerHTML = s.l.join('<br>');
  const b = window.__box;
  const cz = (b.min[2]+b.max[2])/2, span = b.max[2]-b.min[2];
  const dist = span*1.55;
  const az = 0.34*Math.sin(tt*0.55);
  camera.position.set(dist*Math.cos(az), dist*Math.sin(az), cz+0.15+0.10*Math.sin(tt*0.8));
  camera.up.set(0,0,1);
  camera.lookAt(0,0,cz);
  renderer.render(scene, camera);
  return true;
};

// ── the companion surface ────────────────────────────────────────────────
// Hermes drives this robot the way it drives any other tool: a governed
// address, an explicit state, and a receipt. The film capture path
// (__renderFrame) is a BYPRODUCT of the live surface, not its purpose.
//
//   asimov://state    observe        -> always allowed
//   asimov://pose     plan           -> allowed, it is only a picture
//   asimov://move     real hardware  -> REFUSED here, needs HUMAN://ROOT
window.asimov = {
  _state: 'IDLE',
  _speaker: null,
  _t: 0,
  _live: true,
  _grants: false,
  _log: [],

  // read-only: what the robot is, never what it may do
  status(){
    return {scheme:'asimov://', authority:'HUMAN://ROOT', live:this._live,
            state:this._state, speaker:this._speaker, t:this._t,
            links:Object.keys(groups).length, joints:JOINTS.length,
            grants:false, hardware:false,
            renderer:(()=>{const gl=renderer.getContext();
              const d=gl.getExtension('WEBGL_debug_renderer_info');
              return d?gl.getParameter(d.UNMASKED_RENDERER_WEBGL):'';})(),
            note:'a browser companion. No physical robot is attached.'};
  },

  // a pose is a PICTURE of motion, not motion. Allowed, receipted.
  pose(t){
    this._t = Number(t)||0;
    pose(this._t);
    const b=window.__box, cz=(b.min[2]+b.max[2])/2, span=b.max[2]-b.min[2];
    const dist=span*1.55, az=0.34*Math.sin(this._t*0.55);
    camera.position.set(dist*Math.cos(az), dist*Math.sin(az), cz+0.15+0.10*Math.sin(this._t*0.8));
    camera.up.set(0,0,1); camera.lookAt(0,0,cz);
    renderer.render(scene,camera);
    this._log.push({act:'pose', t:this._t, at:Date.now()});
    return {ok:true, acted:'pose', executed:false, grants:false,
            reason:'a rendered pose is not a motion'};
  },

  setState(s, speaker){
    const ALLOWED=['IDLE','LISTENING','SPEAKING','THINKING',
                   'AWAITING_APPROVAL','APPROVED','REFUSED','ERROR'];
    if(!ALLOWED.includes(s)) return {ok:false, refused:true, reason:'unknown state', allowed:ALLOWED};
    this._state=s; this._speaker=speaker||null;
    const COL={IDLE:0x96969b, LISTENING:0x00ccff, SPEAKING:0x00ff9f,
               THINKING:0x85e9fc, AWAITING_APPROVAL:0xD4AF37,
               APPROVED:0x00ff9f, REFUSED:0xff00ff, ERROR:0xff3b47};
    headMat.color.setHex(COL[s]);
    headMat.emissive.setHex(COL[s]); headMat.emissiveIntensity=0.22;
    document.getElementById('banner').textContent=s;
    document.getElementById('banner').style.background='#'+COL[s].toString(16).padStart(6,'0');
    document.getElementById('kick').textContent=(speaker?speaker.toUpperCase()+' · ':'')+s;
    this.pose(this._t);
    this._log.push({act:'state', state:s, at:Date.now()});
    return {ok:true, state:s, speaker:this._speaker, grants:false};
  },

  say(lines){
    document.getElementById('lines').innerHTML=(Array.isArray(lines)?lines:[lines]).join('<br>');
    this.pose(this._t);
    return {ok:true, shown:true};
  },

  // the gate. An agent asking a browser robot to MOVE is refused, always.
  move(){
    this._log.push({act:'move', refused:true, at:Date.now()});
    return {ok:false, refused:true, decision:'require_approval',
            rules:['ACT-001','AUTH-002'], allowed:false, executed:false, grants:false,
            authority:'HUMAN://ROOT',
            reason:'no physical robot is attached, and a browser surface cannot grant motion'};
  },

  ledger(){ return {count:this._log.length, entries:this._log.slice(-20)}; },

  // ── awareness ──────────────────────────────────────────────────────────
  // observe is always allowed. The robot perceives the machine it runs on:
  // GPU load, memory, receipts, renders. It REACTS — a hot GPU changes its
  // expression — but perception never becomes permission.
  env: null,
  _envFail: 0,

  async perceive(){
    try {
      const r = await fetch('http://127.0.0.1:8162/env', {cache:'no-store'});
      this.env = await r.json();
      this._envFail = 0;
      this._react();
      return {ok:true, at:this.env.at};
    } catch(e){
      this._envFail++;
      this.env = {available:false, reason:String(e).slice(0,80)};
      return {ok:false, refused:false, reason:'perception source unreachable'};
    }
  },

  _react(){
    const e = this.env; if (!e || !e.gpu) return;
    const g = e.gpu, m = e.memory || {};
    // the robot's expression follows the machine, not a script
    let mood = 'IDLE';
    if (g.available && g.util_pct > 60) mood = 'THINKING';
    else if (g.available && g.temp_c > 75) mood = 'ERROR';
    else if (m.load_pct > 85) mood = 'AWAITING_APPROVAL';
    else if (this._state === 'IDLE') mood = 'LISTENING';
    if (mood !== this._state && this._state !== 'SPEAKING') this.setState(mood, 'asimov-agent');

    const bits = [];
    if (g.available) bits.push(`${g.name.replace('NVIDIA GeForce ','')} · ${g.util_pct}% · ${g.temp_c}°C · ${g.pstate}`);
    if (m.available) bits.push(`RAM ${m.load_pct}% · ${m.free_gb} GB free · ${e.host.cpus} threads`);
    const L = e.ledgers || {};
    const total = Object.values(L).reduce((a,b)=>a+b,0);
    bits.push(`${total} receipts · ${(e.films||{}).published||0} films published`);
    const R = ((e.renders||{}).recent||[])[0];
    if (R) bits.push(`last render ${R.job} · ${R.state} · ${R.gate||'—'}`);
    document.getElementById('lines').innerHTML = bits.join('<br>');
    document.getElementById('kick').textContent =
      `AWARE · ${e.host.node} · ${new Date(e.at).toLocaleTimeString()}`;
  }
};

// live idle loop — the companion is present even when no agent is driving it
function tick(){
  if (window.asimov._live && !window.__capturing){
    window.asimov._t += 1/24;
    window.asimov.pose(window.asimov._t);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// boot perception ONCE, outside the frame loop
window.asimov.perceive();
setInterval(() => window.asimov.perceive(), 4000);

window.__info = () => {
  const gl = renderer.getContext();
  const d = gl.getExtension('WEBGL_debug_renderer_info');
  return {renderer: d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : '',
          links: Object.keys(groups).length, box: window.__box};
};

load();
</script>
</body>
</html>
