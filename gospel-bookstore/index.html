<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gospel Bookstore — Librería Cristiana para EEUU y LATAM</title>
<style>
:root{--void:#050505;--gold:#D4AF37;--neon:#00ff9d;--ink:#e8e6df;--muted:#6f6a5c;--frame:#1a1a1a;--line:rgba(212,175,55,.15)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--void);color:var(--ink);font-family:Consolas,monospace;font-size:14px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(90deg,rgba(212,175,55,.02) 0 1px,transparent 1px 3px);opacity:.4}
.stage{position:relative;width:100vw;height:100vh;max-width:562.5vh;max-height:100vh;margin:0 auto;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:10px 8px;border-bottom:1px solid var(--line);z-index:50}
.logo{font-weight:700;font-size:11px;color:var(--gold);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{flex:1;min-width:50px;width:100%;padding:8px 8px;background:var(--frame);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:inherit;font-size:13px}
.cart-btn{background:var(--gold);color:var(--void);border:none;border-radius:8px;padding:8px 9px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;line-height:1}
.cart-badge{background:var(--neon);color:var(--void);font-size:11px;font-weight:700;border-radius:50%;padding:2px 5px;margin-left:4px}
.cats{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--line);z-index:50}
.cat{white-space:nowrap;padding:6px 14px;border:1px solid var(--line);border-radius:20px;background:var(--frame);color:var(--muted);cursor:pointer;font-size:12px;transition:all .2s}
.cat.active,.cat:hover{color:var(--gold);border-color:var(--gold)}
.grid{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start}
.card{background:var(--frame);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:all .2s;display:flex;flex-direction:column}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.card-body{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.card-title{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3}
.card-author{font-size:11px;color:var(--muted)}
.card-price{font-size:14px;font-weight:700;color:var(--gold);margin-top:auto}
.add-btn{background:var(--gold);color:var(--void);border:none;border-radius:8px;padding:8px;font-weight:700;cursor:pointer;font-size:12px;margin-top:6px}
.add-btn:hover{background:var(--neon)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--frame);border:1px solid var(--gold);border-radius:20px 20px 0 0;width:100%;max-width:562.5px;max-height:80vh;display:flex;flex-direction:column;padding:20px}
.sheet h2{color:var(--gold);margin-bottom:14px;font-size:18px}
.sheet-items{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.sheet-item{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.sheet-item img{width:50px;height:70px;object-fit:cover;border-radius:6px}
.sheet-item-info{flex:1}
.sheet-item-name{font-size:12px;font-weight:700}
.sheet-item-price{font-size:13px;color:var(--gold)}
.qty{display:flex;gap:6px;align-items:center}
.qty button{background:var(--void);border:1px solid var(--line);color:var(--ink);width:24px;height:24px;border-radius:6px;cursor:pointer}
.rm{background:none;border:none;color:#e05555;cursor:pointer;font-size:14px}
.checkout-btn{background:var(--gold);color:var(--void);border:none;border-radius:10px;padding:14px;font-weight:800;font-size:14px;cursor:pointer;width:100%;margin-top:12px}
.checkout-btn:hover{background:var(--neon)}
.link-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:12px;cursor:pointer;width:100%;margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:40px}
#ticker{position:absolute;bottom:0;left:0;width:100%;background:linear-gradient(transparent 60%,var(--frame));font-size:11px;color:var(--muted);text-align:center;z-index:99;padding:8px;min-height:2.5em;display:flex;align-items:center;justify-content:center}
.ref{color:var(--gold);font-weight:700}
#qr{width:44px;height:44px;border:1px solid var(--gold);border-radius:6px;background:var(--void);position:fixed;bottom:12px;right:12px;cursor:pointer;z-index:1000;padding:3px}
#qr img{width:100%;height:100%;object-fit:contain;border-radius:3px}
.checkout-form{display:flex;flex-direction:column;gap:12px}
.checkout-form input,.checkout-form select{background:var(--void);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font-family:inherit;font-size:13px}
.checkout-form label{font-size:12px;color:var(--muted)}
.order-confirm{text-align:center;padding:30px}
.order-confirm .check{font-size:48px;color:var(--neon);margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.total{font-size:18px;font-weight:700;color:var(--gold);margin:14px 0}
</style>
</head>
<body>
<div class="stage">
<header>
  <div class="logo">✝️ GOSPEL</div>
  <input class="search" id="search" placeholder="Buscar libros, autores, temas..." oninput="renderGrid()">
  
</header>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div id="ticker"><span class="ref">Cargando...</span></div>
<button class="cart-btn" onclick="openCart()" style="position:fixed;top:10px;right:10px;z-index:300;box-shadow:0 2px 8px rgba(0,0,0,.5)">🛒<span class="cart-badge" id="cartCount">0</span></button>
<div id="qr" title="Verificar"><img alt="QR" src="qr.png"></div>
<div id="plugins-section">
  <div id="latex-widget"></div>
  <div id="teologia-widget"></div>
  <div id="aeqr-widget"></div>
  <div id="canvas-widget"></div>
</div>
</div>
<!-- Widget Scripts -->
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="plugins/latex/index.js"></script>
<script src="plugins/teologia-ai/index.js"></script>
<script src="plugins/aeqr-badge/index.js"></script>
<script src="plugins/studio-canvas/index.js"></script>
<script>
// Initialize widgets
setTimeout(() => {
  // LaTeX Widget
  ReactDOM.createRoot(document.getElementById('latex-widget')).render(
    React.createElement(LæTæXWidget, { expression: '∫₀¹ x² dx' })
  );
  
  // Teologia AI Widget
  ReactDOM.createRoot(document.getElementById('teologia-widget')).render(
    React.createElement(TeologiaWidget, { 
      text: 'La justificación por la fe es el don de Dios...',
      author: 'Luther',
      year: 1517
    })
  );
  
  // æQR Badge Widget
  ReactDOM.createRoot(document.getElementById('aeqr-widget')).render(
    React.createElement(AeQrWidget, { data: 'æqr://gospel-bookstore/verify' })
  );
  
  // Studio Canvas Widget
  ReactDOM.createRoot(document.getElementById('canvas-widget')).render(
    React.createElement(StudioCanvasWidget, { scene: 'gospel-stage' })
  );
}, 500);
</script>
<style>
#plugins-section {
  position: fixed;
  bottom: 64px;
  left: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 99;
}
#latex-widget, #teologia-widget, #aeqr-widget, #canvas-widget {
  min-width: 280px;
}
</style>
<div class="overlay" id="cartOverlay" onclick="if(event.target===this)closeCart()">
  <div class="sheet">
    <h2>🛒 Tu Carrito</h2>
    <div class="sheet-items" id="cartItems"></div>
    <div class="total" id="cartTotal">Total: $0.00</div>
    <button class="checkout-btn" onclick="openCheckout()">Finalizar Compra →</button>
  </div>
</div>
<div class="overlay" id="checkoutOverlay" onclick="if(event.target===this)closeCheckout()">
  <div class="sheet" id="checkoutContent"></div>
</div>
<script>
(function(){'use strict';
var PRODUCTS=[{"id":"1","name":"Santa Biblia Reina-Valera 1960","cat":"Biblias","author":"Reina-Valera","price":24.99,"img":"covers/1.svg"},{"id":"2","name":"Biblia de Estudio MACARTHUR","cat":"Biblias","author":"John MacArthur","price":54.99,"img":"covers/2.svg"},{"id":"3","name":"El Progreso del Peregrino","cat":"Clásicos","author":"John Bunyan","price":12.99,"img":"covers/3.svg"},{"id":"4","name":"Cartas del Diablo a su Sobrino","cat":"Ficción","author":"C.S. Lewis","price":14.99,"img":"covers/4.svg"},{"id":"5","name":"Mero Cristianismo","cat":"Apologética","author":"C.S. Lewis","price":15.99,"img":"covers/5.svg"},{"id":"6","name":"Una Vida con Propósito","cat":"Devocionales","author":"Rick Warren","price":18.99,"img":"covers/6.svg"},{"id":"7","name":"El Padre Nuestro","cat":"Devocionales","author":"César Castellanos","price":11.99,"img":"covers/7.svg"},{"id":"8","name":"La Imitación de Cristo","cat":"Clásicos","author":"Tomás de Kempis","price":13.99,"img":"covers/8.svg"},{"id":"9","name":"Fuego Extraño","cat":"Teología","author":"John MacArthur","price":17.99,"img":"covers/9.svg"},{"id":"10","name":"Cuando Dios Escribe Tu Historia","cat":"Superación","author":"Max Lucado","price":16.99,"img":"covers/10.svg"}];
var CATS=["Todos","Biblias","Clásicos","Ficción","Apologética","Superación","Devocionales","Teología"];
var VERSES=[{ref:'Juan 3:16',text:'Porque de tal manera amó Dios al mundo...'},{ref:'Salmos 23:1',text:'Jehová es mi pastor; nada me faltará.'},{ref:'Filipenses 4:13',text:'Todo lo puedo en Cristo que me fortalece.'},{ref:'Romanos 8:28',text:'Y sabemos que a los que aman a Dios, todas las cosas les ayudan a bien.'}];
var cart=JSON.parse(localStorage.getItem('gb_cart')||'[]');
var activeCat="Todos";
function saveCart(){localStorage.setItem('gb_cart',JSON.stringify(cart))}
function getCount(){return cart.reduce(function(s,i){return s+i.qty},0)}
function getTotal(){return cart.reduce(function(s,i){return s+i.qty*i.price},0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderCats(){var el=document.getElementById('cats');el.innerHTML=CATS.map(function(c){return '<div class="cat'+(c===activeCat?' active':'')+'" onclick="setCat(\''+c+'\')">'+c+'</div>'}).join('');}
function setCat(c){activeCat=c;renderCats();renderGrid()}
function renderGrid(){var q=document.getElementById('search').value.toLowerCase();var items=PRODUCTS.filter(function(p){return (activeCat==="Todos"||p.cat===activeCat)&&(!q||p.name.toLowerCase().indexOf(q)>=0||p.author.toLowerCase().indexOf(q)>=0||p.cat.toLowerCase().indexOf(q)>=0)});var grid=document.getElementById('grid');if(!items.length){grid.innerHTML='<div class="empty">No se encontraron productos.</div>';return}grid.innerHTML=items.map(function(p){return '<div class="card"><img src="'+p.img+'" alt="'+esc(p.name)+'"><div class="card-body"><div class="card-title">'+esc(p.name)+'</div><div class="card-author">'+esc(p.author)+'</div><div class="card-price">$'+p.price.toFixed(2)+'</div><button class="add-btn" onclick="addCart(\''+p.id+'\')">Agregar</button></div></div>'}).join('');}
function addCart(id){var p=PRODUCTS.find(function(x){return x.id===id});var ex=cart.find(function(x){return x.id===id});if(ex){ex.qty++}else{cart.push({id:id,name:p.name,price:p.price,img:p.img,qty:1})}saveCart();updateBadge();var btn=event.target;btn.textContent='✓ Agregado';setTimeout(function(){btn.textContent='Agregar'},800);}
function updateBadge(){document.getElementById('cartCount').textContent=getCount()}
function openCart(){var o=document.getElementById('cartOverlay');var it=document.getElementById('cartItems');it.innerHTML=cart.length?cart.map(function(i){return '<div class="sheet-item"><img src="'+i.img+'"><div class="sheet-item-info"><div class="sheet-item-name">'+esc(i.name)+'</div><div class="sheet-item-price">$'+i.price.toFixed(2)+'</div></div><div class="qty"><button onclick="chQty(\''+i.id+'\',-1)">−</button><span>'+i.qty+'</span><button onclick="chQty(\''+i.id+'\',1)">+</button></div><button onclick="rmItem(\''+i.id+'\')" class="rm">✕</button></div>'}).join(''):'<div class="empty">Tu carrito está vacío.</div>';document.getElementById('cartTotal').textContent='Total: $'+getTotal().toFixed(2);o.classList.add('open');}
function closeCart(){document.getElementById('cartOverlay').classList.remove('open')}
function chQty(id,d){var it=cart.find(function(x){return x.id===id});if(!it)return;it.qty+=d;if(it.qty<=0)cart=cart.filter(function(x){return x.id!==id});saveCart();updateBadge();openCart();}
function rmItem(id){cart=cart.filter(function(x){return x.id!==id});saveCart();updateBadge();openCart();}
function openCheckout(){closeCart();var c=document.getElementById('checkoutContent');c.innerHTML='<h2>Finalizar Compra</h2><div class="checkout-form"><label>Nombre completo</label><input id="co-name" placeholder="Tu nombre"><label>Email</label><input id="co-email" type="email" placeholder="tu@email.com"><label>Dirección</label><input id="co-addr" placeholder="Calle, número, ciudad"><label>País</label><select id="co-country"><option>Estados Unidos</option><option>México</option><option>Colombia</option><option>Argentina</option><option>España</option><option>Chile</option><option>Perú</option></select><label>Método de pago</label><select id="co-pay"><option>Tarjeta (Stripe)</option><option>PayPal</option><option>Transferencia</option></select><div class="total">Total: $'+getTotal().toFixed(2)+'</div><button class="checkout-btn" onclick="placeOrder()">Confirmar Pedido ✓</button><button onclick="closeCheckout()" class="link-btn">Volver</button></div>';document.getElementById('checkoutOverlay').classList.add('open');}
function closeCheckout(){document.getElementById('checkoutOverlay').classList.remove('open')}
function placeOrder(){var name=document.getElementById('co-name').value.trim();var email=document.getElementById('co-email').value.trim();if(!name||!email){alert('Por favor completa nombre y email.');return}var oid='GB-'+Date.now().toString(36).toUpperCase();document.getElementById('checkoutContent').innerHTML='<div class="order-confirm"><div class="check">✓</div><h2>¡Pedido Confirmado!</h2><p class="muted">Gracias, '+esc(name)+'. Tu pedido <strong>'+oid+'</strong> ha sido recibido.</p><p class="muted small">Te enviaremos la confirmación a '+esc(email)+'</p><p class="muted small">Envío estándar: 3-5 días hábiles.<br>Devoluciones dentro de 30 días.</p><button class="checkout-btn" onclick="closeCheckout();cart=[];saveCart();updateBadge();renderGrid()">Seguir Explorando</button></div>';cart=[];saveCart();updateBadge();}
var vi=0;function rotateVerse(){var v=VERSES[vi];document.getElementById('ticker').innerHTML='<span>'+v.text+'</span> — <span class="ref">'+v.ref+'</span>';vi=(vi+1)%VERSES.length}
setInterval(rotateVerse,8000);rotateVerse();renderCats();renderGrid();updateBadge();
})();
</script>
</body>
</html>
