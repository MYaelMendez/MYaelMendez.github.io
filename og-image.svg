<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#050505"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- neural mesh -->
  <g stroke="#D4AF37" stroke-width="1" opacity="0.20">
    <path d="M120 120 L300 210 L210 360 L380 470 L540 330 L470 180 L650 120 L760 300 L930 240 L1050 400 L880 500 L700 420 L560 540 L400 560 L240 480"/>
    <path d="M300 210 L470 180 M210 360 L380 470 M540 330 L650 120 M760 300 L930 240 M470 180 L540 330 M650 120 L760 300 M880 500 L1050 400"/>
    <path d="M120 120 L470 180 M380 470 L700 420 M560 540 L930 240"/>
  </g>
  <g fill="#D4AF37" opacity="0.55">
    <circle cx="120" cy="120" r="4"/><circle cx="300" cy="210" r="5"/><circle cx="210" cy="360" r="4"/>
    <circle cx="380" cy="470" r="5"/><circle cx="540" cy="330" r="6"/><circle cx="470" cy="180" r="4"/>
    <circle cx="650" cy="120" r="5"/><circle cx="760" cy="300" r="6"/><circle cx="930" cy="240" r="4"/>
    <circle cx="1050" cy="400" r="5"/><circle cx="880" cy="500" r="4"/><circle cx="700" cy="420" r="5"/>
    <circle cx="560" cy="540" r="4"/><circle cx="400" cy="560" r="4"/><circle cx="240" cy="480" r="5"/>
  </g>

  <!-- rings around the glyph -->
  <g fill="none" stroke="#D4AF37" opacity="0.30">
    <circle cx="600" cy="288" r="118" stroke-width="2"/>
    <circle cx="600" cy="288" r="152" stroke-width="1" stroke-dasharray="6 10"/>
  </g>

  <!-- glyph -->
  <circle cx="600" cy="288" r="74" fill="#050505" stroke="#D4AF37" stroke-width="3"/>
  <text x="600" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="104"
        font-weight="700" fill="#D4AF37" text-anchor="middle" dominant-baseline="central">&#230;</text>

  <!-- wordmark -->
  <text x="600" y="452" font-family="'JetBrains Mono', Consolas, monospace" font-size="52"
        font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="2">&gt;_&#230;://</text>

  <text x="600" y="502" font-family="'JetBrains Mono', Consolas, monospace" font-size="21"
        fill="#e8e6df" opacity="0.78" text-anchor="middle" letter-spacing="7">SOVEREIGN AGENTIC HOMEBASE</text>

  <text x="600" y="548" font-family="'JetBrains Mono', Consolas, monospace" font-size="17"
        fill="#00ff9d" opacity="0.80" text-anchor="middle" letter-spacing="3">MESH · FLEET · CUDA · SECRETS · ZERO CLOUD RENT</text>

  <text x="600" y="592" font-family="'JetBrains Mono', Consolas, monospace" font-size="14"
        fill="#D4AF37" opacity="0.55" text-anchor="middle" letter-spacing="4">myaelmendez.github.io</text>

  <!-- top rule -->
  <rect x="0" y="0" width="1200" height="3" fill="#D4AF37" opacity="0.85"/>
  <rect x="0" y="627" width="1200" height="3" fill="#D4AF37" opacity="0.30"/>

  <rect width="1200" height="630" fill="url(#scan)"/>
