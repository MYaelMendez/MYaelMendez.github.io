<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080">
<title>cri-index</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#050505;color:#D4AF37;font-family:'JetBrains Mono','Consolas',monospace}
  #root{position:relative;width:100%;height:100%}
  .scanlines{position:absolute;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.20) 3px,rgba(0,0,0,.20) 4px)}
  .header{position:absolute;top:0;left:0;right:0;height:60px;display:flex;align-items:center;padding:0 40px;border-bottom:1px solid rgba(212,175,55,.3);z-index:10}
  .header h1{font-size:24px;font-weight:600;letter-spacing:2px}
  .header .tag{position:absolute;right:40px;font-size:14px;opacity:.5}
  .cri-grid{position:absolute;top:80px;left:40px;right:40px;bottom:80px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-content:start}
  .cri-card{background:rgba(212,175,55,.04);border:1px solid rgba(212,175,55,.15);padding:16px}
  .cri-card h3{font-size:13px;font-weight:600;margin-bottom:8px;opacity:.7;letter-spacing:1px}
  .cri-bar{height:6px;background:rgba(212,175,55,.1);border-radius:3px;margin-top:8px;overflow:hidden}
  .cri-fill{height:100%;border-radius:3px}
  .cri-val{font-size:22px;font-weight:700;margin-top:4px}
  .telemetry{position:absolute;bottom:0;left:0;right:0;height:40px;display:flex;align-items:center;padding:0 40px;border-top:1px solid rgba(212,175,55,.15);font-size:11px;opacity:.4;gap:30px}
  .telemetry .dot{width:6px;height:6px;border-radius:50%;background:#00eaa0;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .progress-bar{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,#D4AF37,#00eaff);z-index:20}
</style>
</head>
<body>
<div id="root">
  <div class="progress-bar" id="progress" style="width:0%"></div>
  <div class="header">
    <h1>cri-index</h1>
    <span class="tag">consumer redline · observation</span>
  </div>
  <div class="cri-grid" id="grid"></div>
  <div class="telemetry">
    <span><span class="dot"></span>sovereign</span>
    <span id="count"></span>
    <span id="receipt"></span>
    <span style="margin-left:auto" id="clock"></span>
  </div>
  <div class="scanlines"></div>
</div>
<script>
(function(){
  var indices=[
    {name:"price",val:87.3,max:100,color:"#00eaa0"},
    {name:"quality",val:92.1,max:100,color:"#00eaa0"},
    {name:"availability",val:64.5,max:100,color:"#D4AF37"},
    {name:"sovereignty",val:95.0,max:100,color:"#00eaa0"},
    {name:"determinism",val:88.7,max:100,color:"#00eaa0"},
    {name:"receipt",val:100.0,max:100,color:"#00eaa0"},
  ];
  var grid=document.getElementById('grid');
  grid.innerHTML=indices.map(function(c){
    return '<div class="cri-card"><h3>'+c.name+'</h3><div class="cri-val" style="color:'+c.color+'">'+c.val+'</div><div class="cri-bar"><div class="cri-fill" style="width:'+(c.val/c.max*100)+'%;background:'+c.color+'"></div></div></div>';
  }).join('');

  var total=indices.length;var done=0;
  function tick(){done=Math.min(done+1,total);document.getElementById('progress').style.width=(done/total*100)+'%';if(done<total) requestAnimationFrame(tick)}
  requestAnimationFrame(tick);
  var ts=Math.floor(Date.now()/1000);
  var payload=JSON.stringify({action:'cri-index',ts:ts,count:total});
  var hash=Array.prototype.reduce.call(payload,function(a,b){a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
  document.getElementById('receipt').textContent='sha256:'+(hash>>>0).toString(16).padStart(8,'0');
  document.getElementById('count').textContent=total+' indices';
  document.getElementById('clock').textContent=new Date().toISOString();
})();
</script>
</body>
</html>
