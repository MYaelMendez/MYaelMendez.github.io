<style>

<script
src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js">

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";


/* =====================================================
   DNA

   This is the organism.
===================================================== */

const DNA =
"https://portal.nousresearch.com/r/grandesmodelosdelenguaje-prompti";


/* =====================================================
   DOM
===================================================== */

const host =
document.getElementById(
  "ae-store-widget"
);

const canvas =
document.getElementById(
  "ae-three"
);

const eText =
document.getElementById(
  "energy"
);

const tText =
document.getElementById(
  "tau"
);

const phase =
document.getElementById(
  "ae-phase"
);

const portal =
document.getElementById(
  "ae-portal"
);

const qrLink =
document.getElementById(
  "ae-qr-link"
);


portal.href =
DNA;

qrLink.href =
DNA;

document
.getElementById(
  "ae-dna"
)
.textContent =
"DNA://" + DNA;


/* =====================================================
   SHA-256 IDENTITY
===================================================== */

async function sha256(text){

  const bytes =
  new TextEncoder()
  .encode(text);


  const digest =
  await crypto.subtle.digest(
    "SHA-256",
    bytes
  );


  return [
    ...new Uint8Array(
      digest
    )
  ]

  .map(
    b =>
      b.toString(16)
       .padStart(2,"0")
  )

  .join("");

}


const HASH =
await sha256(DNA);


/* =====================================================
   DNA → DETERMINISTIC RANDOMNESS

   Same DNA = same body.
===================================================== */

function seedFromHash(hash){

  return parseInt(
    hash.slice(0,8),
    16
  ) >>> 0;

}


function mulberry32(seed){

  return function(){

    let t =
    seed +=
    0x6D2B79F5;


    t =
    Math.imul(
      t ^ t >>> 15,
      t | 1
    );


    t ^=
    t +
    Math.imul(
      t ^ t >>> 7,
      t | 61
    );


    return (

      (
        t ^
        t >>> 14
      ) >>> 0

    ) / 4294967296;

  };

}


const rand =
mulberry32(
  seedFromHash(HASH)
);


/* =====================================================
   DNA → QR → SVG
===================================================== */

function buildQR(dna){

  const qr =
  qrcode(
    0,
    "M"
  );


  qr.addData(
    dna
  );


  qr.make();


  const N =
  qr.getModuleCount();


  const QUIET =
  4;


  const TOTAL =
  N +
  QUIET * 2;


  let d =
  "";


  for(
    let y=0;
    y<N;
    y++
  ){

    let start =
    -1;


    for(
      let x=0;
      x<=N;
      x++
    ){

      const dark =

      x < N &&

      qr.isDark(
        y,
        x
      );


      if(
        dark &&
        start < 0
      ){

        start =
        x;

      }


      if(
        !dark &&
        start >= 0
      ){

        const run =
        x - start;


        d +=

        `M${start+QUIET} ${y+QUIET}` +

        `h${run}` +

        `v1` +

        `h-${run}` +

        `z`;


        start =
        -1;

      }

    }

  }


  return `

<svg
 xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 ${TOTAL} ${TOTAL}"
 preserveAspectRatio="xMidYMid meet"
 shape-rendering="crispEdges"
 data-dna="${dna}">

 <metadata>
  DNA=${dna};
  ID=sha256:${HASH};
  MATRIX=${N}x${N};
  EC=M;
  QUIET=${QUIET};
 </metadata>

 <rect
  width="${TOTAL}"
  height="${TOTAL}"
  fill="#fff"/>

 <path
  d="${d}"
  fill="#000"/>

</svg>

`.trim();

}


document
.getElementById(
  "ae-qr"
)
.innerHTML =
buildQR(DNA);


/* =====================================================
   THREE.JS
===================================================== */

const scene =
new THREE.Scene();


const camera =
new THREE.PerspectiveCamera(
  35,
  1,
  .1,
  100
);


camera.position.z =
5;


const renderer =
new THREE.WebGLRenderer({

  canvas,

  antialias:true,

  alpha:true

});


renderer.setPixelRatio(

  Math.min(
    devicePixelRatio,
    2
  )

);


/* =====================================================
   LIGHT
===================================================== */

scene.add(

  new THREE.AmbientLight(
    0x00ffaa,
    .35
  )

);


const keyLight =
new THREE.PointLight(
  0x00ffaa,
  3,
  20
);


keyLight.position.set(
  2,
  2,
  3
);


scene.add(
  keyLight
);


/* =====================================================
   DIGITAL TWIN BODY
===================================================== */

const orb =
new THREE.Mesh(

  new THREE.SphereGeometry(
    1.5,
    72,
    72
  ),

  new THREE.MeshPhysicalMaterial({

    transmission:.85,

    thickness:.8,

    roughness:.07,

    clearcoat:1,

    ior:1.48,

    color:
      0x00100c,

    emissive:
      0x002a1b,

    emissiveIntensity:
      .55,

    transparent:
      true,

    opacity:
      .82

  })

);


scene.add(
  orb
);


/* =====================================================
   ASYMPTOTIC CORE
===================================================== */

const core =
new THREE.Mesh(

  new THREE.SphereGeometry(
    .9,
    48,
    48
  ),

  new THREE.MeshStandardMaterial({

    color:
      0x001014,

    emissive:
      0x00ffaa,

    emissiveIntensity:
      2,

    transparent:
      true,

    opacity:
      .14

  })

);


scene.add(
  core
);


/* =====================================================
   DNA RINGS
===================================================== */

const rings =
[];


for(
  let i=0;
  i<3;
  i++
){

  const ring =
  new THREE.Mesh(

    new THREE.TorusGeometry(

      1.05 +
      i * .16,

      .014,

      16,

      160

    ),

    new THREE.MeshBasicMaterial({

      color:

        i === 1

        ? 0x00f3ff

        : 0x00ffaa,

      transparent:
        true,

      opacity:
        .62

    })

  );


  ring.rotation.x =
  Math.PI / 2;


  ring.rotation.y =
  rand() *
  Math.PI;


  rings.push(
    ring
  );


  scene.add(
    ring
  );

}


/* =====================================================
   AGENT PARTICLES

   Deterministically generated from DNA.
===================================================== */

const COUNT =
500;


const positions =
new Float32Array(
  COUNT * 3
);


for(
  let i=0;
  i<COUNT;
  i++
){

  const radius =
  .8 +
  rand() * 2;


  const theta =
  rand() *
  Math.PI *
  2;


  const phi =
  Math.acos(
    2 *
    rand() -
    1
  );


  positions[i*3] =

  radius *
  Math.sin(phi) *
  Math.cos(theta);


  positions[i*3+1] =

  radius *
  Math.sin(phi) *
  Math.sin(theta);


  positions[i*3+2] =

  radius *
  Math.cos(phi);

}


const pGeo =
new THREE.BufferGeometry();


pGeo.setAttribute(

  "position",

  new THREE.BufferAttribute(
    positions,
    3
  )

);


const particles =
new THREE.Points(

  pGeo,

  new THREE.PointsMaterial({

    color:
      0x00ffaa,

    size:
      .018,

    transparent:
      true,

    opacity:
      .72

  })

);


scene.add(
  particles
);


/* =====================================================
   ASYMPTOTIC ITERATION
===================================================== */

const S = {

  E:.32,

  tau:0,

  targets:[
    .42,
    .55,
    .78,
    .35
  ],

  gain:.022,

  expression:0,

  targetExpression:0

};


/* =====================================================
   EXPRESS / COLLAPSE
===================================================== */

function express(){

  S.targetExpression =

  S.targetExpression
  ? 0
  : 1;


  host.classList.toggle(

    "expressed",

    Boolean(
      S.targetExpression
    )

  );


  phase.textContent =

  S.targetExpression

  ? "QR://LIVE"

  : "DNA";

}


host.addEventListener(
  "click",
  event => {

    /*
      Don't intercept portal / QR clicks.
    */

    if(
      event.target.closest(
        "a"
      )
    )
    return;


    express();

  }
);


/* =====================================================
   RESPONSIVE RENDERER
===================================================== */

function resize(){

  const rect =
  host.getBoundingClientRect();


  renderer.setSize(

    rect.width,

    rect.height,

    false

  );


  camera.aspect =
  rect.width /
  rect.height;


  camera.updateProjectionMatrix();

}


new ResizeObserver(
  resize
)
.observe(
  host
);


resize();


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );


  const target =
  S.targets[
    S.tau
  ];


  S.E +=

  (
    target -
    S.E
  ) *

  S.gain;


  if(

    Math.abs(
      target -
      S.E
    )

    < .01

  ){

    S.tau =

    (
      S.tau + 1
    )

    %

    S.targets.length;

  }


  S.expression +=

  (
    S.targetExpression -
    S.expression
  )

  * .06;


  orb.rotation.y +=
  .0028;


  particles.rotation.y -=
  .0011;


  particles.rotation.x +=
  .00025;


  rings.forEach(
    (ring,i) => {

      ring.rotation.z +=

      (
        .0015 +
        i *
        .0007
      )

      *

      (
        i % 2
        ? -1
        : 1
      );

    }
  );


  /*
    As QR expresses,
    Three.js phenotype expands away.
  */

  const spread =

  1 +
  S.expression *
  .28;


  particles.scale.setScalar(
    spread
  );


  orb.material.opacity =

  .82 -
  S.expression *
  .52;


  core.material.opacity =

  .14 -
  S.expression *
  .09;


  const coreScale =
  1 +
  S.E *
  .25;


  core.scale.setScalar(
    coreScale
  );


  rings.forEach(
    ring =>

    ring.scale.setScalar(
      .9 +
      S.E *
      .40
    )

  );


  orb.material.emissiveIntensity =
  .4 +
  S.E;


  eText.textContent =

  "E=" +
  S.E.toFixed(3);


  tText.textContent =

  "τ=" +
  S.tau;


  renderer.render(
    scene,
    camera
  );

}


animate();


/* =====================================================
   INITIAL EXPRESSION
===================================================== */

setTimeout(
  express,
  1800
);


/* =====================================================
   IDENTITY
===================================================== */

console.log(

  "DNA://",
  DNA

);


console.log(

  "IDENTITY://SHA256/",
  HASH

);

</script>
