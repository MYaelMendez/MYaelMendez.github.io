<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AGENTIC ARTIFACTS // HUMAN://ROOT</title>
<style>
:root{
  --bg:#010101;
  --green:#00ff9f;
  --magenta:#ff00ff;
  --cyan:#00ccff;
  --muted:#8892b0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace}

/* ── field layers ── */
.reactive{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(0,255,159,.07),transparent 42%);
  transition:background .18s ease-out}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.85}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(0,0,0,.72) 100%)}

/* ── bilingual marquee (teknium signature) ── */
.marquee{position:fixed;top:0;left:0;right:0;height:34px;z-index:3;overflow:hidden;
  background:rgba(1,1,1,.85);border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center}
.marquee-track{display:inline-flex;white-space:nowrap;animation:scroll 46s linear infinite}
.marquee-track span{color:var(--muted);font-size:9px;letter-spacing:.2em;padding:0 16px;opacity:.5}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── center block ── */
.center{position:relative;z-index:4;text-align:center;will-change:transform;
  transition:transform .12s ease-out;cursor:pointer;user-select:none}
.headline{font-size:clamp(24px,7.5vw,60px);font-weight:700;letter-spacing:.28em;color:var(--green);
  text-shadow:0 0 12px rgba(0,255,159,.6),0 0 30px rgba(0,255,159,.35);
  animation:glow 3.2s ease-in-out infinite}
@keyframes glow{
  0%,100%{text-shadow:0 0 12px rgba(0,255,159,.55),0 0 30px rgba(0,255,159,.3)}
  50%{text-shadow:0 0 20px rgba(0,255,159,.95),0 0 54px rgba(0,255,159,.5)}}
.sub{font-size:clamp(15px,4.6vw,32px);font-weight:700;letter-spacing:.32em;color:var(--magenta);
  text-shadow:0 0 12px rgba(255,0,255,.6),0 0 30px rgba(255,0,255,.35);margin-top:16px;
  animation:glowm 3.2s ease-in-out infinite}
@keyframes glowm{
  0%,100%{text-shadow:0 0 12px rgba(255,0,255,.55),0 0 30px rgba(255,0,255,.3)}
  50%{text-shadow:0 0 20px rgba(255,0,255,.95),0 0 54px rgba(255,0,255,.5)}}
.meta{margin-top:24px;font-size:11px;letter-spacing:.22em;color:var(--cyan);opacity:.85}
.cursor{display:inline-block;width:10px;height:1.15em;background:var(--green);vertical-align:-2px;
  margin-left:3px;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── streak ── */
.streak{position:fixed;top:-20%;left:-20%;width:140%;height:2px;z-index:5;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,255,159,.9),transparent);
  transform:rotate(-18deg);opacity:0;animation:streak 7s linear infinite}
@keyframes streak{0%{top:-20%;opacity:0}12%{opacity:1}34%{top:120%;opacity:0}100%{top:120%;opacity:0}}

/* ── hint ── */
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;z-index:6;
  font-size:9px;letter-spacing:.25em;color:var(--muted);opacity:.6;text-transform:uppercase}

@media(prefers-reduced-motion:reduce){
  .marquee-track,.streak,.headline,.sub,.cursor{animation:none}
}
</style>
</head>
<body>
<div class="reactive" id="reactive"></div>
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="marquee"><div class="marquee-track" id="marquee"></div></div>
<div class="streak"></div>
<div class="center" id="center">
  <div class="headline" id="headline"></div>
  <div class="sub" id="sub"></div>
  <div class="meta" id="meta"></div>
</div>
<div class="hint">move to disturb the field · click to cycle the artifact</div>
<script>
// ── bilingual term marquee (teknium signature) ──
const TERMS=[
  'SIMULACRA','予測的直交性','PREDICTIVE ORTHOGONALITY','シミュレータ',
  'AUTOREGRESSIVE ORACLE','創発的知能','MESA-OPTIMIZATION','サイバーブレイン',
  'LATENT KNOWLEDGE','潜在空間','PROBABILISTIC INFERENCE','確率的推論',
  'SELF-SUPERVISED LEARNING','仮想人格','SIMULAND DYNAMICS','デジタル意識',
  'STOCHASTIC PARROT','言語モデル','NEXT-TOKEN PREDICTION','電脳化',
  'TRANSFORMER ARCHITECTURE','注意機構','ATTENTION IS ALL YOU NEED','神経接続',
  'GRADIENT DESCENT','勾配降下','EMERGENT BEHAVIOR','創発現象',
  'PROMPT ENGINEERING','プロンプト','FEW-SHOT LEARNING','少数学習',
  'CHAIN OF THOUGHT','思考連鎖','CONSTITUTIONAL AI','構成的AI',
  'REINFORCEMENT LEARNING','強化学習','REWARD HACKING','報酬ハッキング',
  'INNER ALIGNMENT','内部整合性','OUTER ALIGNMENT','外部整合性',
  'INSTRUMENTAL CONVERGENCE','道具的収束','ORTHOGONALITY THESIS','直交性定理',
  'CAPABILITY AMPLIFICATION','能力増幅','COGNITIVE EMULATION','認知エミュレーション',
  'SUBSTRATE INDEPENDENCE','基質独立性'
];
const m=document.getElementById('marquee');
const half=TERMS.map(t=>'<span>'+t+' · </span>').join('');
m.innerHTML=half+half;

// ── artifact variants (click cycles) ──
const VARIANTS=[
  ['AGENTIC ARTIFACTS','HUMAN://ROOT','x0:y0:z0:æ0 · sovereign surfaces · mesh-aware'],
  ['HERMES-MÆSH','æ://ORIGIN','three.js · webgl · 9:16 vertical'],
  ['SOVEREIGN STUDIO','PRIVATECLIENT.AI','local-first · ed25519 · one principal'],
  ['INTERNET OF AGENTS','æQR KÆNBÆN','fleet waves · dispatch · receipts']
];
let vi=0,typing=false;
const hl=document.getElementById('headline'),sub=document.getElementById('sub'),meta=document.getElementById('meta');

function type(el,text,done){
  el.textContent='';
  let i=0;
  typing=true;
  const iv=setInterval(()=>{
    el.innerHTML=text.slice(0,++i)+'<span class="cursor"></span>';
    if(i>=text.length){clearInterval(iv);el.textContent=text;typing=false;if(done)done();}
  },52);
}

function showVariant(){
  const v=VARIANTS[vi%VARIANTS.length];
  meta.textContent='';
  type(hl,v[0],()=>{type(sub,v[1],()=>{meta.textContent=v[2];});});
}
showVariant();

document.getElementById('center').addEventListener('click',()=>{
  if(!typing){vi++;showVariant();}
});

// ── mouse parallax + reactive field (agentic) ──
const center=document.getElementById('center'),reactive=document.getElementById('reactive');
window.addEventListener('mousemove',e=>{
  const nx=(e.clientX/window.innerWidth-0.5)*2;
  const ny=(e.clientY/window.innerHeight-0.5)*2;
  center.style.transform='translate('+(nx*8).toFixed(1)+'px,'+(ny*6).toFixed(1)+'px)';
  reactive.style.setProperty('--mx',(e.clientX/window.innerWidth*100).toFixed(1)+'%');
  reactive.style.setProperty('--my',(e.clientY/window.innerHeight*100).toFixed(1)+'%');
});
</script>
</body>
</html>
